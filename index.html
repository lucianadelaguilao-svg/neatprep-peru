<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F9E8EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NeatPrep" />
  <title>NeatPrep &amp; NutriTrack</title>
  <style>
    :root {
      --bg-app: #FDF7F9;
      --bg-surface: #FFFFFF;
      --bg-soft: #FCEEF3;
      --bg-tint: #F8E2EA;
      --border: #F2D6E0;
      --border-strong: #E4B8C8;
      --text-main: #2A1920;
      --text-muted: #6E525D;
      --text-soft: #967783;
      --rose: #D45B84;
      --rose-dark: #B5436A;
      --rose-badge-bg: #FBE3EC;
      --rose-badge-text: #A8375E;
      --mint-bg: #E8F6F0;
      --mint-text: #1E6B4E;
      --amber-bg: #FFF4E2;
      --amber-text: #8F560A;
      --danger-bg: #FDECEC;
      --danger-text: #A62626;
      --shadow-sm: 0 2px 10px rgba(180, 67, 106, 0.06);
      --shadow-md: 0 8px 24px rgba(180, 67, 106, 0.12);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --radius-pill: 999px;
      --nav-height: 70px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F4E4EA;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .phone-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(74, 24, 43, 0.14);
    }

    @media (min-width: 520px) {
      body {
        padding: 16px;
        align-items: center;
      }
      .phone-shell {
        height: min(910px, calc(100dvh - 32px));
        border-radius: 36px;
        border: 6px solid #3B232C;
      }
    }

    .topbar {
      background: rgba(253, 247, 249, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      z-index: 20;
      flex-shrink: 0;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, #E3789C, var(--rose-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(181, 67, 106, 0.24);
    }

    .brand-title {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-status {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--rose-badge-text);
      font-size: 11.5px;
      font-weight: 750;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .macro-strip {
      margin-top: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }

    .macro-item-val {
      font-size: 12px;
      font-weight: 750;
      color: var(--text-main);
    }

    .macro-item-lbl {
      font-size: 10px;
      color: var(--text-soft);
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      scroll-behavior: smooth;
    }

    .section-gap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 750;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .card-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 0;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    .btn-primary {
      background: var(--rose);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(212, 91, 132, 0.25);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: var(--rose-dark);
    }

    .btn-secondary {
      background: var(--bg-soft);
      color: var(--rose-badge-text);
      border: 1px solid var(--border-strong);
      font-weight: 700;
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary:active {
      background: var(--bg-tint);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      font-weight: 650;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 11.5px;
      border-radius: var(--radius-sm);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding-bottom: 2px;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 650;
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    .chip.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--rose-badge-bg);
      color: var(--rose-badge-text);
    }

    .badge-mint {
      background: var(--mint-bg);
      color: var(--mint-text);
    }

    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .recipe-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recipe-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .recipe-title {
      font-size: 14.5px;
      font-weight: 750;
      margin: 0;
    }

    .recipe-price {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--rose-dark);
      white-space: nowrap;
    }

    .macros-line {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-soft);
      padding: 6px 9px;
      border-radius: var(--radius-sm);
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(212, 91, 132, 0.14);
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
    }

    .check-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
    }

    .check-item.done .check-box {
      background: var(--rose);
      border-color: var(--rose);
    }

    .check-item.done .check-label {
      text-decoration: line-through;
      color: var(--text-soft);
    }

    .check-label {
      font-size: 13px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-track {
      height: 8px;
      background: var(--bg-tint);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #E3789C, var(--rose-dark));
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .progress-fill-mint {
      height: 100%;
      background: linear-gradient(90deg, #43B88C, #1E6B4E);
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .goal-box {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px;
    }

    .pantry-group-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--rose-dark);
      margin: 8px 0 5px;
    }

    .bmi-bar {
      position: relative;
      height: 10px;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, #8EC5FC 0%, #7ED9A6 25%, #7ED9A6 55%, #F7C97E 78%, #F28B82 100%);
      margin: 10px 0 6px;
    }

    .bmi-marker {
      position: absolute;
      top: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--rose-dark);
      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.28);
      transform: translateX(-50%);
    }

    .satiety-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sat-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 750;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-muted);
    }

    .sat-btn.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }

    .bottom-nav {
      height: var(--nav-height);
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      flex-shrink: 0;
      z-index: 20;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 650;
      color: var(--text-soft);
      padding: 4px 2px;
    }

    .nav-btn.active {
      color: var(--rose-dark);
      font-weight: 800;
    }

    .nav-icon {
      font-size: 16px;
      line-height: 1.1;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 25, 32, 0.42);
      backdrop-filter: blur(2px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-width: 440px;
      max-height: 86dvh;
      background: var(--bg-app);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .sheet-header {
      padding: 10px 16px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-strong);
      margin: 0 auto 10px;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      position: fixed;
      bottom: calc(var(--nav-height) + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #2A1920;
      color: #fff;
      font-size: 12.5px;
      font-weight: 650;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 80;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-note {
      text-align: center;
      padding: 20px 12px;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--bg-soft);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-strong);
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <div class="brand-icon">N</div>
          <div>
            <div class="brand-title">NeatPrep &amp; NutriTrack</div>
            <div class="brand-sub" id="headerSub">REWE · 5 tápers L–V</div>
          </div>
        </div>
        <div class="pill-status" id="headerBudgetPill">0,00 € / 45,00 €</div>
      </div>
      <div class="macro-strip" id="headerMacroStrip"></div>
    </header>

    <main class="scroll-area" id="mainContent"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-btn active" data-tab="hoy" onclick="switchTab('hoy')">
        <span class="nav-icon">⚡</span>
        <span>Hoy</span>
      </button>
      <button class="nav-btn" data-tab="recetas" onclick="switchTab('recetas')">
        <span class="nav-icon">🍲</span>
        <span>Recetas</span>
      </button>
      <button class="nav-btn" data-tab="tapers" onclick="switchTab('tapers')">
        <span class="nav-icon">🥡</span>
        <span>Tápers</span>
      </button>
      <button class="nav-btn" data-tab="super" onclick="switchTab('super')">
        <span class="nav-icon">🛒</span>
        <span>Súper</span>
      </button>
      <button class="nav-btn" data-tab="progreso" onclick="switchTab('progreso')">
        <span class="nav-icon">💗</span>
        <span>Progreso</span>
      </button>
      <button class="nav-btn" data-tab="cocina" onclick="switchTab('cocina')">
        <span class="nav-icon">⚙️</span>
        <span>Cocina</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" onclick="handleBackdropClick(event)">
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-header">
        <div class="sheet-handle"></div>
        <div class="row-between">
          <strong id="sheetTitle" style="font-size:15px;">Detalle</strong>
          <button class="btn-ghost" onclick="closeSheet()">✕ Cerrar</button>
        </div>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "neatprep_nutritrack_v4";

    const DEFAULT_PRICES = {
      pechuga_pollo: { name: "Pechuga de pollo", unit: "kg", aisle: "Carnes", price: 11.32, packSize: 0.6, packLabel: "bandeja 600 g" },
      carne_magra: { name: "Carne magra / molida res", unit: "kg", aisle: "Carnes", price: 17.98, packSize: 0.5, packLabel: "bandeja 500 g" },
      salmon: { name: "Filete de salmón", unit: "kg", aisle: "Pescados", price: 28.97, packSize: 0.3, packLabel: "pack 300 g (2 filetes)" },
      atun_lata: { name: "Atún al natural (lata ~150g)", unit: "ud", aisle: "Despensa", price: 1.59, packSize: 1, packLabel: "lata 150 g" },
      lentejas: { name: "Lentejas secas", unit: "kg", aisle: "Despensa", price: 3.70, packSize: 0.5, packLabel: "paquete 500 g" },
      arroz: { name: "Arroz basmati / integral", unit: "kg", aisle: "Despensa", price: 2.49, packSize: 1.0, packLabel: "bolsa 1 kg" },
      pasta: { name: "Tallarines / pasta", unit: "kg", aisle: "Despensa", price: 2.39, packSize: 0.5, packLabel: "paquete 500 g" },
      tomate: { name: "Tomate fresco / triturado", unit: "kg", aisle: "Verduras", price: 3.29, packSize: 0.5, packLabel: "pack 500 g" },
      espinaca: { name: "Espinaca fresca", unit: "kg", aisle: "Verduras", price: 7.99, packSize: 0.15, packLabel: "bolsa 150 g" },
      albahaca: { name: "Albahaca fresca", unit: "ud", aisle: "Verduras", price: 1.49, packSize: 1, packLabel: "maceta / manojo" },
      zanahoria: { name: "Zanahoria", unit: "kg", aisle: "Verduras", price: 1.99, packSize: 1.0, packLabel: "bolsa 1 kg" },
      papa: { name: "Papa", unit: "kg", aisle: "Verduras", price: 2.19, packSize: 1.5, packLabel: "malla 1,5 kg" },
      pepino: { name: "Pepino", unit: "ud", aisle: "Verduras", price: 0.89, packSize: 1, packLabel: "unidad" },
      lechuga: { name: "Lechuga / hojas verdes", unit: "ud", aisle: "Verduras", price: 1.19, packSize: 1, packLabel: "bolsa / pieza" },
      cebolla_ajo: { name: "Cebolla y ajo", unit: "kg", aisle: "Verduras", price: 2.69, packSize: 0.5, packLabel: "malla 500 g" },
      palta: { name: "Palta / aguacate", unit: "ud", aisle: "Verduras", price: 1.69, packSize: 1, packLabel: "unidad" },
      limon: { name: "Limón", unit: "ud", aisle: "Verduras", price: 0.49, packSize: 1, packLabel: "unidad" },
      arvejas: { name: "Arvejas verdes", unit: "kg", aisle: "Verduras", price: 3.49, packSize: 0.3, packLabel: "bolsa/lata 300 g" },
      aceite_oliva: { name: "Aceite de oliva virgen extra", unit: "L", aisle: "Despensa", price: 17.98, packSize: 0.5, packLabel: "botella 500 ml" },
      queso_fresco: { name: "Queso fresco light / ricotta", unit: "kg", aisle: "Lácteos", price: 8.99, packSize: 0.25, packLabel: "tarrina 250 g" },
      especias_aji: { name: "Ají amarillo / comino / sal", unit: "ud", aisle: "Despensa", price: 1.89, packSize: 1, packLabel: "frasco / sobre" }
    };

    // Opciones curadas y ordenadas para "Lo que ya tienes en casa"
    const PANTRY_OPTIONS = [
      { key: "aceite_oliva", label: "Aceite de oliva", group: "Básicos y condimentos" },
      { key: "especias_aji", label: "Sal / pimienta / comino / ají", group: "Básicos y condimentos" },
      { key: "cebolla_ajo", label: "Cebolla / ajo", group: "Básicos y condimentos" },
      { key: "limon", label: "Limón", group: "Básicos y condimentos" },
      { key: "arroz", label: "Arroz", group: "Granos, pasta y latas" },

    function fmtEur(val) {
      return Number(val || 0).toFixed(2).replace(".", ",") + " €";
    }

    function marketFactor() {
      if (state.supermarket === "ALDI") return 0.88;
      if (state.supermarket === "EDEKA") return 1.08;
      return 1.0;
    }

    function getUnitPrice(key) {
      const item = state.prices[key];
      if (!item) return 2.5;
      return item.price * marketFactor();
    }

    function getRecipeCost(recipe, servings = 1, excludePantry = true) {
      let total = 0;
      (recipe.ingredients || []).forEach(ing => {
        if (excludePantry && state.pantryKeys.includes(ing.key)) return;
        total += (ing.qty || 0) * servings * getUnitPrice(ing.key);
      });
      return total;
    }

    function getShoppingList() {
      const map = {};
      Object.values(state.tapers).forEach(recipeId => {
        const r = state.recipes.find(x => x.id === recipeId);
        if (!r) return;
        (r.ingredients || []).forEach(ing => {
          if (state.pantryKeys.includes(ing.key)) return;
          if (!map[ing.key]) {
            const meta = state.prices[ing.key] || { name: ing.key, unit: "ud", aisle: "Despensa", price: 2, packSize: 1, packLabel: "unidad" };
            map[ing.key] = {
              key: ing.key,
              name: meta.name,
              unit: meta.unit,
              aisle: meta.aisle || "Despensa",
              qty: 0,
              unitPrice: getUnitPrice(ing.key),
              packSize: meta.packSize || 1,
              packLabel: meta.packLabel || meta.unit
            };
          }
          map[ing.key].qty += Number(ing.qty || 0);
        });
      });
      return Object.values(map).map(item => {
        const packsNeeded = Math.max(1, Math.ceil(item.qty / item.packSize));
        return {
          ...item,
          cost: item.qty * item.unitPrice,
          packsNeeded
        };
      });
    }

    function getTotalShoppingCost() {
      return getShoppingList().reduce((sum, item) => sum + item.cost, 0);
    }

    function getBodyGoalMetrics() {
      const latestW = state.weightLogs[state.weightLogs.length - 1] || { weight: 69.0 };
      const currentKg = Number(latestW.weight) || 69.0;
      const startKg = Math.max(currentKg, Number(state.bodyGoals.startWeight) || 69.0);
      const milestoneKg = Number(state.bodyGoals.milestoneKg) || 64.0;
      const annualKg = Number(state.bodyGoals.annualKg) || 60.0;

      const totalToMilestone = Math.max(0.1, startKg - milestoneKg);
      const lostSoFar = Math.max(0, startKg - currentKg);
      const milestonePct = Math.max(0, Math.min(100, Math.round((lostSoFar / totalToMilestone) * 100)));
      const remMilestone = Math.max(0, currentKg - milestoneKg);

      const totalToAnnual = Math.max(0.1, startKg - annualKg);
      const annualPct = Math.max(0, Math.min(100, Math.round((lostSoFar / totalToAnnual) * 100)));
      const remAnnual = Math.max(0, currentKg - annualKg);

      const deficit = Math.max(300, Number(state.bodyProfile.deficit) || 550);
      const weeklyLossKg = (deficit * 7) / 7700;
      const weeksTo64 = remMilestone > 0 ? Math.ceil(remMilestone / weeklyLossKg) : 0;
      const etaDate = new Date();
      etaDate.setDate(etaDate.getDate() + weeksTo64 * 7);
      const etaStr = etaDate.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });

      return {
        currentKg,
        startKg,
        milestoneKg,
        annualKg,
        milestonePct,
        remMilestone,
        annualPct,
        remAnnual,
        weeklyLossKg,
        weeksTo64,
        etaStr
      };
    }

    function shareRecipe(id) {
      const r = state.recipes.find(x => x.id === id);
      if (!r) return;
      const text = `🍲 ${r.title} (${r.kcal} kcal | ${r.protein}g prot | ${r.carbs}g carb)\nIngredientes:\n` +
        (r.ingredients || []).map(i => `• ${i.label}`).join("\n") +
        `\nPasos:\n` + (r.steps || []).map((s, idx) => `${idx + 1}. ${s}`).join("\n") +
        (r.tiktokUrl ? `\nVideo: ${r.tiktokUrl}` : "");

      if (navigator.share) {
        navigator.share({ title: r.title, text }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast("Receta copiada para enviar a tu amiga"));
      } else {
        showToast("Receta lista");
      }
    }

        counts[id] = (counts[id] || 0) + 1;
      });

      const rowsHtml = days.map(day => {
        const rId = state.tapers[day];
        const r = state.recipes.find(x => x.id === rId) || state.recipes[0];
        totalKcal += r.kcal;
        totalProt += r.protein;
        totalCarbs += r.carbs;
        const sat = state.satietyScores[day] || 4;
        const batchCount = counts[r.id] || 1;

        return `

            <div style="font-size:14px; font-weight:750; margin-bottom:3px;">${r.title}</div>
            <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:8px;">
              ${r.kcal} kcal · ${r.protein}g prot · ${r.carbs}g carb · ${r.timeMin} min

            <div style="font-size:11.5px; background:var(--bg-soft); padding:7px 9px; border-radius:var(--radius-sm); color:var(--text-muted); margin-bottom:8px;">

            <div style="margin-bottom:8px;">
              <label style="font-size:10.5px;">Resto del día (desayuno / cena / snacks)</label>
              <input type="text" style="font-size:12px; padding:6px 9px;" value="${escapeAttr(state.dayExtras[day] || "")}" onchange="updateDayExtra('${day}', this.value)" placeholder="Añade desayuno y cena para cuadrar macros..." />
            </div>

            <div class="row-between" style="margin-bottom:9px;">
              <span style="font-size:11px; color:var(--text-muted); font-weight:650;">Saciedad / energía post-comida:</span>
              <div class="satiety-row">
                ${[1,2,3,4,5].map(n => `
                  <button class="sat-btn ${sat === n ? "active" : ""}" onclick="setSatiety('${day}', ${n})">${n}</button>
                `).join("")}

            <div class="row-between">
              <button class="btn-secondary btn-sm" onclick="openRecipeSheet('${r.id}')">Receta</button>
              <div style="display:flex; gap:6px;">
                <button class="btn-secondary btn-sm" onclick="openBatchAssignSheet('${r.id}')">Batch ×2/3</button>

          <div class="card-soft">
            <div class="row-between">
              <div>
                <div class="card-title">Tápers L–V &amp; Batch Cooking</div>
                <div class="card-sub">Prom. almuerzo: <strong>${Math.round(totalKcal / 5)} kcal</strong> · <strong>${Math.round(totalProt / 5)}g prot</strong> · <strong>${Math.round(totalCarbs / 5)}g carb</strong></div>
              </div>
              <button class="btn-secondary btn-sm" onclick="autoFillTapers()">Auto-armar</button>
            </div>
          </div>
          ${rowsHtml}

      `;

      state.satietyScores[day] = score;
      saveState();
      render();
      showToast(`Saciedad ${day}: ${score}/5`);
    }

      state.dayExtras[day] = val;
      saveState();

    function autoFillTapers() {
      const pool = state.recipes.filter(r => r.taperFriendly !== false);
      const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
      days.forEach((d, idx) => {
        state.tapers[d] = pool[idx % pool.length].id;
      });

      render();
      showToast("Tápers L–V actualizados");

    function renderSuper(container) {
      const list = getShoppingList();
      const totalCost = getTotalShoppingCost();
      const checkedCount = list.filter(i => state.checkedShopping[i.key]).length;
      const pct = list.length ? Math.round((checkedCount / list.length) * 100) : 0;

              `).join("")}
            </div>
            <div class="row-between" style="font-size:11.5px; color:var(--text-muted); margin-bottom:5px;">
              <span>Carrito: ${checkedCount}/${list.length}</span>

      `;

    async function toggleWakeLock() {
      if (!("wakeLock" in navigator)) {
        showToast("Tu navegador mantiene la pantalla activa manualmente");
        return;
      }
      try {
        if (wakeLockObj) {
          await wakeLockObj.release();
          wakeLockObj = null;
          showToast("Modo pasillo desactivado");
        } else {
          wakeLockObj = await navigator.wakeLock.request("screen");
          showToast("Pantalla encendida activa para comprar");
        }
        render();
      } catch (e) {
        showToast("No se pudo fijar pantalla");
      }
    }

      state.supermarket = m;
      saveState();
      render();
      showToast(`Supermercado: ${m}`);
    }

    function toggleShoppingItem(key) {
      state.checkedShopping[key] = !state.checkedShopping[key];
      saveState();
      render();
    }

    function renderProgreso(container) {
      const g = getBodyGoalMetrics();
      const latestW = state.weightLogs[state.weightLogs.length - 1] || { weight: 69.0, date: "Hoy" };
      const firstW = state.weightLogs[0] || latestW;
      const diffW = (Number(latestW.weight) - Number(firstW.weight)).toFixed(1);

      const heightCm = Math.max(120, Math.min(220, Number(state.bodyProfile.heightCm) || 158));
      const heightM = heightCm / 100;
      const weightKg = Math.max(30, Number(latestW.weight) || 69.0);

      const bmi = weightKg / (heightM * heightM);
      const bmiAt64 = g.milestoneKg / (heightM * heightM);
      const bmiAt60 = g.annualKg / (heightM * heightM);

      let bmiCategory = "Normopeso";
      let bmiColor = "var(--mint-text)";
      if (bmi < 18.5) {
        bmiCategory = "Bajo peso";
        bmiColor = "#2B6CB0";
      } else if (bmi >= 25 && bmi < 30) {
        bmiCategory = "Sobrepeso";
        bmiColor = "var(--amber-text)";
      } else if (bmi >= 30) {
        bmiCategory = "Obesidad";
        bmiColor = "var(--danger-text)";
      }

      const bmiPct = Math.max(4, Math.min(96, ((bmi - 16) / (35 - 16)) * 100));
      const healthyMinKg = (18.5 * heightM * heightM).toFixed(1);
      const healthyMaxKg = (24.9 * heightM * heightM).toFixed(1);

      const age = Math.max(15, Number(state.bodyProfile.age) || 21);
      const bmr = Math.round(10 * weightKg + 6.25 * heightCm - 5 * age - 161);
      const activity = Number(state.bodyProfile.activity) || 1.55;
      const tdee = Math.round(bmr * activity);
      const deficitVal = Number(state.bodyProfile.deficit) || 550;
      const targetKcal = Math.max(1250, tdee - deficitVal);
      const suggestedProt = Math.round(weightKg * 1.9);

      const todayStr = new Date().toISOString().slice(0, 10);
      const trainedToday = state.workouts.some(w => w.date === todayStr);
      const carbTargetToday = trainedToday ? 140 : 120;

      const todayStepsObj = state.stepsLogs.find(s => s.date === todayStr) || state.stepsLogs[state.stepsLogs.length - 1] || { date: todayStr, steps: 0 };
      const stepsPct = Math.min(100, Math.round((Number(todayStepsObj.steps || 0) / Math.max(1000, state.stepsGoal)) * 100));

      const medsDone = state.meds.filter(m => m.checked).length;

      container.innerHTML = `
        <div class="section-gap">
          <div class="card">
            <div class="row-between" style="margin-bottom:8px;">
              <div>
                <div class="card-title">🎯 Mis Body Goals</div>

              <button class="btn-secondary btn-sm" onclick="openBodyGoalsSheet()">Editar metas</button>
            </div>

            <div class="goal-box" style="margin-bottom:9px;">
              <div class="row-between" style="margin-bottom:4px;">
                <span style="font-size:13px; font-weight:800; color:var(--mint-text);">Fase 1: ${g.milestoneKg.toFixed(1)} kg (Rápido y saludable)</span>
                <span class="badge badge-mint">${g.milestonePct}%</span>
              </div>
              <div class="progress-track" style="margin-bottom:6px;">
                <div class="progress-fill-mint" style="width:${g.milestonePct}%;"></div>
              </div>
              <div style="font-size:11.5px; color:var(--text-muted);">
                Faltan <strong>${g.remMilestone.toFixed(1)} kg</strong> · Ritmo saludable: <strong>~${g.weeklyLossKg.toFixed(2)} kg/sem</strong> (${g.weeksTo64 > 0 ? `~${g.weeksTo64} semanas · meta aprox. ${g.etaStr}` : "¡Objetivo cumplido!"}) · BMI en 64 kg: <strong>${bmiAt64.toFixed(1)}</strong>.
              </div>
            </div>

            <div class="goal-box">
              <div class="row-between" style="margin-bottom:4px;">
                <span style="font-size:13px; font-weight:800; color:var(--rose-dark);">Meta ${state.bodyGoals.annualYear}: ${g.annualKg.toFixed(1)} kg</span>
                <span class="badge">${g.annualPct}%</span>
              </div>
              <div class="progress-track" style="margin-bottom:6px;">
                <div class="progress-fill" style="width:${g.annualPct}%;"></div>
              </div>
              <div style="font-size:11.5px; color:var(--text-muted);">
                Faltan <strong>${g.remAnnual.toFixed(1)} kg</strong> para alcanzar tu objetivo anual · BMI proyectado en 60 kg: <strong>${bmiAt60.toFixed(1)} (Normopeso)</strong>.
              </div>
            </div>
          </div>

          <div class="card">
            <div class="row-between" style="margin-bottom:4px;">
              <div>
                <div class="card-title">Calculadora de BMI &amp; Déficit Calórico</div>

            </div>

            </div>
            <div class="row-between" style="font-size:10px; color:var(--text-soft); margin-bottom:10px;">

              <span>18,5–24,9 Normal</span>
              <span>25–29,9 Sobrepeso</span>
              <span>≥30</span>
            </div>

            <div class="grid-3" style="margin-bottom:10px;">
              <div class="card-soft" style="padding:9px; text-align:center;">
                <div style="font-size:15px; font-weight:800;">${bmr}</div>
                <div style="font-size:10px; color:var(--text-muted);">Basal (BMR)</div>
              </div>
              <div class="card-soft" style="padding:9px; text-align:center;">
                <div style="font-size:15px; font-weight:800;">${tdee}</div>
                <div style="font-size:10px; color:var(--text-muted);">Gasto (TDEE)</div>

            <div class="grid-2">
              <div>
                <label>Estatura (cm)</label>

              </div>
              <div>
                <label>Edad (años)</label>
                <input type="number" id="bpAge" min="16" max="85" value="${age}" onchange="updateBodyProfile()" />

                  <option value="1.725" ${activity == 1.725 ? "selected" : ""}>Alta (6–7 días / fuerza + natación)</option>
                </select>
              </div>
              <div>
                <label>Ritmo de déficit</label>
                <select id="bpDeficit" onchange="updateBodyProfile()">
                  <option value="400" ${deficitVal == 400 ? "selected" : ""}>Moderado (-400 kcal/día)</option>
                  <option value="550" ${deficitVal == 550 ? "selected" : ""}>Rápido saludable (-550 kcal/día)</option>
                  <option value="650" ${deficitVal == 650 ? "selected" : ""}>Intenso seguro (-650 kcal/día)</option>
                </select>
              </div>
            </div>

            <div style="margin-top:9px; font-size:11.5px; color:var(--text-muted);">
              Proteína objetivo: <strong>${suggestedProt} g/día</strong> · Carbos sugeridos hoy (${trainedToday ? "día de entreno" : "día base"}): <strong>≤${carbTargetToday} g</strong>.

            <button class="btn-primary" style="width:100%; margin-top:10px;" onclick="applyCalculatedTargets(${targetKcal}, ${suggestedProt}, ${carbTargetToday})">

            </div>
            ${renderWeightChartSvg(state.weightLogs)}

    function renderWeightChartSvg(logs) {
      if (!logs || logs.length < 2) {
        return `<div style="font-size:12px; color:var(--text-soft); padding:8px; background:var(--bg-soft); border-radius:10px;">Registra tu siguiente pesaje para ver la curva hacia 64 kg y 60 kg.</div>`;
      }
      const recent = logs.slice(-8);
      const weights = recent.map(x => Number(x.weight));
      const minW = Math.min(...weights) - 0.5;
      const maxW = Math.max(...weights) + 0.5;
      const span = Math.max(0.5, maxW - minW);
      const W = 340, H = 96, padX = 18, padY = 16;

      const pts = recent.map((item, idx) => {
        const x = padX + (idx / (recent.length - 1)) * (W - padX * 2);
        const y = H - padY - ((Number(item.weight) - minW) / span) * (H - padY * 2);
        return { x, y, w: Number(item.weight).toFixed(1) };
      });

      const polyline = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      const circles = pts.map(p => `
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#B5436A" />
        <text x="${p.x.toFixed(1)}" y="${(p.y - 7).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6E525D">${p.w}</text>
      `).join("");

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:96px; background:var(--bg-soft); border-radius:12px; border:1px solid var(--border);">
          <polyline fill="none" stroke="#D45B84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polyline}" />
          ${circles}
        </svg>
      `;
    }

          <input type="number" step="0.1" id="wlWeight" value="${last.weight}" />
        </div>
        <button class="btn-primary" onclick="saveWeightLog()">Guardar peso</button>
      `);
    }

    function saveWeightLog() {
      const date = document.getElementById("wlDate").value || new Date().toISOString().slice(0, 10);
      const weight = Number(document.getElementById("wlWeight").value);
      if (!weight || weight <= 20) return;
      state.weightLogs.push({ id: "w_" + Date.now(), date, weight });
      saveState();
      closeSheet();
      render();
      showToast("Peso guardado y Body Goals actualizados");
    }

    function openStepsSheet() {
      const today = new Date().toISOString().slice(0, 10);
      const existing = state.stepsLogs.find(s => s.date === today) || { steps: "" };
      openSheet("Registrar pasos del día", `
        <p class="card-sub">Pega o escribe el total de pasos de hoy desde Salud / Atajos:</p>
        <div>
          <label>Pasos de hoy</label>
          <input type="number" step="100" id="stCount" value="${existing.steps}" placeholder="Ej. 8500" />
        </div>
        <button class="btn-primary" onclick="saveStepsLog()">Guardar pasos</button>
      `);
    }

    function saveStepsLog() {
      const today = new Date().toISOString().slice(0, 10);
      const steps = Math.max(0, Number(document.getElementById("stCount").value) || 0);
      const idx = state.stepsLogs.findIndex(s => s.date === today);
      if (idx >= 0) state.stepsLogs[idx].steps = steps;
      else state.stepsLogs.push({ date: today, steps });
      saveState();
      closeSheet();
      render();
      showToast(`Pasos guardados: ${steps.toLocaleString("es-ES")}`);
    }

    function openAddMedSheet() {
      openSheet("Añadir toma / tratamiento", `
        <div>
          <label>Nombre (fármaco o suplemento)</label>
          <input type="text" id="medName" placeholder="Ej. Vitamina D3 / Inositol" />
        </div>
        <div>
          <label>Dosis y momento del día</label>
          <input type="text" id="medDose" placeholder="Ej. 2000 UI · con el almuerzo" />
        </div>
        <button class="btn-primary" onclick="saveMed()">Agregar toma</button>
      `);
    }

    function saveMed() {
      const name = document.getElementById("medName").value.trim();
      if (!name) return;
      const dose = document.getElementById("medDose").value.trim() || "Diario";
      state.meds.push({ id: "m_" + Date.now(), name, dose, checked: false });
      saveState();
      closeSheet();
      render();
      showToast("Toma agregada");
    }

    function openAddWorkoutSheet() {
      const today = new Date().toISOString().slice(0, 10);
      openSheet("Registrar sesión deportiva", `
        <div>
          <label>Tipo de entrenamiento</label>
          <select id="woType">
            <option value="Fuerza (Gym)">Fuerza (Gym)</option>
            <option value="Natación">Natación</option>
            <option value="Caminata / Cardio">Caminata / Cardio</option>
          </select>
        </div>
        <div class="grid-2">
          <div>
            <label>Duración (min)</label>
            <input type="number" id="woMin" value="45" />
          </div>
          <div>
            <label>Intensidad</label>
            <select id="woInt">
              <option value="Moderada">Moderada</option>
              <option value="Alta">Alta</option>
              <option value="Suave">Suave</option>
            </select>
          </div>
        </div>
        <div>
          <label>Fecha</label>
          <input type="date" id="woDate" value="${today}" />
        </div>
        <button class="btn-primary" onclick="saveWorkout()">Guardar sesión</button>
      `);
    }

    function saveWorkout() {
      const type = document.getElementById("woType").value;
      const minutes = Number(document.getElementById("woMin").value) || 30;
      const intensity = document.getElementById("woInt").value;
      const date = document.getElementById("woDate").value || new Date().toISOString().slice(0, 10);
      state.workouts.push({ id: "wo_" + Date.now(), type, minutes, intensity, date });
      saveState();
      closeSheet();
      render();
      showToast("Sesión deportiva registrada");
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    render();
  </script>
</body>
</html>
