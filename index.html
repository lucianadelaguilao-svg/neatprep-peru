      const fatTarget = Math.max(35, Number(m.targetFat || 55));

      const kcalPct = Math.min(100, Math.round((tot.kcal / Math.max(1, kcalTarget)) * 100));
      const protPct = Math.min(100, Math.round((tot.protein / Math.max(1, protTarget)) * 100));
      const carbPct = Math.min(100, Math.round((tot.carbs / Math.max(1, carbTarget)) * 100));
      const fatPct = Math.min(100, Math.round((tot.fat / Math.max(1, fatTarget)) * 100));
      const kcalRem = kcalTarget - tot.kcal;
      const kcalRemLabel = kcalRem >= 0 ? `Faltan ${kcalRem} kcal` : `+${Math.abs(kcalRem)} kcal sobre meta`;
      const carbPrefix = (m.isDiabetes || m.isIR || m.isPCOS) ? "≤" : "";

      const plannedLunch = getPlannedLunchForDate(key);
      const hasYesterday = getDailyDiaryTotals(shiftDateKey(key, -1)).count > 0;

      const slotsHtml = MEAL_SLOTS_META.map(slot => {
        const items = day[slot.id] || [];
        const st = getSlotTotals(items);
        return `
          <div class="meal-slot-card">
            <div class="row-between" style="margin-bottom:${items.length ? "8px" : "0"};">
              <div>
                <div style="font-size:13.5px; font-weight:800; color:var(--text-main);">${slot.icon} ${slot.label}</div>
                <div style="font-size:11px; color:var(--text-soft);">
                  ${items.length ? `<strong>${st.kcal}</strong> kcal · ${st.protein}g P · ${st.carbs}g C · ${st.fat}g G` : "Sin registrar aún"}
                </div>
              </div>
              <button class="btn-secondary btn-sm" onclick="openAddFoodSheet('${slot.id}')">+ Añadir</button>
            </div>
            ${items.length ? `
              <div style="display:flex; flex-direction:column; gap:6px;">
                ${items.map(item => `
                  <div class="meal-entry-row">
                    <div style="min-width:0; flex:1;">
                      <div style="font-size:12.5px; font-weight:750; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        ${escapeHtml(item.title)}${item.portion && item.portion !== 1 ? ` <span class="badge" style="padding:1px 5px; font-size:9.5px;">×${String(item.portion).replace(".", ",")}</span>` : ""}
                      </div>
                      <div style="font-size:11px; color:var(--text-muted);">
                        <strong>${item.kcal}</strong> kcal · ${item.protein}g P · ${item.carbs}g C · ${item.fat}g G
                      </div>
                    </div>
                    <button class="btn-ghost btn-sm" style="padding:2px 6px; color:var(--text-soft);" onclick="removeFoodEntry('${key}','${slot.id}','${item.id}')" title="Quitar">×</button>
                  </div>
                `).join("")}
              </div>
            ` : ""}
          </div>
        `;
      }).join("");

      return `
        <div class="date-nav-bar">
          <button class="btn-ghost btn-sm" onclick="changeDiaryDate(-1)">◀</button>
          <button class="btn-ghost btn-sm" style="font-weight:800; color:var(--text-main);" onclick="resetDiaryDateToday()">📅 ${escapeHtml(formatDiaryDateLabel(key))}</button>
          <button class="btn-ghost btn-sm" onclick="changeDiaryDate(1)">▶</button>
        </div>

        <div class="card">
          <div class="row-between" style="margin-bottom:6px;">
            <div>
              <div style="font-size:11px; font-weight:750; color:var(--text-soft); text-transform:uppercase;">Balance real del día</div>
              <div style="font-size:18px; font-weight:850; color:var(--text-main);">
                ${tot.kcal} <span style="font-size:12.5px; font-weight:650; color:var(--text-soft);">/ ${kcalTarget} kcal</span>
              </div>
            </div>
            <span class="badge ${kcalRem >= 0 ? "badge-mint" : "badge-amber"}">${kcalRemLabel}</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${kcalPct}%; background:${kcalRem < -120 ? "#D6913A" : "linear-gradient(90deg, var(--rose), var(--rose-dark))"};"></div>
          </div>

          <div class="macro-bars-grid">
            <div class="macro-bar-card">
              <div class="macro-bar-lbl">Proteína</div>
              <div class="macro-bar-val">${tot.protein}/${protTarget}g</div>
              <div class="macro-mini-track"><div class="macro-mini-fill" style="width:${protPct}%; background:#2E8B63;"></div></div>
            </div>
            <div class="macro-bar-card">
              <div class="macro-bar-lbl">Carbos</div>
              <div class="macro-bar-val">${tot.carbs}/${carbPrefix}${carbTarget}g</div>
              <div class="macro-mini-track"><div class="macro-mini-fill" style="width:${carbPct}%; background:${tot.carbs > carbTarget && carbPrefix ? "#C84E77" : "#8F4A65"};"></div></div>
            </div>
            <div class="macro-bar-card">
              <div class="macro-bar-lbl">Grasas</div>
              <div class="macro-bar-val">${tot.fat}/${fatTarget}g</div>
              <div class="macro-mini-track"><div class="macro-mini-fill" style="width:${fatPct}%; background:#D6913A;"></div></div>
            </div>
          </div>

          <div class="chip-row" style="margin-top:10px;">
            ${day.almuerzo.length === 0 && plannedLunch ? `<button class="chip active" onclick="logPlannedLunchToDiary('${key}')">✓ Añadir táper (${escapeHtml(plannedLunch.title.slice(0, 20))}…)</button>` : ""}
            ${hasYesterday && tot.count === 0 ? `<button class="chip" onclick="copyYesterdayDiary('${key}')">📋 Copiar ayer</button>` : ""}
          </div>
        </div>

        ${slotsHtml}
      `;
    }

    function openAddFoodSheet(slot, dateKey = null) {
      if (dateKey) diaryDateKey = dateKey;
      const defaultMode = slot === "almuerzo" ? "recipes" : "presets";
      activeFoodSheet = { slot: slot || "desayuno", mode: defaultMode, search: "", portion: 1 };
      renderAddFoodSheetContent();
    }

    function renderAddFoodSheetContent() {
      const slotMeta = MEAL_SLOTS_META.find(s => s.id === activeFoodSheet.slot) || MEAL_SLOTS_META[0];
      const q = (activeFoodSheet.search || "").trim().toLowerCase();
      const mult = Number(activeFoodSheet.portion || 1);

      let listHtml = "";
      if (activeFoodSheet.mode === "manual") {
        listHtml = `
          <div class="section-gap">
            <div>
              <label>Nombre de la comida o alimento</label>
              <input type="text" id="manualFoodTitle" placeholder="Ej. Yogur griego con avena, Latte, Café..." />
            </div>
            <div class="grid-2">
              <div>
                <label>Calorías (kcal)</label>
                <input type="number" id="manualFoodKcal" min="0" placeholder="Ej. 320" />
              </div>
              <div>
                <label>Proteína (g)</label>
                <input type="number" id="manualFoodProt" min="0" placeholder="Ej. 24" />
              </div>
            </div>
            <div class="grid-2">
              <div>
                <label>Carbohidratos (g)</label>
                <input type="number" id="manualFoodCarbs" min="0" placeholder="Ej. 28" />
              </div>
              <div>
                <label>Grasas (g)</label>
                <input type="number" id="manualFoodFat" min="0" placeholder="Ej. 11" />
              </div>
            </div>
            <button class="btn-primary" style="width:100%;" onclick="saveManualFoodEntry()">Añadir a ${slotMeta.label}</button>
          </div>
        `;
      } else if (activeFoodSheet.mode === "recipes") {
        const m = getAdaptiveNutritionMetrics();
        const recs = state.recipes
          .filter(r => !q || r.title.toLowerCase().includes(q) || (r.category || "").toLowerCase().includes(q) || getRecipeMealType(r).includes(q))
          .sort((a, b) => {
            const matchA = getRecipeMealType(a) === activeFoodSheet.slot ? 50 : 0;
            const matchB = getRecipeMealType(b) === activeFoodSheet.slot ? 50 : 0;
            return (getRecipeProfileMeta(b, m).score + matchB) - (getRecipeProfileMeta(a, m).score + matchA);
          });
        listHtml = recs.length ? `
          <div style="display:flex; flex-direction:column; gap:7px; max-height:46vh; overflow-y:auto;">
            ${recs.map(r => `
              <div class="preset-pick-row">
                <div style="min-width:0; flex:1;">
                  <div style="font-size:12.5px; font-weight:800; color:var(--text-main);">${escapeHtml(r.title)}</div>
                  <div style="font-size:11px; color:var(--text-muted);">
                    <strong>${Math.round(r.kcal * mult)}</strong> kcal · ${Math.round(r.protein * mult)}g P · ${Math.round(r.carbs * mult)}g C · ${Math.round(r.fat * mult)}g G
                  </div>
                </div>
                <button class="btn-primary btn-sm" style="flex-shrink:0;" onclick="pickRecipeForDiary('${r.id}')">+</button>
              </div>
            `).join("")}
          </div>
        ` : `<div class="empty-note">Sin recetas que coincidan. Prueba en <strong>✏️ Manual</strong>.</div>`;
      } else {
        const filteredPresets = DEFAULT_MEAL_PRESETS.filter(p => {
          if (q) return p.title.toLowerCase().includes(q) || (p.tag || "").toLowerCase().includes(q);
          return p.slot === activeFoodSheet.slot || (activeFoodSheet.slot === "almuerzo" && p.slot === "cena");
        });
        listHtml = filteredPresets.length ? `
          <div style="display:flex; flex-direction:column; gap:7px; max-height:46vh; overflow-y:auto;">
            ${filteredPresets.map(p => `
              <div class="preset-pick-row">
                <div style="min-width:0; flex:1;">
                  <div style="font-size:12.5px; font-weight:800; color:var(--text-main);">${escapeHtml(p.title)}</div>
                  <div style="font-size:11px; color:var(--text-muted);">
                    <strong>${Math.round(p.kcal * mult)}</strong> kcal · ${Math.round(p.protein * mult)}g P · ${Math.round(p.carbs * mult)}g C · ${Math.round(p.fat * mult)}g G
                  </div>
                </div>
                <button class="btn-primary btn-sm" style="flex-shrink:0;" onclick="pickPresetForDiary('${p.id}')">+</button>
              </div>
            `).join("")}
          </div>
        ` : `<div class="empty-note">Sin coincidencias. Usa <strong>Recetas</strong> o <strong>✏️ Manual</strong>.</div>`;
      }

      openSheet(`${slotMeta.icon} Añadir a ${slotMeta.label}`, `
        <div class="section-gap">
          <div class="seg-control cols-3">
            <button class="seg-btn ${activeFoodSheet.mode === "presets" ? "active" : ""}" onclick="setFoodSheetMode('presets')">⚡ Rápidos</button>
            <button class="seg-btn ${activeFoodSheet.mode === "recipes" ? "active" : ""}" onclick="setFoodSheetMode('recipes')">🍲 Recetas (${state.recipes.length})</button>
            <button class="seg-btn ${activeFoodSheet.mode === "manual" ? "active" : ""}" onclick="setFoodSheetMode('manual')">✏️ Manual</button>
          </div>

          ${activeFoodSheet.mode !== "manual" ? `
            <div class="search-box" style="margin-top:0;">
              <span class="search-ico">🔍</span>
              <input type="text" id="foodSheetSearchInput" value="${escapeAttr(activeFoodSheet.search)}" oninput="onFoodSheetSearch(this.value)" placeholder="Buscar: huevos, skyr, salmón, pollo, avena..." />
            </div>
            <div class="row-between" style="gap:6px;">
              <span style="font-size:11px; font-weight:750; color:var(--text-soft);">Porción:</span>
              <div class="chip-row" style="padding:0;">
                ${[0.5, 1, 1.5, 2].map(sc => `
                  <button class="chip ${activeFoodSheet.portion === sc ? "active" : ""}" onclick="setFoodSheetPortion(${sc})">×${String(sc).replace(".", ",")}</button>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <div id="foodSheetListArea">${listHtml}</div>
        </div>
      `);
    }

    function setFoodSheetMode(mode) {
      activeFoodSheet.mode = mode;
      renderAddFoodSheetContent();
    }

    function setFoodSheetPortion(sc) {
      activeFoodSheet.portion = sc;
      renderAddFoodSheetContent();
    }

    function onFoodSheetSearch(val) {
      activeFoodSheet.search = val;
      const area = document.getElementById("foodSheetListArea");
      if (!area) return;
      const q = (val || "").trim().toLowerCase();
      const mult = Number(activeFoodSheet.portion || 1);
      if (activeFoodSheet.mode === "recipes") {
        const m = getAdaptiveNutritionMetrics();
        const recs = state.recipes
          .filter(r => !q || r.title.toLowerCase().includes(q) || (r.category || "").toLowerCase().includes(q) || getRecipeMealType(r).includes(q))
          .sort((a, b) => {
            const matchA = getRecipeMealType(a) === activeFoodSheet.slot ? 50 : 0;
            const matchB = getRecipeMealType(b) === activeFoodSheet.slot ? 50 : 0;
            return (getRecipeProfileMeta(b, m).score + matchB) - (getRecipeProfileMeta(a, m).score + matchA);
          });
        area.innerHTML = recs.length ? `
          <div style="display:flex; flex-direction:column; gap:7px; max-height:46vh; overflow-y:auto;">
            ${recs.map(r => `
              <div class="preset-pick-row">
                <div style="min-width:0; flex:1;">
                  <div style="font-size:12.5px; font-weight:800; color:var(--text-main);">${escapeHtml(r.title)}</div>
                  <div style="font-size:11px; color:var(--text-muted);">
                    <strong>${Math.round(r.kcal * mult)}</strong> kcal · ${Math.round(r.protein * mult)}g P · ${Math.round(r.carbs * mult)}g C · ${Math.round(r.fat * mult)}g G
                  </div>
                </div>
                <button class="btn-primary btn-sm" style="flex-shrink:0;" onclick="pickRecipeForDiary('${r.id}')">+</button>
              </div>
            `).join("")}
          </div>
        ` : `<div class="empty-note">Sin coincidencias. Prueba en <strong>✏️ Manual</strong>.</div>`;
      } else if (activeFoodSheet.mode === "presets") {
        const filteredPresets = DEFAULT_MEAL_PRESETS.filter(p => {
          if (q) return p.title.toLowerCase().includes(q) || (p.tag || "").toLowerCase().includes(q);
          return p.slot === activeFoodSheet.slot || (activeFoodSheet.slot === "almuerzo" && p.slot === "cena");
        });
        area.innerHTML = filteredPresets.length ? `
          <div style="display:flex; flex-direction:column; gap:7px; max-height:46vh; overflow-y:auto;">
            ${filteredPresets.map(p => `
              <div class="preset-pick-row">
                <div style="min-width:0; flex:1;">
                  <div style="font-size:12.5px; font-weight:800; color:var(--text-main);">${escapeHtml(p.title)}</div>
                  <div style="font-size:11px; color:var(--text-muted);">
                    <strong>${Math.round(p.kcal * mult)}</strong> kcal · ${Math.round(p.protein * mult)}g P · ${Math.round(p.carbs * mult)}g C · ${Math.round(p.fat * mult)}g G
                  </div>
                </div>
                <button class="btn-primary btn-sm" style="flex-shrink:0;" onclick="pickPresetForDiary('${p.id}')">+</button>
              </div>
            `).join("")}
          </div>
        ` : `<div class="empty-note">Sin coincidencias. Usa <strong>Recetas</strong> o <strong>✏️ Manual</strong>.</div>`;
      }
    }

    function pickPresetForDiary(presetId) {
      const p = DEFAULT_MEAL_PRESETS.find(x => x.id === presetId);
      if (!p) return;
      const mult = Number(activeFoodSheet.portion || 1);
      addFoodEntryToDiary(diaryDateKey || getTodayDateKey(), activeFoodSheet.slot, {
        title: p.title,
        kcal: p.kcal * mult,
        protein: p.protein * mult,
        carbs: p.carbs * mult,
        fat: p.fat * mult,
        portion: mult
      });
      closeSheet();
      showToast(`Añadido a ${activeFoodSheet.slot} ✓`);
    }

    function pickRecipeForDiary(recipeId) {
      const r = state.recipes.find(x => x.id === recipeId);
      if (!r) return;
      const mult = Number(activeFoodSheet.portion || 1);
      addFoodEntryToDiary(diaryDateKey || getTodayDateKey(), activeFoodSheet.slot, {
        title: r.title,
        kcal: r.kcal * mult,
        protein: r.protein * mult,
        carbs: r.carbs * mult,
        fat: r.fat * mult,
        portion: mult
      });
      closeSheet();
      showToast(`Añadido a ${activeFoodSheet.slot} ✓`);
    }

    function saveManualFoodEntry() {
      const title = String(document.getElementById("manualFoodTitle")?.value || "").trim();
      const kcal = Number(document.getElementById("manualFoodKcal")?.value || 0);
      const protein = Number(document.getElementById("manualFoodProt")?.value || 0);
      const carbs = Number(document.getElementById("manualFoodCarbs")?.value || 0);
      const fat = Number(document.getElementById("manualFoodFat")?.value || 0);
      if (!title) {
        showToast("Escribe el nombre de la comida");
        return;
      }
      addFoodEntryToDiary(diaryDateKey || getTodayDateKey(), activeFoodSheet.slot, {
        title,
        kcal: kcal || Math.round(protein * 4 + carbs * 4 + fat * 9),
        protein,
        carbs,
        fat,
        portion: 1
      });
      closeSheet();
      showToast(`Añadido a ${activeFoodSheet.slot} ✓`);
    }

    function renderComida(container) {
      const totalHomeCount = state.pantryKeys.length + state.customPantry.length;
      const subNavHtml = `
        <div class="seg-control cols-4">
          <button class="seg-btn ${comidaSubTab === "diario" ? "active" : ""}" onclick="setComidaSubTab('diario')">📒 Diario</button>
          <button class="seg-btn ${comidaSubTab === "recetario" ? "active" : ""}" onclick="setComidaSubTab('recetario')">🍲 Recetas</button>
          <button class="seg-btn ${comidaSubTab === "tapers" ? "active" : ""}" onclick="setComidaSubTab('tapers')">🥡 Tápers</button>
          <button class="seg-btn ${comidaSubTab === "despensa" ? "active" : ""}" onclick="setComidaSubTab('despensa')">🏠 Casa (${totalHomeCount})</button>
        </div>
      `;

      let bodyHtml = "";
      if (comidaSubTab === "diario") bodyHtml = buildDiarioComidaHtml();
      else if (comidaSubTab === "recetario") bodyHtml = buildRecetarioHtml();
      else if (comidaSubTab === "tapers") bodyHtml = buildTapersHtml();
      else bodyHtml = buildDespensaHtml();

      container.innerHTML = `
        <div class="section-gap">
          ${subNavHtml}
          ${bodyHtml}
        </div>
      `;
    }

    function renderGroupedRecipesHtml(list) {
      if (!list.length) {
        return `<div class="empty-note">Sin recetas con este filtro. Toca <strong>Todo</strong> o <strong>Todas</strong> para ver los ${state.recipes.length} platos.</div>`;
      }
      if (recipeMealTypeFilter !== "all") {
        return list.map(r => renderRecipeCardHtml(r, true)).join("");
      }
      const groups = [
        { id: "desayuno", title: "🌅 Desayunos", items: list.filter(r => getRecipeMealType(r) === "desayuno") },
        { id: "almuerzo", title: "☀️ Almuerzos", items: list.filter(r => getRecipeMealType(r) === "almuerzo") },
        { id: "cena",     title: "🌙 Cenas",     items: list.filter(r => getRecipeMealType(r) === "cena") }
      ].filter(g => g.items.length > 0);

      return groups.map(g => `
        <div class="recipe-group-head">
          <span>${g.title}</span>
          <span class="badge">${g.items.length}</span>
        </div>
        ${g.items.map(r => renderRecipeCardHtml(r, true)).join("")}
      `).join("");
    }

    function buildRecetarioHtml() {
      const m = getAdaptiveNutritionMetrics();
      const cyclePhase = getActiveCyclePhase(m);
      const activeConds = (state.clinicalProfile?.conditions || []).map(c => CLINICAL_CONDITION_META[c]?.short).filter(Boolean);
      const profileTag = `${m.goalMeta.shortLabel}${activeConds.length ? " · " + activeConds.join("+") : ""}`;
      const cats = ["Todas", "Pollo", "Carne", "Atún / Salmón", "Lentejas", "TikTok Fit"];
      const primaryChips = [
        { id: "profile", label: "✨ Mi perfil" },
        ...(cyclePhase ? [{ id: "cycle", label: `🌙 Fase ${cyclePhase.short}` }] : []),
        { id: "all", label: "Todo" },
        { id: "fast15", label: "⚡ ≤15 min" },
        { id: "fav", label: "⭐ Favoritas" },
        { id: "pantry", label: "🏠 Mi casa" }
      ];
      const advancedChips = [
        { id: "hypertrophy", label: "💪 Volumen" },
        { id: "maintenance", label: "⚖️ Mant." },
        { id: "deficit_ir", label: "💚 Déficit / IR" },
        { id: "iron", label: "🩸 Hierro" },
        { id: "diabetes", label: "🩺 Diabetes" }
      ];
      const hasAdvActive = advancedChips.some(c => c.id === recipeQuickFilter) || recipeFilter !== "Todas";
      const filtered = getFilteredRecipes();
      const desCount = state.recipes.filter(r => getRecipeMealType(r) === "desayuno").length;
      const almCount = state.recipes.filter(r => getRecipeMealType(r) === "almuerzo").length;
      const cenCount = state.recipes.filter(r => getRecipeMealType(r) === "cena").length;

      return `
        <div class="card">
          <div class="row-between" style="margin-bottom:8px;">
            <div>
              <div class="card-title" style="margin:0;">Recetario (${state.recipes.length})</div>
              <div class="card-sub" style="font-size:11.5px;">${profileTag}</div>
            </div>
            <button class="btn-primary btn-sm" style="white-space:nowrap;" onclick="openAddTikTokSheet()">+ TikTok Fit</button>
          </div>

          <div class="seg-control cols-4" style="margin-bottom:8px;">
            <button class="seg-btn ${recipeMealTypeFilter === "all" ? "active" : ""}" onclick="setRecipeMealTypeFilter('all')">Todas</button>
            <button class="seg-btn ${recipeMealTypeFilter === "desayuno" ? "active" : ""}" onclick="setRecipeMealTypeFilter('desayuno')">🌅 Des. (${desCount})</button>
            <button class="seg-btn ${recipeMealTypeFilter === "almuerzo" ? "active" : ""}" onclick="setRecipeMealTypeFilter('almuerzo')">☀️ Alm. (${almCount})</button>
            <button class="seg-btn ${recipeMealTypeFilter === "cena" ? "active" : ""}" onclick="setRecipeMealTypeFilter('cena')">🌙 Cena (${cenCount})</button>
          </div>

          <div class="search-box" style="margin-top:0;">
            <span class="search-ico">🔍</span>
            <input type="text" id="recipeSearchInput" value="${escapeAttr(recipeSearch)}" oninput="onRecipeSearchInput(this.value)" placeholder="Buscar: huevos, salmón, pollo, lentejas..." />
          </div>

          <div class="chip-scroll" style="margin-top:8px;">
            ${primaryChips.map(qc => `<button class="chip ${recipeQuickFilter === qc.id ? "active" : ""}" onclick="setRecipeQuickFilter('${qc.id}')">${qc.label}</button>`).join("")}
          </div>

          <details ${hasAdvActive ? "open" : ""} style="margin-top:7px;">
            <summary style="cursor:pointer; font-size:11px; font-weight:750; color:var(--text-soft);">+ Más filtros (meta, enfermedad o proteína)</summary>
            <div class="chip-row" style="margin-top:6px;">
              ${advancedChips.map(qc => `<button class="chip ${recipeQuickFilter === qc.id ? "active" : ""}" onclick="setRecipeQuickFilter('${qc.id}')">${qc.label}</button>`).join("")}
            </div>
            <div class="chip-row" style="margin-top:5px;">
              ${cats.map(c => `<button class="chip ${recipeFilter === c ? "active" : ""}" onclick="setRecipeFilter('${c}')">${c}</button>`).join("")}
            </div>
          </details>
        </div>

        <div id="recipeResultsContainer" class="section-gap">
          ${renderGroupedRecipesHtml(filtered)}
        </div>
      `;

    function autoFillTapers() {
      const m = getAdaptiveNutritionMetrics();
      const pool = state.recipes
        .filter(r => r.taperFriendly !== false)

      const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
      days.forEach((d, idx) => {

    function formatLeftoverAmount(val, unit) {
      const u = String(unit || "").toLowerCase();
      if (u === "kg") {
        return val < 1 ? `${Math.round(val * 1000)} g` : `${val.toFixed(1).replace(".", ",")} kg`;
      }
      if (u === "l") {
        return val < 1 ? `${Math.round(val * 1000)} ml` : `${val.toFixed(1).replace(".", ",")} L`;
      }
      if (u === "g" || u === "ml") {
        return `${Math.round(val)} ${u}`;
      }
      const rounded = Math.round(val * 10) / 10;
      return `${String(rounded).replace(".", ",")} ${unit || "ud"}`;
    }

    function getLeftoverInsights(shoppingList) {
      const list = shoppingList || getShoppingList();
      const ignoreKeys = new Set(["aceite_oliva", "especias_aji"]);
      const leftovers = [];

      list.forEach(item => {
        if (ignoreKeys.has(item.key)) return;
        const bought = Number(item.packsNeeded || 1) * Number(item.packSize || 1);
        const rem = bought - Number(item.qty || 0);
        if (rem > 0.001 && rem >= Number(item.packSize || 1) * 0.2) {
          const shortName = String(item.name || item.key).split(" (")[0].split(" /")[0];
          leftovers.push({
            key: item.key,
            name: shortName,
            rem,
            unit: item.unit,
            label: `~${formatLeftoverAmount(rem, item.unit)} ${shortName.toLowerCase()}`,
            estValue: rem * Number(item.unitPrice || 0)
          });
        }
      });

      leftovers.sort((a, b) => b.estValue - a.estValue);

      const usedIds = new Set(Object.values(state.tapers || {}));
      const leftoverKeySet = new Set(leftovers.map(x => x.key));
      const m = getAdaptiveNutritionMetrics();

      const suggestions = state.recipes
        .filter(r => !usedIds.has(r.id))
        .map(r => {
          const matched = (r.ingredients || [])
            .filter(ing => leftoverKeySet.has(ing.key))
            .map(ing => {
              const found = leftovers.find(x => x.key === ing.key);
              return found ? found.name.toLowerCase() : ing.key;
            });
          const uniqueMatched = [...new Set(matched)];
          const prof = getRecipeProfileMeta(r, m);
          return {
            recipe: r,
            matched: uniqueMatched,
            score: uniqueMatched.length * 10 + (prof ? prof.score : 0)
          };
        })
        .filter(x => x.matched.length > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 2);

      const totalSavedValue = leftovers.reduce((s, x) => s + x.estValue, 0);
      return { leftovers, suggestions, totalSavedValue };
    }

    function handleCustomProductPhoto(key, inputEl) {
      const file = inputEl?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 260;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
          if (!state.customProductImages) state.customProductImages = {};
          state.customProductImages[key] = dataUrl;
          saveState();
          render();
          openProductDetailSheet(key);
          showToast("Foto del producto guardada");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function resetCustomProductPhoto(key) {
      if (state.customProductImages) {
        delete state.customProductImages[key];
        saveState();
        render();
        openProductDetailSheet(key);
        showToast("Foto REWE restaurada");

      if (!state.trainingProfile.completedPlanDays) state.trainingProfile.completedPlanDays = {};

      saveState();
      render();
    }

    function logPlannedWorkoutToday(dayId) {
      const m = getAdaptiveNutritionMetrics();
      const plan = getAdaptiveTrainingPlan(m);
      const day = plan.schedule.find(d => d.id === dayId);
      if (!day) return;
      const today = new Date().toISOString().slice(0, 10);
      if (!state.trainingProfile.completedPlanDays) state.trainingProfile.completedPlanDays = {};
      state.trainingProfile.completedPlanDays[dayId] = true;
      state.workouts.push({
        id: "wo_" + Date.now(),
        date: today,
        type: `${day.type} · ${day.badge}`,
        minutes: day.mins,
        intensity: plan.intensityText
      });
      saveState();
      render();
      showToast(`Sesión registrada (${day.mins} min) · carbos de hoy ajustados`);
    }

    function renderWeightChartSvg(logs) {
      if (!logs || logs.length < 2) {
        return `<div style="font-size:12px; color:var(--text-soft); padding:8px; background:var(--bg-soft); border-radius:10px;">Registra tu siguiente pesaje para ver la curva hacia 64 kg y 60 kg.</div>`;
      }
      const recent = logs.slice(-8);
      const weights = recent.map(x => Number(x.weight));
      const minW = Math.min(...weights) - 0.5;
      const maxW = Math.max(...weights) + 0.5;
      const span = Math.max(0.5, maxW - minW);
      const W = 340, H = 96, padX = 18, padY = 16;

      const pts = recent.map((item, idx) => {
        const x = padX + (idx / (recent.length - 1)) * (W - padX * 2);
        const y = H - padY - ((Number(item.weight) - minW) / span) * (H - padY * 2);
        return { x, y, w: Number(item.weight).toFixed(1) };
      });

      const polyline = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      const circles = pts.map(p => `
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#B5436A" />
        <text x="${p.x.toFixed(1)}" y="${(p.y - 7).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6E525D">${p.w}</text>
      `).join("");

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:96px; background:var(--bg-soft); border-radius:12px; border:1px solid var(--border);">
          <polyline fill="none" stroke="#D45B84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polyline}" />
          ${circles}
        </svg>
      `;
    }

    function getActiveCyclePhase(m) {
      const sex = m ? m.sex : state.bodyProfile?.sex;
      if (sex !== "F") return null;
      const cp = state.cycleProfile || DEFAULT_STATE.cycleProfile;
      const energy = [1, 2, 3, 4, 5].includes(Number(cp.dailyEnergy)) ? Number(cp.dailyEnergy) : 3;

      if (cp.mode === "auto" && cp.lastPeriodStart) {
        const startMs = new Date(cp.lastPeriodStart + "T12:00:00").getTime();
        if (Number.isFinite(startMs)) {
          const todayMs = new Date(getTodayDateKey() + "T12:00:00").getTime();
          const diffDays = Math.floor((todayMs - startMs) / 86400000);
          const avgLen = Math.max(20, Math.min(50, Number(cp.avgCycleLength) || 28));
          const pDays = Math.max(2, Math.min(10, Number(cp.periodDays) || 5));
          const cycleDay = (((diffDays % avgLen) + avgLen) % avgLen) + 1;
          const ovulCenter = Math.max(pDays + 3, avgLen - 14);
          const ovulStart = Math.max(pDays + 1, ovulCenter - 1);
          const ovulEnd = Math.min(avgLen - 4, ovulCenter + 1);
          let phaseId = "luteal";
          if (cycleDay <= pDays) phaseId = "menstrual";
          else if (cycleDay < ovulStart) phaseId = "follicular";
          else if (cycleDay <= ovulEnd) phaseId = "ovulatory";
          const daysToNext = avgLen - cycleDay + 1;
          const base = CYCLE_PHASE_META[phaseId];
          return {
            ...base,
            cycleDay,
            avgCycleLength: avgLen,
            daysToNext,
            isAuto: true,
            energy,
            clueSource: cp.clueSource || "",
            clueSyncedAt: cp.clueSyncedAt || "",
            hoyShort: `${base.label} · Día ${cycleDay}/${avgLen} · Energía ${energy}/5`
          };
        }
      }

      const phase = cp.phase || "none";
      if (!phase || phase === "none" || !CYCLE_PHASE_META[phase]) return null;
      const base = CYCLE_PHASE_META[phase];
      return {
        ...base,
        isAuto: false,
        energy,
        clueSource: cp.clueSource || "",
        clueSyncedAt: cp.clueSyncedAt || "",
        hoyShort: `${base.hoyShort} · Energía ${energy}/5`
      };
    }

      saveState();
      render();
      showToast(phase === "none" ? "Fase del ciclo ocultada" : `Fase activa: ${CYCLE_PHASE_META[phase].short}`);
    }

        dailyEnergy: n,

    function saveAutoCycleFromClue() {

    function simulateClueAutoSync() {
      const tenDaysAgo = shiftDateKey(getTodayDateKey(), -10);
      const summary = applySyncedHealthPayload({
        periodStart: tenDaysAgo,
        cycleLength: state.cycleProfile?.avgCycleLength || 29,

    function parseClueJsonData(rawObj) {
      const records = Array.isArray(rawObj)
        ? rawObj
        : (Array.isArray(rawObj?.data) ? rawObj.data : (Array.isArray(rawObj?.measurements) ? rawObj.measurements : []));

      const periodDates = new Set();
      records.forEach(item => {
        if (!item || typeof item !== "object") return;
        const dateStr = String(item.date || item.day || item.start_date || "").slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
        const typeStr = String(item.type || "").toLowerCase();
        const hasPeriod = typeStr === "period" || typeStr === "bleeding" || Boolean(item.period) || Boolean(item.bleeding);
        if (hasPeriod) periodDates.add(dateStr);
      });

      const sorted = Array.from(periodDates).sort();
      if (!sorted.length) return null;

      // Group consecutive bleeding days (gap <= 2 days) into distinct cycles
      const cycles = [];
      let curStart = sorted[0];
      let curEnd = sorted[0];
      for (let i = 1; i < sorted.length; i++) {
        const prevMs = new Date(curEnd + "T12:00:00").getTime();
        const nextMs = new Date(sorted[i] + "T12:00:00").getTime();
        const gap = Math.round((nextMs - prevMs) / 86400000);
        if (gap <= 2) {
          curEnd = sorted[i];
        } else {
          cycles.push({
            start: curStart,
            bleedDays: Math.max(2, Math.min(9, Math.round((new Date(curEnd + "T12:00:00").getTime() - new Date(curStart + "T12:00:00").getTime()) / 86400000) + 1))
          });
          curStart = sorted[i];
          curEnd = sorted[i];
        }
      }
      cycles.push({
        start: curStart,
        bleedDays: Math.max(2, Math.min(9, Math.round((new Date(curEnd + "T12:00:00").getTime() - new Date(curStart + "T12:00:00").getTime()) / 86400000) + 1))
      });

      const lengths = [];
      for (let i = 1; i < cycles.length; i++) {
        const diff = Math.round((new Date(cycles[i].start + "T12:00:00").getTime() - new Date(cycles[i - 1].start + "T12:00:00").getTime()) / 86400000);
        if (diff >= 20 && diff <= 50) lengths.push(diff);
      }

      const avgCycleLength = lengths.length
        ? Math.round(lengths.reduce((s, n) => s + n, 0) / lengths.length)
        : (state.cycleProfile?.avgCycleLength || 28);
      const recentBleed = cycles.slice(-4);
      const periodDays = Math.round(recentBleed.reduce((s, c) => s + c.bleedDays, 0) / recentBleed.length);
      const lastPeriodStart = cycles[cycles.length - 1].start;

      return { lastPeriodStart, avgCycleLength, periodDays, cyclesCount: cycles.length };
    }

    async function handleClueJsonImport(input) {
      const file = input?.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const res = parseClueJsonData(parsed);
        if (!res) {
          showToast("No se encontraron fechas de período en ese JSON de Clue");
          input.value = "";
          return;
        }
        state.cycleProfile = {
          ...(state.cycleProfile || DEFAULT_STATE.cycleProfile),
          mode: "auto",
          lastPeriodStart: res.lastPeriodStart,
          avgCycleLength: res.avgCycleLength,
          periodDays: res.periodDays,
          clueSource: "Clue JSON",
          clueSyncedAt: new Date().toLocaleDateString("es-ES", { day: "numeric", month: "short" })
        };
        saveState();
        closeSheet();
        render();
        const info = getActiveCyclePhase(getAdaptiveNutritionMetrics());
        showToast(`✓ Clue importado (${res.cyclesCount} ciclos · ${res.avgCycleLength}d · ${info ? info.short : ""})`);
      } catch (e) {
        showToast("Archivo JSON no válido (sube measurements.json de Clue)");
      }
      input.value = "";
    }

    function computeHomaIr(glucose, insulin) {
      const g = Number(glucose);
      const i = Number(insulin);
      if (!(g > 0) || !(i > 0)) return null;
      return (g * i) / 405;
    }

    const LAB_MARKER_META = {
      homa:          { key: "homa",          label: "HOMA-IR",        unit: "",       dec: 2, min: 0.3, max: 4.5,  optMin: 0.5, optMax: 2.0 },
      glucose:       { key: "glucose",       label: "Glucosa ayunas", unit: "mg/dL",  dec: 0, min: 55,  max: 150,  optMin: 70,  optMax: 99 },
      insulin:       { key: "insulin",       label: "Insulina basal", unit: "µU/mL",  dec: 1, min: 1,   max: 26,   optMin: 2,   optMax: 10 },
      hba1c:         { key: "hba1c",         label: "HbA1c",          unit: "%",      dec: 1, min: 4.2, max: 7.5,  optMin: 4.6, optMax: 5.6 },
      ferritin:      { key: "ferritin",      label: "Ferritina",      unit: "ng/mL",  dec: 0, min: 5,   max: 220,  optMin: 30,  optMax: 150, optMaxM: 300 },
      b12:           { key: "b12",           label: "Vitamina B12",   unit: "pg/mL",  dec: 0, min: 120, max: 1050, optMin: 300, optMax: 900 },
      vitD:          { key: "vitD",          label: "Vitamina D",     unit: "ng/mL",  dec: 0, min: 8,   max: 105,  optMin: 30,  optMax: 80 },
      folate:        { key: "folate",        label: "Folato (B9)",    unit: "ng/mL",  dec: 1, min: 1.5, max: 24,   optMin: 5,   optMax: 20 },
      hemoglobin:    { key: "hemoglobin",    label: "Hemoglobina",    unit: "g/dL",   dec: 1, min: 9.5, max: 18.5, optMin: 12.0, optMax: 15.5, optMinM: 13.5, optMaxM: 17.5 },
      iron:          { key: "iron",          label: "Hierro sérico",  unit: "µg/dL",  dec: 0, min: 25,  max: 205,  optMin: 60,  optMax: 160 },
      tsh:           { key: "tsh",           label: "TSH (Tiroides)", unit: "mIU/L",  dec: 2, min: 0.1, max: 6.0,  optMin: 0.5, optMax: 2.5 },
      ldl:           { key: "ldl",           label: "Colesterol LDL", unit: "mg/dL",  dec: 0, min: 40,  max: 190,  optMin: 45,  optMax: 100 },
      hdl:           { key: "hdl",           label: "Colesterol HDL", unit: "mg/dL",  dec: 0, min: 25,  max: 105,  optMin: 50,  optMax: 95, optMinM: 40 },
      triglycerides: { key: "triglycerides", label: "Triglicéridos",  unit: "mg/dL",  dec: 0, min: 35,  max: 240,  optMin: 40,  optMax: 150 },
      crp:           { key: "crp",           label: "PCR / CRP",      unit: "mg/L",   dec: 1, min: 0,   max: 12,   optMin: 0,   optMax: 3.0 }
    };

    function getLabMarkerValue(entry, key) {
      if (!entry) return null;
      if (key === "homa") {
        if (Number(entry.homaDirect) > 0) return Number(entry.homaDirect);
        return computeHomaIr(entry.glucose, entry.insulin);
      }
      const n = Number(entry[key]);
      return Number.isFinite(n) && n > 0 ? n : null;
    }

    function getMarkerOptRange(key, sex) {
      const meta = LAB_MARKER_META[key];
      if (!meta) return { optMin: 0, optMax: 100, min: 0, max: 100 };
      const optMin = (sex === "M" && meta.optMinM !== undefined) ? meta.optMinM : meta.optMin;
      const optMax = (sex === "M" && meta.optMaxM !== undefined) ? meta.optMaxM : meta.optMax;
      return { optMin, optMax, min: meta.min, max: Math.max(meta.max, optMax * 1.15) };
    }

    function evaluateLabMarker(type, val, sex) {
      const n = Number(val);
      if (!(n > 0)) return null;
      if (type === "homa") {
        if (n < 2.0) return { label: "Óptimo orient.", cls: "ok" };
        if (n <= 2.5) return { label: "Límite · vigilar", cls: "warn" };
        return { label: "Elevado orient.", cls: "alert" };
      }
      if (type === "ferritin") {
        if (n < 30) return { label: "Reserva baja", cls: "alert" };
        if (n <= (sex === "M" ? 300 : 150)) return { label: "Adecuada", cls: "ok" };
        return { label: "Elevada · consultar", cls: "warn" };
      }
      if (type === "b12") {
        if (n < 300) return { label: "Baja / límite", cls: "alert" };
        if (n <= 900) return { label: "Adecuada", cls: "ok" };
        return { label: "Alta", cls: "warn" };
      }
      if (type === "vitD") {
        if (n < 20) return { label: "Déficit", cls: "alert" };
        if (n < 30) return { label: "Insuficiente", cls: "warn" };
        if (n <= 100) return { label: "Óptima", cls: "ok" };
        return { label: "Elevada", cls: "warn" };
      }
      if (type === "glucose") {
        if (n < 100) return { label: "Normal ayunas", cls: "ok" };
        if (n <= 125) return { label: "Límite ayunas", cls: "warn" };
        return { label: "Elevada · consultar", cls: "alert" };
      }
      if (type === "hba1c") {
        if (n < 5.7) return { label: "Normal", cls: "ok" };
        if (n <= 6.4) return { label: "Rango prediabetes", cls: "warn" };
        return { label: "Elevada · consultar", cls: "alert" };
      }
      const r = getMarkerOptRange(type, sex);
      if (n < r.optMin) return { label: "Bajo orient.", cls: "alert" };
      if (n <= r.optMax) return { label: "En rango", cls: "ok" };
      return { label: "Alto orient.", cls: type === "hdl" ? "ok" : "warn" };
    }

    function formatLabVal(val, dec = 1) {
      if (val === null || val === undefined || !Number.isFinite(Number(val))) return "—";
      return Number(val).toFixed(dec).replace(".", ",");
    }

    function renderLabGaugesHtml(latest, sex) {
      if (!latest) return "";
      const keys = Object.keys(LAB_MARKER_META);
      const present = keys.map(k => ({ key: k, meta: LAB_MARKER_META[k], val: getLabMarkerValue(latest, k) })).filter(x => x.val !== null);
      if (!present.length) return "";

      return `
        <div style="font-size:11px; font-weight:800; color:var(--text-soft); margin:8px 0 6px;">📊 DIAGRAMA DE RANGOS (${escapeHtml(latest.date || "")})</div>
        <div class="lab-gauge-list">
          ${present.map(({ key, meta, val }) => {
            const r = getMarkerOptRange(key, sex);
            const ev = evaluateLabMarker(key, val, sex) || { label: "Registrado", cls: "ok" };
            const span = Math.max(0.1, r.max - r.min);
            const optLeft = Math.max(0, Math.min(100, ((r.optMin - r.min) / span) * 100));
            const optRight = Math.max(optLeft + 4, Math.min(100, ((r.optMax - r.min) / span) * 100));
            const dotPct = Math.max(3, Math.min(97, ((val - r.min) / span) * 100));
            return `
              <div class="lab-gauge-item">
                <div class="row-between" style="gap:6px;">
                  <span style="font-size:12px; font-weight:800; color:var(--text-main);">${meta.label}</span>
                  <div style="display:flex; align-items:center; gap:6px;">
                    <strong style="font-size:12.5px; color:var(--text-main);">${formatLabVal(val, meta.dec)} <span style="font-size:10px; font-weight:600; color:var(--text-soft);">${meta.unit}</span></strong>
                    <span class="lab-status ${ev.cls}" style="margin:0;">${ev.label}</span>
                  </div>
                </div>
                <div class="lab-gauge-track">
                  <div class="lab-gauge-opt" style="left:${optLeft.toFixed(1)}%; width:${(optRight - optLeft).toFixed(1)}%;"></div>
                  <div class="lab-gauge-dot ${ev.cls}" style="left:${dotPct.toFixed(1)}%;"></div>
                </div>
                <div class="row-between" style="font-size:9.5px; color:var(--text-soft);">
                  <span>Óptimo orient.: ${formatLabVal(r.optMin, meta.dec)}–${formatLabVal(r.optMax, meta.dec)} ${meta.unit}</span>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function setSelectedLabChartMarker(key) {
      selectedLabChartMarker = key;
      render();
      const box = document.getElementById("labsDetailsBox");
      if (box) box.open = true;
    }

    function renderLabsTrendSvg(sortedDesc, sex) {
      const asc = (sortedDesc || []).slice().reverse();
      if (!asc.length) return "";
      const allKeys = Object.keys(LAB_MARKER_META);
      const available = allKeys.filter(k => asc.filter(l => getLabMarkerValue(l, k) !== null).length >= 1);
      if (!available.length) return "";

      if (!available.includes(selectedLabChartMarker)) {
        const multi = available.find(k => asc.filter(l => getLabMarkerValue(l, k) !== null).length >= 2);
        selectedLabChartMarker = multi || available[0];
      }

      const key = selectedLabChartMarker;
      const meta = LAB_MARKER_META[key];
      const r = getMarkerOptRange(key, sex);
      const pts = asc
        .map(l => ({ date: String(l.date || "").slice(2), val: getLabMarkerValue(l, key) }))
        .filter(x => x.val !== null)
        .slice(-8);

      const chipsHtml = `
        <div class="chip-row" style="margin-bottom:7px;">
          ${available.map(k => `
            <button class="chip ${k === key ? "active" : ""}" style="padding:4px 9px; font-size:11px;" onclick="setSelectedLabChartMarker('${k}')">${LAB_MARKER_META[k].label}</button>
          `).join("")}
        </div>
      `;

      if (pts.length < 2) {
        return `
          <div class="sci-chart-box">
            <div style="font-size:11px; font-weight:800; color:var(--text-main); margin-bottom:5px;">📈 Evolución por biomarcador</div>
            ${chipsHtml}
            <div style="font-size:11.5px; color:var(--text-soft);">Tienes 1 dato de <strong>${meta.label}</strong> (${formatLabVal(pts[0].val, meta.dec)} ${meta.unit}). Cuando subas tu siguiente analítica verás la curva de evolución aquí.</div>
          </div>
        `;
      }

      const vals = pts.map(p => p.val);
      const minV = Math.min(...vals, r.optMin) * 0.88;
      const maxV = Math.max(...vals, r.optMax) * 1.1;
      const span = Math.max(0.2, maxV - minV);
      const W = 340, H = 104, padX = 24, padY = 18;
      const yFor = v => H - padY - ((v - minV) / span) * (H - padY * 2);
      const bandTop = Math.max(padY, Math.min(H - padY, yFor(r.optMax)));
      const bandBot = Math.max(padY, Math.min(H - padY, yFor(r.optMin)));

      const coords = pts.map((p, idx) => ({
        x: padX + (idx / (pts.length - 1)) * (W - padX * 2),
        y: yFor(p.val),
        txt: formatLabVal(p.val, meta.dec),
        d: p.date
      }));
      const poly = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      return `
        <div class="sci-chart-box">
          <div style="font-size:11px; font-weight:800; color:var(--text-main); margin-bottom:5px;">📈 Evolución: ${meta.label} ${meta.unit ? `(${meta.unit})` : ""}</div>
          ${chipsHtml}
          <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:104px; background:#fff; border-radius:9px; border:1px solid var(--border);">
            <rect x="${padX}" y="${bandTop.toFixed(1)}" width="${W - padX * 2}" height="${Math.max(4, bandBot - bandTop).toFixed(1)}" fill="#E7F6EE" />
            <text x="${padX + 4}" y="${Math.min(H - padY - 2, bandBot - 3).toFixed(1)}" text-anchor="start" font-size="7.5" font-weight="700" fill="#2E8B63">Zona óptima</text>
            <polyline fill="none" stroke="#C84E77" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${poly}" />
            ${coords.map(c => `
              <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.8" fill="#C84E77" />
              <text x="${c.x.toFixed(1)}" y="${Math.max(11, c.y - 6).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#522639">${c.txt}</text>
              <text x="${c.x.toFixed(1)}" y="${H - 3}" text-anchor="middle" font-size="8" fill="#7D626D">${c.d}</text>
            `).join("")}
          </svg>
        </div>
      `;
    }

    function buildLabsDetailsHtml(m, openByDefault = false) {
      const logs = Array.isArray(state.labLogs) ? state.labLogs : [];
      const sorted = logs.slice().sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
      const latest = sorted[0] || null;
      const latestHoma = latest ? getLabMarkerValue(latest, "homa") : null;
      const summarySub = latest
        ? `Última: ${latest.date}${latestHoma !== null ? ` · HOMA-IR ${formatLabVal(latestHoma, 2)}` : ` · ${logs.length} reg.`}`
        : "Sube foto/PDF o registra HOMA-IR, HbA1c, B12, Fe...";

      let latestHtml = "";
      if (latest) {
        const extras = Array.isArray(latest.extraMarkers) ? latest.extraMarkers : [];
        latestHtml = `
          ${renderLabGaugesHtml(latest, m.sex)}
          ${extras.length ? `
            <div style="margin-bottom:10px;">
              <div style="font-size:10.5px; font-weight:800; color:var(--text-soft); margin-bottom:5px;">OTROS DATOS DETECTADOS EN TU ANÁLISIS (${extras.length})</div>
              <div style="display:flex; flex-wrap:wrap; gap:5px;">
                ${extras.map(ex => `<span class="extra-marker-chip"><strong>${escapeHtml(ex.name)}:</strong> ${escapeHtml(String(ex.value))} ${escapeHtml(ex.unit || "")}</span>`).join("")}
              </div>
            </div>
          ` : ""}
          ${renderLabsTrendSvg(sorted, m.sex)}
          ${latest.note ? `<div style="font-size:11.5px; color:var(--text-muted); margin-bottom:9px;">📝 ${escapeHtml(latest.note)}</div>` : ""}
          ${sorted.length > 0 ? `
            <div style="display:flex; flex-direction:column; gap:5px; margin-bottom:10px;">
              ${sorted.slice(0, 5).map(entry => {
                const eh = getLabMarkerValue(entry, "homa");
                const bits = [];
                if (eh !== null) bits.push(`HOMA ${formatLabVal(eh, 2)}`);
                if (entry.hba1c > 0) bits.push(`A1c ${formatLabVal(entry.hba1c, 1)}%`);
                if (entry.ferritin > 0) bits.push(`Fe ${Math.round(entry.ferritin)}`);
                if (entry.b12 > 0) bits.push(`B12 ${Math.round(entry.b12)}`);
                if (entry.vitD > 0) bits.push(`VitD ${Math.round(entry.vitD)}`);
                if (entry.tsh > 0) bits.push(`TSH ${formatLabVal(entry.tsh, 2)}`);
                return `
                  <div class="row-between" style="padding:6px 9px; background:var(--bg-soft); border-radius:9px; font-size:11.5px; gap:6px;">

                    </div>
                    <button class="btn-ghost btn-sm" style="padding:2px 6px; color:var(--text-soft);" onclick="deleteLabEntry('${entry.id}')" title="Eliminar">×</button>
                  </div>
                `;
              }).join("")}
            </div>
          ` : ""}
        `;
      } else {
        latestHtml = `<div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Sube una <strong>foto o PDF</strong> de tu análisis de sangre (100% privado en tu dispositivo) para extraer automáticamente Glucosa, Insulina, HOMA-IR, HbA1c, B12, Ferritina, Vit D, TSH, lípidos y ver sus diagramas.</div>`;
      }

      return `

              <div style="font-size:11.5px; color:var(--text-soft);">${summarySub}</div>
            </div>
          </summary>
          <div class="clean-details-body">
            ${latestHtml}

              <button class="btn-primary btn-sm" onclick="openAddLabSheet()">📷 Subir PDF / Foto</button>
              <button class="btn-secondary btn-sm" onclick="openPrintableMedicalReport()">📄 Resumen PDF</button>
            </div>

      `;

    function loadExternalScriptOnce(url, globalName) {
      return new Promise((resolve, reject) => {
        if (window[globalName]) { resolve(window[globalName]); return; }
        const existing = document.querySelector(`script[data-src="${url}"]`);
        if (existing) {
          existing.addEventListener("load", () => resolve(window[globalName]));
          existing.addEventListener("error", () => reject(new Error("No se pudo cargar " + globalName)));
          return;
        }
        const s = document.createElement("script");
        s.src = url;
        s.async = true;
        s.dataset.src = url;
        s.onload = () => window[globalName] ? resolve(window[globalName]) : reject(new Error("Módulo no disponible"));
        s.onerror = () => reject(new Error("Sin conexión para cargar lector OCR/PDF"));
        document.head.appendChild(s);
      });
    }

    function parseLabReportText(rawText) {
      const text = String(rawText || "").replace(/\r/g, "\n");
      const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
      const found = {};
      const extraMarkers = [];

      // 1. Detect date (DD.MM.YYYY, DD/MM/YYYY, YYYY-MM-DD)
      const isoMatch = text.match(/\b(20\d{2})[-\/.](0?[1-9]|1[0-2])[-\/.](0?[1-9]|[12]\d|3[01])\b/);
      const euMatch = text.match(/\b(0?[1-9]|[12]\d|3[01])[-\/.](0?[1-9]|1[0-2])[-\/.](20\d{2})\b/);
      if (isoMatch) {
        found.date = `${isoMatch[1]}-${String(isoMatch[2]).padStart(2, "0")}-${String(isoMatch[3]).padStart(2, "0")}`;
      } else if (euMatch) {
        found.date = `${euMatch[3]}-${String(euMatch[2]).padStart(2, "0")}-${String(euMatch[1]).padStart(2, "0")}`;
      }

      // Helper to extract first clinical numeric measurement after a matched label
      const extractAfterMatch = (line, rx) => {
        const m = line.match(rx);
        if (!m) return null;
        const rest = line.slice(m.index + m[0].length);
        const numMatch = rest.match(/[:=\s\t(<>]*([0-9]+(?:[.,][0-9]+)?)/);
        if (!numMatch) return null;
        const val = Number(numMatch[1].replace(",", "."));
        if (!Number.isFinite(val) || val <= 0) return null;
        return { val, rest: rest.toLowerCase() };
      };

      const coreRules = [
        { key: "homaDirect",    rx: /\b(?:homa[\s-]*ir|homa[\s-]*index|indice\s+homa|índice\s+homa)\b/i },
        { key: "hba1c",         rx: /\b(?:hb\s*a1c|hba1c|h4bc|hemoglobina\s+glic(?:osilada|ada)|glykoh[äa]moglobin)\b/i, convert: (v, r) => (r.includes("mmol/mol") || v > 15) ? Number(((v / 10.929) + 2.15).toFixed(1)) : v },
        { key: "glucose",       rx: /\b(?:glucosa(?:\s+en\s+ayunas|\s+basal)?|n[üu]chternglukose|glukose|glucose|blutzucker|glicemia|glucemia)\b/i, convert: (v, r) => (r.includes("mmol") || (v >= 2.5 && v <= 20)) ? Math.round(v * 18.018) : v },
        { key: "insulin",       rx: /\b(?:insulina(?:\s+basal|\s+en\s+ayunas)?|n[üu]chterninsulin|insulin)\b/i, convert: (v, r) => (r.includes("pmol") || v > 65) ? Number((v / 6.945).toFixed(1)) : v },
        { key: "ferritin",      rx: /\b(?:ferritina|ferritin)\b/i },
        { key: "b12",           rx: /\b(?:vitamina?\s*b\s*12|cobalamina?|holotranscobalamin|b12)\b/i, convert: (v, r) => (r.includes("pmol") && !r.includes("pg")) ? Math.round(v * 1.355) : v },
        { key: "vitD",          rx: /\b(?:25[\s-]*oh[\s-]*(?:vit(?:amina?)?\.?\s*d3?|calcidiol)|vitamina?\s*d3?|vit\.?\s*d)\b/i, convert: (v, r) => r.includes("nmol") ? Math.round(v / 2.496) : v },
        { key: "folate",        rx: /\b(?:folato|acido\s+folico|ácido\s+fólico|fols[äa]ure|vitamina?\s*b9|folate)\b/i },
        { key: "hemoglobin",    rx: /\b(?:hemoglobina|h[äa]moglobin|hemoglobin)\b/i, convert: (v, r) => (r.includes("g/l") && v > 40) ? Number((v / 10).toFixed(1)) : (r.includes("mmol") ? Number((v * 1.611).toFixed(1)) : v) },
        { key: "iron",          rx: /\b(?:hierro(?:\s+s[ée]rico)?|eisen|sideremia|serum\s+iron)\b/i },
        { key: "tsh",           rx: /\b(?:tsh(?:\s+basal)?|thyrotropin|tirotropina)\b/i },
        { key: "ldl",           rx: /\b(?:colesterol\s+ldl|ldl[\s-]*cholesterin|ldl[\s-]*c|ldl)\b/i, convert: (v, r) => (r.includes("mmol") || v < 12) ? Math.round(v * 38.67) : v },
        { key: "hdl",           rx: /\b(?:colesterol\s+hdl|hdl[\s-]*cholesterin|hdl[\s-]*c|hdl)\b/i, convert: (v, r) => (r.includes("mmol") || v < 10) ? Math.round(v * 38.67) : v },
        { key: "triglycerides", rx: /\b(?:triglic[ée]ridos|triglyceride|triglycerides)\b/i, convert: (v, r) => (r.includes("mmol") || v < 10) ? Math.round(v * 88.57) : v },
        { key: "crp",           rx: /\b(?:pcr(?:\s+ultrasensible)?|hs[\s-]*crp|crp|prote[íi]na\s+c\s+reactiva)\b/i }
      ];

      const extraRules = [
        { name: "Colesterol total", rx: /\b(?:colesterol\s+total|gesamt[\s-]*cholesterin|cholesterin\s+gesamt|total\s+cholesterol)\b/i, defUnit: "mg/dL" },
        { name: "Testosterona",     rx: /\b(?:testosterona|testosteron|testosterone)\b/i, defUnit: "ng/dL" },
        { name: "DHEA-S",           rx: /\b(?:dhea[\s-]*s)\b/i, defUnit: "µg/dL" },
        { name: "SHBG",             rx: /\b(?:shbg)\b/i, defUnit: "nmol/L" },
        { name: "LH",               rx: /\b(?:lh(?:\s+basal)?|hormona\s+luteinizante)\b/i, defUnit: "IU/L" },
        { name: "FSH",              rx: /\b(?:fsh(?:\s+basal)?)\b/i, defUnit: "IU/L" },
        { name: "Prolactina",       rx: /\b(?:prolactina|prolaktin|prolactin)\b/i, defUnit: "ng/mL" },
        { name: "Cortisol",         rx: /\b(?:cortisol|kortisol)\b/i, defUnit: "µg/dL" },
        { name: "fT3",              rx: /\b(?:ft3|t3\s+libre|freies\s+t3)\b/i, defUnit: "pg/mL" },
        { name: "fT4",              rx: /\b(?:ft4|t4\s+libre|freies\s+t4)\b/i, defUnit: "ng/dL" },
        { name: "ALT / GPT",        rx: /\b(?:alt|gpt|alat)\b/i, defUnit: "U/L" },
        { name: "AST / GOT",        rx: /\b(?:ast|got|asat)\b/i, defUnit: "U/L" },
        { name: "GGT",              rx: /\b(?:ggt|gamma[\s-]*gt)\b/i, defUnit: "U/L" },
        { name: "Creatinina",       rx: /\b(?:creatinina|kreatinin|creatinine)\b/i, defUnit: "mg/dL" },
        { name: "Ácido úrico",      rx: /\b(?:[áa]cido\s+[úu]rico|harns[äa]ure|uric\s+acid)\b/i, defUnit: "mg/dL" },
        { name: "Magnesio",         rx: /\b(?:magnesio|magnesium)\b/i, defUnit: "mg/dL" },
        { name: "Zinc",             rx: /\b(?:zinc|zink)\b/i, defUnit: "µg/dL" },
        { name: "Leucocitos",       rx: /\b(?:leucocitos|leukozyten|wbc)\b/i, defUnit: "/nL" },
        { name: "Plaquetas",        rx: /\b(?:plaquetas|thrombozyten|platelets)\b/i, defUnit: "/nL" },
        { name: "MCV",              rx: /\b(?:mcv|vcm)\b/i, defUnit: "fL" }
      ];

      const seenExtra = new Set();

      lines.forEach(line => {
        coreRules.forEach(rule => {
          if (found[rule.key] !== undefined) return;
          const hit = extractAfterMatch(line, rule.rx);
          if (!hit) return;
          const finalVal = rule.convert ? rule.convert(hit.val, hit.rest) : hit.val;
          if (Number.isFinite(finalVal) && finalVal > 0) found[rule.key] = finalVal;
        });

        extraRules.forEach(er => {
          if (seenExtra.has(er.name)) return;
          const hit = extractAfterMatch(line, er.rx);
          if (!hit) return;
          const unitMatch = hit.rest.match(/\b(mg\/dl|ng\/ml|ng\/dl|pg\/ml|µg\/dl|ug\/dl|u\/l|iu\/l|mmol\/l|nmol\/l|fl|\/nl|g\/dl|%)\b/i);
          seenExtra.add(er.name);
          extraMarkers.push({
            name: er.name,
            value: hit.val,
            unit: unitMatch ? unitMatch[1] : er.defUnit
          });
        });
      });

      const coreCount = Object.keys(found).filter(k => k !== "date").length;
      return { ...found, extraMarkers, totalDetected: coreCount + extraMarkers.length };
    }

    function setLabScanStatus(msg, isOk = false) {
      const box = document.getElementById("labScanStatusBox");
      if (!box) return;
      box.style.display = "block";
      box.style.background = isOk ? "var(--mint-bg)" : "var(--rose-pale)";
      box.style.color = isOk ? "var(--mint-text)" : "var(--rose-dark)";
      box.innerHTML = msg;
    }

    function applyParsedLabToForm(parsed) {
      if (!parsed) return;
      if (parsed.date && document.getElementById("labDate")) {
        document.getElementById("labDate").value = parsed.date;
      }
      const fieldMap = {
        glucose: "labGlucose",
        insulin: "labInsulin",
        hba1c: "labHba1c",
        ferritin: "labFerritin",
        b12: "labB12",
        vitD: "labVitD",
        folate: "labFolate",
        hemoglobin: "labHemoglobin",
        iron: "labIron",
        tsh: "labTsh",
        ldl: "labLdl",
        hdl: "labHdl",
        triglycerides: "labTrig",
        crp: "labCrp"
      };
      let filledExtraSection = false;
      Object.entries(fieldMap).forEach(([k, domId]) => {
        if (parsed[k] !== undefined && parsed[k] !== null) {
          const el = document.getElementById(domId);
          if (el) el.value = String(parsed[k]).replace(".", ",");
          if (["folate", "hemoglobin", "iron", "tsh", "ldl", "hdl", "triglycerides", "crp"].includes(k)) {
            filledExtraSection = true;
          }
        }
      });
      if (parsed.homaDirect && document.getElementById("labHomaDirect")) {
        document.getElementById("labHomaDirect").value = String(parsed.homaDirect).replace(".", ",");
      }
      if (filledExtraSection) {
        const moreDetails = document.getElementById("labMoreFieldsDetails");
        if (moreDetails) moreDetails.open = true;
      }
      pendingExtraLabMarkers = Array.isArray(parsed.extraMarkers) ? parsed.extraMarkers : [];
      renderPendingExtraMarkersPreview();
      updateHomaPreview();

      if (parsed.totalDetected > 0) {
        setLabScanStatus(`✓ <strong>${parsed.totalDetected} datos detectados</strong> automáticamente. Revísalos abajo y pulsa Guardar.`, true);
      } else {
        setLabScanStatus("No se reconocieron valores numéricos claros. Puedes completar los campos manualmente o pegar el texto del laboratorio.");
      }
    }

    function renderPendingExtraMarkersPreview() {
      const box = document.getElementById("pendingExtrasBox");
      if (!box) return;
      if (!pendingExtraLabMarkers.length) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
      }
      box.style.display = "block";
      box.innerHTML = `
        <div style="font-size:10.5px; font-weight:800; color:var(--text-soft); margin-bottom:5px;">OTROS MARCADORES EXTRAÍDOS (${pendingExtraLabMarkers.length})</div>
        <div style="display:flex; flex-wrap:wrap; gap:5px;">
          ${pendingExtraLabMarkers.map(ex => `<span class="extra-marker-chip"><strong>${escapeHtml(ex.name)}:</strong> ${escapeHtml(String(ex.value))} ${escapeHtml(ex.unit || "")}</span>`).join("")}
        </div>
      `;
    }

    async function handleLabFileUpload(input) {
      const file = input?.files?.[0];
      if (!file) return;
      const name = String(file.name || "").toLowerCase();
      setLabScanStatus(`⏳ Procesando <strong>${escapeHtml(file.name)}</strong> en tu dispositivo...`);

      try {
        let extractedText = "";
        if (name.endsWith(".txt") || name.endsWith(".csv") || file.type === "text/plain") {
          extractedText = await file.text();
        } else if (name.endsWith(".pdf") || file.type === "application/pdf") {
          const buf = await file.arrayBuffer();
          try {
            const pdfjsLib = await loadExternalScriptOnce("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js", "pdfjsLib");
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            const pageTexts = [];
            for (let p = 1; p <= Math.min(pdf.numPages, 6); p++) {
              setLabScanStatus(`⏳ Leyendo PDF (página ${p}/${Math.min(pdf.numPages, 6)})...`);
              const page = await pdf.getPage(p);
              const content = await page.getTextContent();
              let line = "";
              content.items.forEach(it => {
                line += (it.str || "") + (it.hasEOL ? "\n" : " ");
              });
              pageTexts.push(line);
            }
            extractedText = pageTexts.join("\n").trim();

            // If scanned PDF with no embedded text, render page 1 to canvas and run OCR
            if (extractedText.replace(/\s+/g, "").length < 30) {
              setLabScanStatus("⏳ PDF escaneado detectado · aplicando OCR local...");
              const page1 = await pdf.getPage(1);
              const vp = page1.getViewport({ scale: 2 });
              const canvas = document.createElement("canvas");
              canvas.width = vp.width;
              canvas.height = vp.height;
              await page1.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
              const Tesseract = await loadExternalScriptOnce("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js", "Tesseract");
              const res = await Tesseract.recognize(canvas, "deu+spa+eng", {
                logger: m => {
                  if (m.status === "recognizing text" && typeof m.progress === "number") {
                    setLabScanStatus(`⏳ Escaneando PDF con OCR local... ${Math.round(m.progress * 100)}%`);
                  }
                }
              });
              extractedText = res?.data?.text || "";
            }
          } catch (pdfErr) {
            // Lightweight offline fallback for uncompressed text PDFs
            const rawStr = new TextDecoder("latin1").decode(buf);
            const matches = rawStr.match(/\(([^()]{2,120})\)/g) || [];
            extractedText = matches.map(s => s.slice(1, -1)).join("\n");
          }
        } else {
          // Image OCR in-browser via Tesseract.js
          setLabScanStatus("⏳ Cargando lector OCR privado (solo la primera vez)...");
          const Tesseract = await loadExternalScriptOnce("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js", "Tesseract");
          const res = await Tesseract.recognize(file, "deu+spa+eng", {
            logger: m => {
              if (m.status === "recognizing text" && typeof m.progress === "number") {
                setLabScanStatus(`⏳ Leyendo foto de tu análisis... ${Math.round(m.progress * 100)}%`);
              }
            }
          });
          extractedText = res?.data?.text || "";
        }

        const parsed = parseLabReportText(extractedText);
        applyParsedLabToForm(parsed);
      } catch (err) {
        setLabScanStatus("No se pudo leer el archivo automáticamente (revisa tu conexión para OCR/PDF o pega el texto abajo).");
      }
      input.value = "";
    }

    function parsePastedLabText() {
      const raw = document.getElementById("labPasteTextarea")?.value || "";
      if (!raw.trim()) {
        showToast("Pega primero el texto de tu análisis");
        return;
      }
      const parsed = parseLabReportText(raw);
      applyParsedLabToForm(parsed);
    }

    function parseOptDecimal(id) {
      const el = document.getElementById(id);
      if (!el) return null;
      const raw = String(el.value || "").trim().replace(",", ".");
      if (!raw) return null;
      const num = Number(raw);
      return Number.isFinite(num) && num > 0 ? num : null;
    }

    function updateHomaPreview() {
      const box = document.getElementById("homaPreviewBox");
      if (!box) return;
      const g = parseOptDecimal("labGlucose");
      const i = parseOptDecimal("labInsulin");
      const direct = parseOptDecimal("labHomaDirect");
      const homa = direct || computeHomaIr(g, i);
      if (homa !== null) {
        const ev = evaluateLabMarker("homa", homa, state.bodyProfile.sex);
        box.style.display = "block";
        box.textContent = `HOMA-IR: ${homa.toFixed(2).replace(".", ",")} (${ev ? ev.label : ""})`;

      const date = document.getElementById("labDate")?.value || new Date().toISOString().slice(0, 10);

        date,
        glucose: parseOptDecimal("labGlucose"),

        homaDirect: parseOptDecimal("labHomaDirect"),
        hba1c: parseOptDecimal("labHba1c"),
        ferritin: parseOptDecimal("labFerritin"),
        b12: parseOptDecimal("labB12"),
        vitD: parseOptDecimal("labVitD"),
        folate: parseOptDecimal("labFolate"),
        hemoglobin: parseOptDecimal("labHemoglobin"),
        iron: parseOptDecimal("labIron"),
        tsh: parseOptDecimal("labTsh"),
        ldl: parseOptDecimal("labLdl"),
        hdl: parseOptDecimal("labHdl"),
        triglycerides: parseOptDecimal("labTrig"),
        crp: parseOptDecimal("labCrp"),
        extraMarkers: Array.isArray(pendingExtraLabMarkers) ? [...pendingExtraLabMarkers] : [],
        note: String(document.getElementById("labNote")?.value || "").trim()
      };
      const coreVals = [entry.glucose, entry.insulin, entry.homaDirect, entry.hba1c, entry.ferritin, entry.b12, entry.vitD, entry.folate, entry.hemoglobin, entry.iron, entry.tsh, entry.ldl, entry.hdl, entry.triglycerides, entry.crp];
      if (!coreVals.some(Boolean) && !entry.extraMarkers.length) {
        showToast("Sube un análisis o ingresa al menos un valor");
        return;
      }
      if (!Array.isArray(state.labLogs)) state.labLogs = [];
      state.labLogs.push(entry);
      pendingExtraLabMarkers = [];
      saveState();
      closeSheet();
      if (currentTab === "progreso") saludSubTab = "clinica";
      render();
      const box = document.getElementById("labsDetailsBox");
      if (box) box.open = true;
      showToast("Analítica guardada y diagramas actualizados ✓");

    function getMetforminStats() {
      const mt = state.metforminTracker || DEFAULT_STATE.metforminTracker;
      const logs = Array.isArray(mt.logs)
        ? mt.logs.slice().sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")))
        : [];
      const count = logs.length;
      const avgGi = count ? logs.reduce((s, l) => s + Number(l.giScore || 0), 0) / count : null;
      const avgEnergy = count ? logs.reduce((s, l) => s + Number(l.postMealEnergy || 0), 0) / count : null;
      const avgCravings = count ? logs.reduce((s, l) => s + Number(l.cravings || 0), 0) / count : null;

      // Correlations
      const withFood = logs.filter(l => l.timing === "mid_meal" || l.timing === "end_meal");
      const fasted = logs.filter(l => l.timing === "fasted");
      const protMeals = logs.filter(l => l.mealQuality === "protein_fiber");
      const heavyMeals = logs.filter(l => l.mealQuality === "heavy_carb");

      const correlations = [];
      if (withFood.length >= 1 && fasted.length >= 1) {
        const wfAvg = withFood.reduce((s, l) => s + Number(l.giScore || 0), 0) / withFood.length;
        const faAvg = fasted.reduce((s, l) => s + Number(l.giScore || 0), 0) / fasted.length;
        correlations.push(`<strong>Timing:</strong> molestia GI media <strong>${wfAvg.toFixed(1).replace(".", ",")}/3</strong> con comida vs. <strong>${faAvg.toFixed(1).replace(".", ",")}/3</strong> fuera de comida.`);
      }
      if (protMeals.length >= 1 && heavyMeals.length >= 1) {
        const pAvg = protMeals.reduce((s, l) => s + Number(l.giScore || 0), 0) / protMeals.length;
        const hAvg = heavyMeals.reduce((s, l) => s + Number(l.giScore || 0), 0) / heavyMeals.length;
        correlations.push(`<strong>Tipo de comida:</strong> GI <strong>${pAvg.toFixed(1).replace(".", ",")}/3</strong> con proteína+fibra vs. <strong>${hAvg.toFixed(1).replace(".", ",")}/3</strong> con carbos refinados/grasa.`);
      }
      const recent4 = logs.slice(-4);
      const recentGi = recent4.length ? recent4.reduce((s, l) => s + Number(l.giScore || 0), 0) / recent4.length : 0;
      const persistentGiAlert = recent4.length >= 4 && recentGi >= 1.8;
      if (persistentGiAlert) {
        correlations.push(`<strong>Señal para tu médico:</strong> molestia GI sostenida (${recentGi.toFixed(1).replace(".", ",")}/3 en los últimos registros). Vale la pena consultar si te conviene pasar a <strong>liberación prolongada (XR/Retard)</strong> o ajustar el ritmo de titulación.`);
      } else if (count >= 2 && !correlations.length) {
        correlations.push(avgGi <= 0.8
          ? `<strong>Buena adaptación:</strong> tolerancia digestiva estable (${avgGi.toFixed(1).replace(".", ",")}/3) con energía post-comida media de <strong>${avgEnergy.toFixed(1).replace(".", ",")}/5</strong>.`
          : `<strong>En adaptación:</strong> sigue registrando si la tomas a mitad de comida con proteína+fibra para detectar qué te sienta mejor.`);
      }

      return { mt, logs, count, avgGi, avgEnergy, avgCravings, correlations, persistentGiAlert };
    }

    function getMetforminB12Monitor() {
      const mt = state.metforminTracker || DEFAULT_STATE.metforminTracker;
      const sortedLabs = (state.labLogs || []).slice().sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
      const latestB12Lab = sortedLabs.find(l => Number(l.b12) > 0) || null;
      let monthsOn = null;
      if (mt.startDate) {
        const diffDays = Math.max(0, Math.round((Date.now() - new Date(mt.startDate + "T00:00:00").getTime()) / 86400000));
        monthsOn = Math.floor(diffDays / 30);
      }

      if (latestB12Lab && Number(latestB12Lab.b12) < 300) {
        return {
          status: "warn",
          badge: `B12 ${latestB12Lab.b12} pg/mL · Vigilar`,
          text: `Tu última Vitamina B12 (${latestB12Lab.date}) está en rango bajo/límite. Con metformina las guías ADA recomiendan comentarlo con tu médico para valorar reposición.`
        };
      }
      if (monthsOn !== null && monthsOn >= 12 && !latestB12Lab) {
        return {
          status: "warn",
          badge: `${monthsOn} meses · Medir B12`,
          text: `Llevas ${monthsOn} meses con metformina sin B12 registrada. Conviene solicitar Vitamina B12 en tu próxima analítica (guías ADA/MHRA).`
        };
      }
      if (latestB12Lab) {
        return {
          status: "ok",
          badge: `B12 ${latestB12Lab.b12} pg/mL · OK`,
          text: `Último control B12 (${latestB12Lab.date}) en rango adecuado. Repite control periódico cada 12 meses o antes si notas fatiga inusual u hormigueo.`
        };
      }
      return {
        status: "warn",
        badge: monthsOn !== null ? `Mes ${monthsOn + 1} · Sin B12 base` : "Registrar B12 base",
        text: "Al iniciar metformina es ideal anotar una Vitamina B12 base en Analíticas y repetir control periódico según criterio médico."
      };
    }

    function renderMetforminChartSvg(logs) {
      if (!logs || logs.length < 2) {
        return `<div style="font-size:11.5px; color:var(--text-soft); padding:9px; background:var(--bg-soft); border-radius:10px; border:1px solid var(--border); margin-bottom:10px;">Registra al menos <strong>2 días</strong> para graficar tu curva de adaptación (molestia GI vs. energía post-comida).</div>`;
      }
      const recent = logs.slice(-10);
      const W = 340, H = 112, padX = 20, padY = 18;
      const plotW = W - padX * 2;
      const plotH = H - padY * 2;

      const ptsGi = recent.map((item, idx) => {
        const x = padX + (idx / (recent.length - 1)) * plotW;
        const norm = Math.max(0, Math.min(3, Number(item.giScore || 0))) / 3;
        const y = H - padY - norm * plotH;
        return { x, y, v: Number(item.giScore || 0), d: String(item.date || "").slice(5) };
      });
      const ptsEn = recent.map((item, idx) => {
        const x = padX + (idx / (recent.length - 1)) * plotW;
        const norm = (Math.max(1, Math.min(5, Number(item.postMealEnergy || 3))) - 1) / 4;
        const y = H - padY - norm * plotH;
        return { x, y, v: Number(item.postMealEnergy || 3) };
      });

      const polyGi = ptsGi.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      const polyEn = ptsEn.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");

      return `
        <div class="sci-chart-box">

            <div class="grid-2" style="margin-bottom:10px;">
              <button class="btn-primary btn-sm" onclick="openMetforminLogSheet()">+ Registrar hoy (10 s)</button>
              <button class="btn-secondary btn-sm" onclick="openPrintableMedicalReport()">📄 Incluir en PDF</button>

            ${renderMetforminChartSvg(stats.logs)}

            ${stats.correlations.length ? `
              <div class="corr-box">
                <div style="font-size:11px; font-weight:800; color:var(--rose-dark); margin-bottom:4px;">🔍 PATRONES DETECTADOS</div>

                      <strong>${escapeHtml(l.date)}</strong> · GI <strong>${l.giScore}/3</strong> · En. <strong>${l.postMealEnergy}/5</strong> · <span style="color:var(--text-muted);">${METF_TIMING_LABELS[l.timing] || ""} · ${METF_BRISTOL_LABELS[l.bristol] || ""}</span>
                    </div>
                    <button class="btn-ghost btn-sm" style="padding:2px 6px; color:var(--text-soft);" onclick="deleteMetforminLog('${l.id}')" title="Eliminar">×</button>
                  </div>
                `).join("")}

            ` : ""}

            <div class="b12-alert-box ${b12Mon.status === "ok" ? "ok" : ""}">
              <div class="row-between" style="margin-bottom:4px;">
                <strong>🔬 Monitor Vitamina B12 (ADA)</strong>
                <span class="badge ${b12Mon.status === "ok" ? "badge-mint" : "badge-amber"}">${escapeHtml(b12Mon.badge)}</span>
              </div>
              <div>${b12Mon.text}</div>

            ${buildMetforminMechanismHtml(m)}

            <details style="margin-top:8px; background:var(--bg-surface); border:1px solid var(--border); border-radius:11px; padding:8px 10px;">
              <summary style="cursor:pointer; font-size:11.5px; font-weight:800; color:var(--text-main); list-style:none;">🛡️ Qué consultar siempre con tu médico</summary>
              <div style="margin-top:6px; font-size:11px; color:var(--text-muted); line-height:1.45;">
                • <strong>No cambies tu dosis por tu cuenta:</strong> usa este registro para decidir juntos si mantener pauta o valorar versión <strong>XR/Retard</strong>.<br/>

    function setMetfFormulation(form) {
      if (!["IR", "XR"].includes(form)) return;
      state.metforminTracker.formulation = form;
      saveState();
      render();
      const box = document.getElementById("metforminDetailsBox");
      if (box) box.open = true;
      showToast(`Formulación: ${form === "XR" ? "Prolongada (XR/Retard)" : "Liberación inmediata (IR)"}`);
    }

    function updateMetfConfig() {
      const dose = Number(document.getElementById("metfDoseInput")?.value || 500);
      const start = document.getElementById("metfStartInput")?.value || "";
      if (dose > 0) state.metforminTracker.doseMg = dose;
      state.metforminTracker.startDate = start;
      saveState();
      render();
      const box = document.getElementById("metforminDetailsBox");
      if (box) box.open = true;
      showToast("Pauta guardada ✓");
    }

      openSheet("💊 Diario Metformina (10 s)", `

                <button type="button" class="seg-btn ${metfDraft.mealQuality === k ? "active" : ""}" data-val="${k}" onclick="selectMetfField('mealQuality','${k}')">${lbl}</button>
              `).join("")}

            <label>Escala digestiva GI (náusea, gases, cólico)</label>
            <div class="metf-scale-grid" id="metfGiRow">
              ${METF_GI_LABELS.map(item => `
                <button type="button" class="metf-scale-btn ${metfDraft.giScore === item.val ? "active" : ""}" data-val="${item.val}" onclick="selectMetfField('giScore', ${item.val})">
