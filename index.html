                  <div style="font-size:9.5px;">${item.label}</div>
                </button>
              `).join("")}
            </div>
          </div>

          <div>
            <label>Tránsito (Escala Bristol simplificada)</label>
            <div class="metf-scale-grid" id="metfBristolRow">
              ${Object.entries(METF_BRISTOL_LABELS).map(([k, lbl]) => `
                <button type="button" class="metf-scale-btn ${metfDraft.bristol === k ? "active" : ""}" data-val="${k}" onclick="selectMetfField('bristol','${k}')">${lbl}</button>
              `).join("")}
            </div>
          </div>

          <div>
            <label>Energía tras comer (1 = bajón/sueño · 5 = estable)</label>
            <div class="metf-scale-grid cols-5" id="metfEnergyRow">
              ${[1, 2, 3, 4, 5].map(n => `
                <button type="button" class="metf-scale-btn ${metfDraft.postMealEnergy === n ? "active" : ""}" data-val="${n}" onclick="selectMetfField('postMealEnergy', ${n})">${n}</button>
              `).join("")}
            </div>
          </div>

          <div>
            <label>Antojos dulces hoy (1 = nada · 5 = muy fuertes)</label>
            <div class="metf-scale-grid cols-5" id="metfCravingsRow">
              ${[1, 2, 3, 4, 5].map(n => `
                <button type="button" class="metf-scale-btn ${metfDraft.cravings === n ? "active" : ""}" data-val="${n}" onclick="selectMetfField('cravings', ${n})">${n}</button>
              `).join("")}
            </div>
          </div>

          <div>

            <input type="text" id="metfLogNote" placeholder="Ej. Cena con salmón, cero molestias" />

        </div>

    function selectMetfField(field, val) {
      metfDraft[field] = val;
      const map = {
        timing: "metfTimingRow",
        mealQuality: "metfMealRow",
        giScore: "metfGiRow",
        bristol: "metfBristolRow",
        postMealEnergy: "metfEnergyRow",
        cravings: "metfCravingsRow"
      };
      const row = document.getElementById(map[field]);
      if (!row) return;
      row.querySelectorAll("button").forEach(btn => {
        btn.classList.toggle("active", String(btn.getAttribute("data-val")) === String(val));
      });
    }

    function saveMetforminLog() {
      const date = document.getElementById("metfLogDate")?.value || new Date().toISOString().slice(0, 10);
      const doseMg = Number(document.getElementById("metfLogDose")?.value || state.metforminTracker.doseMg || 500);
      const note = String(document.getElementById("metfLogNote")?.value || "").trim();
      if (!Array.isArray(state.metforminTracker.logs)) state.metforminTracker.logs = [];
      if (!state.metforminTracker.startDate) state.metforminTracker.startDate = date;
      state.metforminTracker.logs.push({
        id: "metf_" + Date.now(),
        date,
        doseMg,
        timing: metfDraft.timing,
        mealQuality: metfDraft.mealQuality,
        giScore: Number(metfDraft.giScore || 0),
        bristol: metfDraft.bristol,
        postMealEnergy: Number(metfDraft.postMealEnergy || 4),
        cravings: Number(metfDraft.cravings || 2),
        note
      });
      saveState();
      closeSheet();
      render();
      const box = document.getElementById("metforminDetailsBox");
      if (box) box.open = true;
      showToast("Registro de metformina guardado ✓");
    }

    function deleteMetforminLog(id) {
      state.metforminTracker.logs = (state.metforminTracker.logs || []).filter(x => x.id !== id);
      saveState();
      render();
      const box = document.getElementById("metforminDetailsBox");
      if (box) box.open = true;
      showToast("Registro eliminado");
    }

    function setProfileSex(sex) {
      state.bodyProfile.sex = sex === "M" ? "M" : "F";
      saveState();
      render();
      showToast(`Perfil actualizado: ${sex === "M" ? "Hombre" : "Mujer"}`);
    }

    function setProfileGoal(goal) {
      if (!["deficit", "hypertrophy", "maintenance"].includes(goal)) return;
      state.bodyProfile.goal = goal;
      saveState();
      render();
      showToast(`Meta: ${GOAL_META[goal].shortLabel}`);
    }

    function toggleClinicalCondition(cond) {
      if (!CLINICAL_CONDITION_META[cond]) return;
      const list = Array.isArray(state.clinicalProfile.conditions) ? [...state.clinicalProfile.conditions] : [];
      const idx = list.indexOf(cond);
      if (idx >= 0) list.splice(idx, 1);
      else list.push(cond);
      state.clinicalProfile.conditions = list;
      saveState();
      render();
      showToast(idx >= 0 ? `Enfoque desactivado: ${CLINICAL_CONDITION_META[cond].label}` : `Enfoque activado: ${CLINICAL_CONDITION_META[cond].label}`);
    }

    function clearClinicalConditions() {
      state.clinicalProfile.conditions = [];
      saveState();
      render();
      showToast("Enfoque general activo");
    }

    function setDiabetesMeals(n) {
      if (![3, 4, 5].includes(n)) return;
      state.clinicalProfile.mealsPerDay = n;
      saveState();
      render();
    }

    function setDiabetesGramsPerRation(g) {
      if (![10, 15].includes(g)) return;
      state.clinicalProfile.gramsPerRation = g;
      saveState();
      render();
    }

    function updateBodyProfile() {
      const hEl = document.getElementById("bpHeight");
      const aEl = document.getElementById("bpAge");
      const wEl = document.getElementById("bpWeight");
      const actEl = document.getElementById("bpActivity");
      const defEl = document.getElementById("bpDeficit");
      const surEl = document.getElementById("bpSurplus");

      if (hEl) state.bodyProfile.heightCm = Math.max(120, Math.min(220, parseNumInput(hEl.value, 158)));
      if (aEl) state.bodyProfile.age = Math.max(15, Math.min(90, parseNumInput(aEl.value, 21)));
      if (actEl) state.bodyProfile.activity = parseNumInput(actEl.value, 1.55);
      if (defEl) state.bodyProfile.deficit = parseNumInput(defEl.value, 550);
      if (surEl) state.bodyProfile.surplus = parseNumInput(surEl.value, 250);

      if (wEl) {
        const parsedW = parseNumInput(wEl.value, NaN);
        const currentW = getCurrentWeightKg();
        if (Number.isFinite(parsedW) && parsedW >= 30 && parsedW <= 250 && Math.abs(parsedW - currentW) >= 0.05) {
          const today = new Date().toISOString().slice(0, 10);
          const todayIdx = state.weightLogs.findIndex(x => x.date === today);
          if (todayIdx >= 0) {
            state.weightLogs[todayIdx].weight = Number(parsedW.toFixed(1));
          } else {
            state.weightLogs.push({ id: "w_" + Date.now(), date: today, weight: Number(parsedW.toFixed(1)) });
          }
        }
      }

      saveState();
      render();
    }

    function getHealthProfileSignature(m) {
      const conds = (state.clinicalProfile?.conditions || []).slice().sort().join(",");
      return `${m.sex}|${m.age}|${m.weightKg.toFixed(1)}|${m.heightCm}|${m.activity}|${m.goal}|${m.deficitVal}|${m.surplusVal}|${conds}`;
    }

    function getHealthPlanReadiness(m) {
      const sig = getHealthProfileSignature(m);
      const saved = state.healthPlanStatus || {};
      if (saved.ready && saved.signature === sig) {
        return { status: "ready", updatedAt: saved.updatedAt || "" };
      }
      if (saved.ready && saved.signature !== sig) {
        return { status: "needs_update", updatedAt: saved.updatedAt || "" };
      }
      return { status: "pending", updatedAt: "" };
    }

    function confirmHealthPlanAndNotify() {
      const m = getAdaptiveNutritionMetrics();
      state.targets.kcal = m.targetKcal;
      state.targets.protein = m.targetProtein;
      state.targets.carbsMax = m.targetCarbs;
      state.healthPlanStatus = {
        ready: true,
        signature: getHealthProfileSignature(m),
        updatedAt: new Date().toLocaleDateString("es-ES", { day: "numeric", month: "short" })
      };
      saveState();
      render();
      showToast("✨ ¡Tu plan personalizado ya está listo!");
      openPlanReadySheet();
    }

          <button class="btn-secondary" onclick="closeSheet(); switchTab('comida', 'recetario');">🍲 Recetario</button>
        </div>
      `);
    }

    function applyCalculatedTargets(kcal, prot, carbsMax) {
      state.targets.kcal = kcal;
      state.targets.protein = prot;
      if (carbsMax) state.targets.carbsMax = carbsMax;
      saveState();
      updateHeader();
      showToast(`Metas aplicadas: ${kcal} kcal · ${prot}g prot · ${carbsMax}g carb`);
    }

    const MED_CATEGORY_META = {
      tdah:           { id: "tdah",           icon: "🧠", label: "TDAH",           defTime: "08:00", defStock: 30, followUp15: true,  withFood: false, sampleName: "Medicación TDAH",    sampleDose: "Según pauta médica" },
      antidepressant: { id: "antidepressant", icon: "💜", label: "Antidepresivo",  defTime: "08:30", defStock: 30, followUp15: true,  withFood: false, sampleName: "Antidepresivo",      sampleDose: "Toma diaria fija" },
      contraceptive:  { id: "contraceptive",  icon: "🌸", label: "Anticonceptivo", defTime: "21:30", defStock: 28, followUp15: true,  withFood: false, sampleName: "Anticonceptivo",     sampleDose: "1 comprimido · misma hora" },
      metabolic:      { id: "metabolic",      icon: "💊", label: "Metformina",     defTime: "14:00", defStock: 30, followUp15: true,  withFood: true,  sampleName: "Metformina",         sampleDose: "500 mg · con comida" },
      vitamin:        { id: "vitamin",        icon: "✨", label: "Vitamina",       defTime: "14:00", defStock: null, followUp15: false, withFood: true, sampleName: "Vitamina D3 / B12", sampleDose: "Con comida" },
      other:          { id: "other",          icon: "🩺", label: "Otro",           defTime: "09:00", defStock: null, followUp15: false, withFood: false, sampleName: "",                  sampleDose: "Diario" }
    };

    function getCurrentHHMM() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    }

    function timeToMinutes(hhmm) {
      const parts = String(hhmm || "08:30").split(":");
      return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }

    function getMedLog(medId, dateKey = null) {
      const key = dateKey || getTodayDateKey();
      const dayMap = state.medLogs?.[key];
      if (dayMap && dayMap[medId]) return dayMap[medId];
      if (key === getTodayDateKey()) {
        const med = (state.meds || []).find(m => m.id === medId);
        if (med && med.checked) return { status: "taken", takenAt: "" };
      }
      return null;
    }

    function isMedTakenToday(med, dateKey = null) {
      const log = getMedLog(med.id, dateKey);
      return Boolean(log && log.status === "taken");
    }

    function getMedSlot(med) {
      const mins = timeToMinutes(med.time || "08:30");
      if (mins < 12 * 60) return "manana";
      if (mins < 18 * 60) return "mediodia";
      return "noche";
    }

    function getDueMedsNow() {
      const today = getTodayDateKey();
      const nowMins = timeToMinutes(getCurrentHHMM());
      const overdue = [];
      const upcoming = [];

      (state.meds || []).forEach(med => {
        const log = getMedLog(med.id, today);
        if (log && (log.status === "taken" || log.status === "skipped")) return;
        if (log && log.status === "snoozed" && log.snoozeUntil && nowMins < timeToMinutes(log.snoozeUntil)) return;
        const sched = timeToMinutes(med.time || "08:30");
        if (nowMins >= sched) {
          overdue.push(med);
        } else if (sched - nowMins <= 30) {
          upcoming.push(med);
        }
      });

      overdue.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
      upcoming.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
      return { overdue, upcoming };
    }

    function getMedAdherence7Days() {
      const totalMeds = (state.meds || []).length;
      if (!totalMeds) return { pct: 0, days: [] };
      const today = getTodayDateKey();
      const days = [];
      let sumPct = 0;
      for (let i = 6; i >= 0; i--) {
        const dKey = shiftDateKey(today, -i);
        let taken = 0;
        state.meds.forEach(med => {
          if (isMedTakenToday(med, dKey)) taken++;
        });
        const ratio = taken / totalMeds;
        sumPct += ratio;
        days.push({
          date: dKey,
          status: ratio >= 1 ? "full" : (ratio > 0 ? "part" : "none")
        });
      }
      return { pct: Math.round((sumPct / 7) * 100), days };
    }

    function getSmartMedInteractionTips() {
      const meds = state.meds || [];
      const tips = [];
      const hasTdah = meds.some(m => m.category === "tdah");
      const hasContra = meds.some(m => m.category === "contraceptive");
      const hasAnti = meds.some(m => m.category === "antidepressant");
      const hasMetf = meds.some(m => m.category === "metabolic" || String(m.name || "").toLowerCase().includes("metform"));
      const hasIron = meds.some(m => String(m.name || "").toLowerCase().includes("hierro"));
      const lowStock = meds.filter(m => m.stock !== null && m.stock !== undefined && Number(m.stock) <= 5);

      if (lowStock.length) {
        tips.push(`<strong>🔄 Reponer pronto:</strong> ${lowStock.map(m => `${escapeHtml(m.name)} (${m.stock} uds)`).join(", ")}.`);
      }
      if (hasTdah) {
        tips.push("<strong>🧠 TDAH + Vitamina C:</strong> si tomas estimulantes, evita dosis altas de Vitamina C o zumos cítricos justo a la misma hora (sepáralos ~1 h; confírmalo con tu médico/farmacéutico).");
      }
      if (hasContra) {
        tips.push("<strong>🌸 Anticonceptivo:</strong> mantén siempre la misma hora diaria y activa el recordatorio doble (+15 min) para evitar olvidos.");
      }
      if (hasAnti) {
        tips.push("<strong>💜 Antidepresivo:</strong> la constancia diaria importa más que la perfección; si olvidas una toma, no dupliques dosis sin consultar a tu médico.");
      }
      if (hasIron) {
        tips.push("<strong>🩸 Hierro:</strong> tómalo con Vitamina C y separado 1–2 h de café, té o lácteos.");
      } else if (hasMetf && tips.length < 2) {
        tips.push("<strong>💊 Metformina:</strong> mejor a mitad o final de comida principal para buena tolerancia digestiva.");
      }
      return tips.slice(0, 3);
    }

    function toggleMed(id) {
      const item = (state.meds || []).find(m => m.id === id);
      if (!item) return;
      const today = getTodayDateKey();
      if (!state.medLogs || typeof state.medLogs !== "object") state.medLogs = {};
      if (!state.medLogs[today]) state.medLogs[today] = {};
      const wasTaken = isMedTakenToday(item, today);

      if (wasTaken) {
        delete state.medLogs[today][id];
        item.checked = false;
        if (item.stock !== null && item.stock !== undefined) item.stock = Number(item.stock) + 1;
        showToast(`${item.name} marcada como pendiente`);
      } else {
        const hhmm = getCurrentHHMM();
        state.medLogs[today][id] = { status: "taken", takenAt: hhmm };
        item.checked = true;
        if (item.stock !== null && item.stock !== undefined && Number(item.stock) > 0) {
          item.stock = Math.max(0, Number(item.stock) - 1);
          if (item.stock <= 5) {
            showToast(`✓ ${item.name} (${hhmm}) · ¡Quedan ${item.stock} uds!`);
          } else {
            showToast(`✓ ${item.name} tomada a las ${hhmm}`);
          }
        } else {
          showToast(`✓ ${item.name} tomada a las ${hhmm}`);
        }
      }
      saveState();
      render();
    }

    function snoozeMed(id, mins = 15) {
      const item = (state.meds || []).find(m => m.id === id);
      if (!item) return;
      const today = getTodayDateKey();
      if (!state.medLogs || typeof state.medLogs !== "object") state.medLogs = {};
      if (!state.medLogs[today]) state.medLogs[today] = {};
      const targetDate = new Date(Date.now() + mins * 60000);
      const until = `${String(targetDate.getHours()).padStart(2, "0")}:${String(targetDate.getMinutes()).padStart(2, "0")}`;
      state.medLogs[today][id] = { status: "snoozed", snoozeUntil: until };
      saveState();
      render();
      showToast(`⏰ ${item.name} pospuesta hasta las ${until}`);
    }

    function exportMedicationsIcs() {
      const meds = state.meds || [];
      if (!meds.length) {
        showToast("Añade primero al menos un medicamento");
        return;
      }
      const pad2 = n => String(n).padStart(2, "0");
      const now = new Date();
      const y = now.getFullYear(), mo = pad2(now.getMonth() + 1), da = pad2(now.getDate());
      const dtStamp = `${y}${mo}${da}T${pad2(now.getHours())}${pad2(now.getMinutes())}00`;

      const events = meds.map(med => {
        const parts = String(med.time || "08:30").split(":");
        const hh = pad2(parseInt(parts[0], 10) || 8);
        const mm = pad2(parseInt(parts[1], 10) || 30);
        const endTot = (parseInt(hh, 10) * 60) + parseInt(mm, 10) + 15;
        const endHh = pad2(Math.floor(endTot / 60) % 24);
        const endMm = pad2(endTot % 60);
        const cat = MED_CATEGORY_META[med.category] || MED_CATEGORY_META.other;
        const summary = `${cat.icon} Toma: ${med.name} (${med.dose})`;
        const desc = `${med.withFood ? "Tomar con comida. " : ""}Registra tu toma en MealPrep & NutriTrack para saber la hora exacta.`;
        const alarms = [
          "BEGIN:VALARM",
          "TRIGGER:-PT0M",
          "ACTION:DISPLAY",
          `DESCRIPTION:${summary}`,
          "END:VALARM"
        ];
        if (med.followUp15) {
          alarms.push(
            "BEGIN:VALARM",
            "TRIGGER:PT15M",
            "ACTION:DISPLAY",
            `DESCRIPTION:⏰ Recordatorio (+15 min): ¿Ya tomaste ${med.name}?`,
            "END:VALARM"
          );
        }
        return [
          "BEGIN:VEVENT",
          `UID:med-${med.id}@mealprep-nutritrack`,
          `DTSTAMP:${dtStamp}`,
          `DTSTART:${y}${mo}${da}T${hh}${mm}00`,
          `DTEND:${y}${mo}${da}T${endHh}${endMm}00`,
          "RRULE:FREQ=DAILY",
          `SUMMARY:${summary}`,
          `DESCRIPTION:${desc}`,
          ...alarms,
          "END:VEVENT"
        ].join("\r\n");
      });

      const ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//MealPrep NutriTrack//Smart Meds//ES",
        "CALSCALE:GREGORIAN",
        ...events,
        "END:VCALENDAR"
      ].join("\r\n");

      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "alertas-medicacion-iphone.ics";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`✓ Alertas .ics creadas para ${meds.length} toma(s)`);
    }

    function addCustomPantry() {
      const inp = document.getElementById("customPantryInput");
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) return;
      if (!state.customPantry.includes(val)) {
        state.customPantry.push(val);
        saveState();
        render();
        showToast(`Añadido a tu casa: ${val}`);
      }
    }

    function removeCustomPantry(val) {
      state.customPantry = state.customPantry.filter(x => x !== val);
      saveState();
      render();
    }

    function clearAllPantry() {
      state.pantryKeys = [];
      state.customPantry = [];
      saveState();
      render();
      showToast("Lista de casa limpiada");
    }

    function updateBudget(val) {
      state.budget = Math.max(10, parseNumInput(val, 45));
      saveState();
      updateHeader();
      showToast(`Presupuesto: ${fmtEur(state.budget)}`);
    }

    function updateTargetKcal(val) {
      state.targets.kcal = Math.max(1000, parseNumInput(val, 1640));
      saveState();
      updateHeader();
    }

    function updateStepsGoal(val) {
      state.stepsGoal = Math.max(2000, parseNumInput(val, 9000));
      saveState();
    }

    function toggleAppliance(id) {
      if (state.appliances.includes(id)) {
        state.appliances = state.appliances.filter(x => x !== id);
      } else {
        state.appliances.push(id);
      }
      saveState();
      render();
      if (document.getElementById("sheetBackdrop").classList.contains("open") && document.getElementById("settingsSheetMarker")) {
        openSettingsSheet();
      }
    }

        { id: "airfryer", label: "Airfryer" },

      ];
      openSheet("⚙️ Ajustes de Cocina y Respaldo", `

        <div class="card">
          <div class="card-title">Presupuesto &amp; Metas Diarias</div>
          <div class="grid-3" style="margin-top:8px;">

              <input type="text" inputmode="decimal" value="${state.budget}" onchange="updateBudget(this.value)" />

    function togglePantry(key) {
      if (state.pantryKeys.includes(key)) {
        state.pantryKeys = state.pantryKeys.filter(x => x !== key);
      } else {
        state.pantryKeys.push(key);
      }
      saveState();
      render();
    }

    function exportBackupJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement("a");
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `mealprep-respaldo-${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast("Respaldo JSON descargado");
    }

    function openImportBackupSheet() {
      openSheet("Restaurar copia de seguridad", `
        <p class="card-sub">Pega el contenido de tu archivo de respaldo JSON para recuperar tus datos.</p>
        <textarea id="importJsonArea" rows="6" placeholder='{"supermarket":"REWE", ...}'></textarea>
        <button class="btn-primary" onclick="applyImportBackup()">Restaurar datos</button>
      `);
    }

    function applyImportBackup() {
      try {
        const raw = document.getElementById("importJsonArea").value.trim();
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") throw new Error();
        state = normalizeState(parsed);
        saveState();
        closeSheet();
        render();
        showToast("Respaldo restaurado con éxito");
      } catch (e) {
        showToast("JSON inválido, revisa el texto pegado");
      }
    }

    function resetDemoData() {
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      render();
      showToast("Datos restablecidos");
    }

    function openSheet(title, html) {
      document.getElementById("sheetTitle").textContent = title;
      document.getElementById("sheetBody").innerHTML = html;
      document.getElementById("sheetBackdrop").classList.add("open");
    }

    function closeSheet() {
      document.getElementById("sheetBackdrop").classList.remove("open");
    }

    function handleBackdropClick(e) {
      if (e.target.id === "sheetBackdrop") closeSheet();
    }

        <div>

          <input type="text" inputmode="decimal" id="bgStart" value="${state.bodyGoals.startWeight}" />

    function openRecipeSheet(id, servings = 1) {
      const r = state.recipes.find(x => x.id === id);
      if (!r) return;
      if (activeRecipeSheet.id !== id) {
        activeRecipeSheet = { id, servings, checkedIngs: {}, checkedSteps: {} };
      } else {
        activeRecipeSheet.servings = servings;
      }
      renderActiveRecipeSheet();
    }

    function setRecipeSheetServings(n) {
      activeRecipeSheet.servings = n;
      renderActiveRecipeSheet();
    }

    function toggleRecipeIngCheck(idx) {
      activeRecipeSheet.checkedIngs[idx] = !activeRecipeSheet.checkedIngs[idx];
      renderActiveRecipeSheet();
    }

    function toggleRecipeStepCheck(idx) {
      activeRecipeSheet.checkedSteps[idx] = !activeRecipeSheet.checkedSteps[idx];
      renderActiveRecipeSheet();
    }

    function renderActiveRecipeSheet() {
      const r = state.recipes.find(x => x.id === activeRecipeSheet.id);
      if (!r) return;
      const mult = activeRecipeSheet.servings || 1;
      const scaledCost = getRecipeCost(r, mult, true);

      openSheet(r.title, `
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <span class="badge">${r.category}</span>
          <span class="badge badge-mint">⏱ ${r.timeMin} min</span>
          <span class="badge">${r.kcal} kcal · ${r.protein}g prot · ${r.carbs}g carb / porc.</span>
        </div>

        ${r.tiktokUrl ? `<a href="${escapeAttr(r.tiktokUrl)}" target="_blank" rel="noopener" class="btn-secondary">${r.tiktokUrl.includes("/search") ? "Ver videos de esta receta en TikTok ↗" : "Ver video original en TikTok ↗"}</a>` : ""}

        <div class="card-soft" style="padding:10px 11px;">
          <div class="row-between" style="margin-bottom:6px;">
            <strong style="font-size:12px; color:var(--rose-dark);">Multiplicar porciones (Batch Cooking)</strong>
            <strong style="font-size:12px; color:var(--text-main);">${fmtEur(scaledCost)}</strong>
          </div>
          <div class="seg-control" style="grid-template-columns: repeat(5, 1fr);">
            ${[1, 1.5, 2, 3, 5].map(n => `
              <button class="seg-btn ${mult === n ? "active" : ""}" onclick="setRecipeSheetServings(${n})">×${String(n).replace(".", ",")}</button>
            `).join("")}
          </div>
          ${mult !== 1 ? `<div style="font-size:11px; color:var(--text-muted); margin-top:6px;">Total (×${String(mult).replace(".", ",")}): <strong>${Math.round(r.kcal * mult)} kcal</strong> · <strong>${Math.round(r.protein * mult)}g P</strong> · <strong>${Math.round(r.carbs * mult)}g C</strong></div>` : ""}
        </div>

        <div>
          <strong style="font-size:13px;">Ingredientes (${mult} ${mult === 1 ? "porción" : "porciones"}) — toca para tachar</strong>
          <div style="display:flex; flex-direction:column; gap:5px; margin-top:6px;">
            ${(r.ingredients || []).map((ing, idx) => {
              const done = Boolean(activeRecipeSheet.checkedIngs[idx]);
              const inHome = state.pantryKeys.includes(ing.key);
              return `
                <div class="cook-step-item ${done ? "done" : ""}" onclick="toggleRecipeIngCheck(${idx})">
                  <div class="check-box" style="width:18px; height:18px; font-size:11px; ${done ? "background:var(--rose);border-color:var(--rose);" : ""}">${done ? "✓" : ""}</div>
                  <div style="flex:1;">
                    ${scaleIngredientLabel(ing.label, mult)}
                    ${inHome ? `<span style="font-size:10.5px; color:var(--mint-text); font-weight:700;"> (en casa)</span>` : ""}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>

        <div>
          <strong style="font-size:13px;">Modo cocina paso a paso</strong>
          <div style="display:flex; flex-direction:column; gap:6px; margin-top:6px;">
            ${(r.steps || []).map((s, idx) => {
              const done = Boolean(activeRecipeSheet.checkedSteps[idx]);
              return `
                <div class="cook-step-item ${done ? "done" : ""}" onclick="toggleRecipeStepCheck(${idx})">
                  <div class="check-box" style="width:18px; height:18px; font-size:11px; ${done ? "background:var(--rose);border-color:var(--rose);" : ""}">${done ? "✓" : idx + 1}</div>
                  <div style="flex:1;">${s}</div>
                </div>
              `;
            }).join("")}
          </div>
        </div>

        <div class="grid-2">
          <button class="btn-secondary" onclick="shareRecipe('${r.id}')">Compartir receta</button>
          <button class="btn-primary" onclick="openBatchAssignSheet('${r.id}')">+ Batch / Tápers</button>
        </div>
      `);
    }

    function openBatchAssignSheet(recipeId) {
      const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
      openSheet("Batch Cooking · Asignar días", `
        <p class="card-sub">Marca uno o varios días de lunes a viernes para cocinar por lotes:</p>
        <div style="display:flex; flex-direction:column; gap:7px;">
          ${days.map(d => {
            const isCurrent = state.tapers[d] === recipeId;
            return `
              <label class="check-item" style="margin:0; cursor:pointer;">
                <div class="check-left">
                  <input type="checkbox" class="batch-day-cb" value="${d}" ${isCurrent ? "checked" : ""} style="width:18px; height:18px; accent-color:var(--rose);" />
                  <span class="check-label">${d} <small style="color:var(--text-soft);">(${(state.recipes.find(x => x.id === state.tapers[d]) || {}).title || ""})</small></span>
                </div>
              </label>
            `;
          }).join("")}
        </div>
        <button class="btn-primary" onclick="saveBatchAssign('${recipeId}')">Aplicar a días seleccionados</button>
      `);
    }

    function saveBatchAssign(recipeId) {
      const cbs = Array.from(document.querySelectorAll(".batch-day-cb:checked"));
      if (!cbs.length) {
        showToast("Selecciona al menos un día");
        return;
      }
      cbs.forEach(cb => {
        state.tapers[cb.value] = recipeId;
      });
      saveState();
      closeSheet();
      render();
      showToast(`Asignado a ${cbs.length} día(s)`);
    }

    function openDaySelectorSheet(day) {
      const isWeekend = day === "Sábado" || day === "Domingo";
      openSheet(`Plato para ${day}`, `
        ${isWeekend ? `<button class="btn-ghost" style="border:1px dashed var(--border-strong); padding:9px;" onclick="assignRecipeToDay('${day}', '')">Dejar libre / flexible (sin plato fijo)</button>` : ""}
        ${state.recipes.map(r => `
          <button class="btn-secondary" style="justify-content:space-between; text-align:left;" onclick="assignRecipeToDay('${day}', '${r.id}')">
            <span><strong>${r.title}</strong><br><small style="color:var(--text-muted);">${r.kcal} kcal · ${r.protein}g prot · ${r.timeMin} min</small></span>
            <span>${fmtEur(getRecipeCost(r, 1, true))}</span>
          </button>
        `).join("")}
      `);
    }

    function assignRecipeToDay(day, recipeId) {
      if (day === "Sábado" || day === "Domingo") {
        if (!state.weekendMeals) state.weekendMeals = { Sábado: "", Domingo: "" };
        state.weekendMeals[day] = recipeId;
      } else {
        state.tapers[day] = recipeId;
      }
      saveState();
      closeSheet();
      render();
      showToast(recipeId ? `${day} actualizado` : `${day} marcado como libre`);
    }

    function saveTikTokRecipe() {
      const title = document.getElementById("ttTitle").value.trim();
      if (!title) {
        showToast("Escribe el nombre de la receta");
        return;
      }
      const key = document.getElementById("ttIngKey").value;
      const meta = state.prices[key] || { unit: "kg" };
      const qty = meta.unit === "kg" ? 0.18 : (meta.unit === "L" ? 0.01 : 1);

      const newRecipe = {
        id: "tt_" + Date.now(),
        title,
        category: document.getElementById("ttCat").value,
        timeMin: parseNumInput(document.getElementById("ttTime").value, 15),
        quickToday: true,
        taperFriendly: true,
        taperTip: "Guarda en táper hermético y ajusta porciones según tu meta calórica.",
        appliances: ["sarten"],
        kcal: parseNumInput(document.getElementById("ttKcal").value, 400),
        protein: parseNumInput(document.getElementById("ttProt").value, 35),
        carbs: parseNumInput(document.getElementById("ttCarb").value, 28),
        fat: 12,
        tiktokUrl: document.getElementById("ttUrl").value.trim(),
        ingredients: [{ key, qty, label: `${title} (${meta.name})` }],
        steps: [document.getElementById("ttNotes").value.trim() || "Preparar según receta del video de TikTok."]
      };

      state.recipes.unshift(newRecipe);
      saveState();
      closeSheet();
      render();
      showToast("Receta TikTok Fit guardada");
    }

    function openPriceEditorSheet() {
      const entries = Object.entries(state.prices);
      openSheet(`Precios base (${state.supermarket})`, `
        <p class="card-sub">Escribe el precio real (admite coma o punto). Se actualiza en presupuesto y porciones.</p>
        ${entries.map(([k, v]) => `
          <div class="row-between" style="gap:8px;">
            <span style="font-size:12.5px; flex:1;">${v.name} <small style="color:var(--text-soft);">(${v.unit})</small></span>
            <input type="text" inputmode="decimal" id="price_inp_${k}" style="width:94px;" value="${v.price}" onchange="updateSinglePrice('${k}', this.value)" />
          </div>
        `).join("")}
        <button class="btn-primary" onclick="applyAllEditedPrices()">Guardar y aplicar precios</button>
      `);
    }

    function updateSinglePrice(key, val) {
      if (!state.prices[key]) return;
      const parsed = parseNumInput(val, NaN);
      if (!Number.isFinite(parsed) || parsed < 0) return;
      state.prices[key].price = parsed;
      saveState();
      render();
    }

    function applyAllEditedPrices() {
      Object.keys(state.prices).forEach(k => {
        const el = document.getElementById("price_inp_" + k);
        if (el) {
          const parsed = parseNumInput(el.value, NaN);
          if (Number.isFinite(parsed) && parsed >= 0) {
            state.prices[k].price = parsed;
          }
        }
      });
      saveState();
      closeSheet();
      render();
      showToast("Precios actualizados en toda la app");
    }

    function openWeightLogSheet() {
      const today = new Date().toISOString().slice(0, 10);
      const last = state.weightLogs[state.weightLogs.length - 1] || { weight: 69.0 };
      openSheet("Registrar peso (kg)", `
        <div>
          <label>Fecha</label>
          <input type="date" id="wlDate" value="${today}" />
        </div>
        <div>
          <label>Peso actual (kg)</label>
          <input type="text" inputmode="decimal" id="wlWeight" value="${last.weight}" />
        </div>
        <button class="btn-primary" onclick="saveWeightLog()">Guardar peso</button>
      `);
    }

    function saveWeightLog() {
      const date = document.getElementById("wlDate").value || new Date().toISOString().slice(0, 10);
      const weight = parseNumInput(document.getElementById("wlWeight").value, NaN);
      if (!Number.isFinite(weight) || weight <= 20) return;
      state.weightLogs.push({ id: "w_" + Date.now(), date, weight });
      saveState();
      closeSheet();
      render();
      showToast("Peso guardado y Body Goals actualizados");
    }

    function openStepsSheet() {
      const today = new Date().toISOString().slice(0, 10);
      const existing = state.stepsLogs.find(s => s.date === today) || { steps: "" };
      openSheet("Registrar pasos del día", `
        <p class="card-sub">Pega o escribe el total de pasos de hoy desde Salud / Atajos:</p>
        <div>
          <label>Pasos de hoy</label>
          <input type="number" step="100" id="stCount" value="${existing.steps}" placeholder="Ej. 8500" />
        </div>
        <button class="btn-primary" onclick="saveStepsLog()">Guardar pasos</button>
      `);
    }

    function saveStepsLog() {
      const today = new Date().toISOString().slice(0, 10);
      const steps = Math.max(0, parseNumInput(document.getElementById("stCount").value, 0));
      const idx = state.stepsLogs.findIndex(s => s.date === today);
      if (idx >= 0) state.stepsLogs[idx].steps = steps;
      else state.stepsLogs.push({ date: today, steps });
      saveState();
      closeSheet();
      render();
      showToast(`Pasos guardados: ${steps.toLocaleString("es-ES")}`);
    }

    function selectMedTemplate(catId) {

      document.querySelectorAll("#medCatChips .chip").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === catId);
      });
      const nameEl = document.getElementById("medName");
      const doseEl = document.getElementById("medDose");
      const timeEl = document.getElementById("medTime");
      const stockEl = document.getElementById("medStock");
      const foodEl = document.getElementById("medWithFood");
      const f15El = document.getElementById("medFollowUp15");
      if (nameEl && !nameEl.value.trim() && meta.sampleName) nameEl.value = meta.sampleName;
      if (doseEl && !doseEl.value.trim() && meta.sampleDose) doseEl.value = meta.sampleDose;
      if (timeEl) timeEl.value = meta.defTime;
      if (stockEl && meta.defStock) stockEl.value = meta.defStock;
      if (foodEl) foodEl.checked = Boolean(meta.withFood);
      if (f15El) f15El.checked = Boolean(meta.followUp15);
    }

      const editId = document.getElementById("medEditId")?.value || "";
      const name = String(document.getElementById("medName")?.value || "").trim();
      if (!name) {

        return;

      const category = document.getElementById("medCategory")?.value || "other";
      const time = document.getElementById("medTime")?.value || "08:30";

      const stock = rawStock !== "" && Number.isFinite(Number(rawStock)) && Number(rawStock) >= 0 ? Math.round(Number(rawStock)) : null;
      const withFood = Boolean(document.getElementById("medWithFood")?.checked);
      const followUp15 = Boolean(document.getElementById("medFollowUp15")?.checked);

      if (editId) {
        const idx = state.meds.findIndex(m => m.id === editId);
        if (idx >= 0) {
          state.meds[idx] = { ...state.meds[idx], name, dose, category, time, stock, withFood, followUp15 };

        state.meds.push({
          id: "m_" + Date.now(),
          name,
          dose,
          category,
          time,
          stock,
          withFood,
          followUp15,
          checked: false

    function downloadRemindersIcs() {
      const m = getAdaptiveNutritionMetrics();
      const plan = getAdaptiveTrainingPlan(m);
      const rems = state.reminders || {};
      const pad2 = n => String(n).padStart(2, "0");

      const now = new Date();
      const y = now.getFullYear();
      const mo = pad2(now.getMonth() + 1);
      const da = pad2(now.getDate());
      const dtStamp = `${y}${mo}${da}T${pad2(now.getHours())}${pad2(now.getMinutes())}00`;

      const weekdayToIcs = {
        Lunes: "MO",
        Martes: "TU",
        Miércoles: "WE",
        Jueves: "TH",
        Viernes: "FR",
        Sábado: "SA",
        Domingo: "SU"
      };
      const workoutByDays = (plan.schedule || [])
        .map(d => weekdayToIcs[getPlanDayWeekday(d)])
        .filter(Boolean);
      const uniqueWorkoutDays = Array.from(new Set(workoutByDays));

      const makeEvent = (uid, summary, desc, timeStr, durationMin, rrule) => {
        const parts = String(timeStr || "09:00").split(":");
        const hh = pad2(parseInt(parts[0], 10) || 9);
        const mm = pad2(parseInt(parts[1], 10) || 0);
        const startMinTotal = (parseInt(hh, 10) * 60) + parseInt(mm, 10) + durationMin;
        const endHh = pad2(Math.floor(startMinTotal / 60) % 24);
        const endMm = pad2(startMinTotal % 60);
        return [
          "BEGIN:VEVENT",
          `UID:${uid}@mealprep-nutritrack`,
          `DTSTAMP:${dtStamp}`,
          `DTSTART:${y}${mo}${da}T${hh}${mm}00`,
          `DTEND:${y}${mo}${da}T${endHh}${endMm}00`,
          `RRULE:${rrule}`,
          `SUMMARY:${summary}`,
          `DESCRIPTION:${desc}`,
          "BEGIN:VALARM",
          "TRIGGER:-PT0M",
          "ACTION:DISPLAY",
          `DESCRIPTION:${summary}`,
          "END:VALARM",
          "END:VEVENT"
        ].join("\r\n");
      };

      const events = [];
      if (rems.morningMeds?.enabled) {
        events.push(makeEvent(
          "mp-morning-meds",
          "💊 MealPrep: Toma mañana y desayuno proteico",
          "Revisa tu protocolo de mañana y empieza con proteína + fibra.",
          rems.morningMeds.time, 15, "FREQ=DAILY"
        ));
      }
      if (rems.postMealWalk?.enabled) {
        events.push(makeEvent(
          "mp-postmeal-walk",
          "🚶 MealPrep: Caminata 15 min post-almuerzo",
          "Caminata suave de 10–15 min tras comer para estabilidad glucémica.",
          rems.postMealWalk.time, 15, "FREQ=DAILY"
        ));
      }
      if (rems.workout?.enabled && uniqueWorkoutDays.length) {
        events.push(makeEvent(
          "mp-workout",
          `🏋️ MealPrep: ${plan.planTitle}`,
          `Plan activo: ${plan.planTitle} (${plan.rpeLabel} · descansos ${plan.restMain}). Abre Entreno para ver tu rutina del día.`,
          rems.workout.time, 45, `FREQ=WEEKLY;BYDAY=${uniqueWorkoutDays.join(",")}`
        ));
      }
      if (rems.eveningMeds?.enabled) {
        events.push(makeEvent(
          "mp-evening-meds",
          "💊 MealPrep: Toma noche y cierre del día",
          "Completa tu protocolo nocturno (ej. Magnesio) y revisa tus pasos.",
          rems.eveningMeds.time, 10, "FREQ=DAILY"
        ));
      }
      if (rems.batchPrep?.enabled) {
        events.push(makeEvent(
          "mp-batch-prep",
          "🥡 MealPrep: Batch Cooking semanal (5 tápers L–V)",
          "Revisa tu lista en Súper y cocina tus tápers de la semana.",
          rems.batchPrep.time, 60, "FREQ=WEEKLY;BYDAY=SU"
        ));
      }
      if (rems.dailySync?.enabled) {
        events.push(makeEvent(
          "mp-daily-sync",
          "🔄 MealPrep: Sincronizar Apple Salud / Xiaomi",
          "Ejecuta tu Atajo Sync MealPrep para guardar pasos, peso y entreno de hoy.",
          rems.dailySync.time, 5, "FREQ=DAILY"
        ));
      }

      if (!events.length) {
        showToast("Activa al menos un recordatorio primero");
        return;
      }

      const ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//MealPrep & NutriTrack//Recordatorios iPhone//ES",
        "CALSCALE:GREGORIAN",
        "X-WR-CALNAME:MealPrep & NutriTrack",
        ...events,
        "END:VCALENDAR"
      ].join("\r\n");

      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "mealprep-recordatorios-iphone.ics";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(`📅 ${events.length} recordatorios descargados (.ics) — ábrelo en tu iPhone`);
    }

    function applySyncedHealthPayload({ steps, weight, workoutMin, workoutType, periodStart, cycleLength, periodDays, cyclePhase, energy, sourceLabel = "Apple Salud / Xiaomi" }) {
      const today = new Date().toISOString().slice(0, 10);
      const parts = [];

      if (Number.isFinite(steps) && steps > 0) {
        const roundedSteps = Math.round(steps);
        const idx = state.stepsLogs.findIndex(s => s.date === today);
        if (idx >= 0) state.stepsLogs[idx].steps = roundedSteps;
        else state.stepsLogs.push({ date: today, steps: roundedSteps });
        parts.push(`${roundedSteps.toLocaleString("es-ES")} pasos`);
      }

      if (Number.isFinite(weight) && weight >= 30 && weight <= 250) {
        const cleanW = Number(weight.toFixed(1));
        const idx = state.weightLogs.findIndex(w => w.date === today);
        if (idx >= 0) state.weightLogs[idx].weight = cleanW;
        else state.weightLogs.push({ id: "w_sync_" + Date.now(), date: today, weight: cleanW });
        parts.push(`${cleanW.toFixed(1)} kg`);
      }

      if (Number.isFinite(workoutMin) && workoutMin >= 5 && workoutMin <= 360) {
        const cleanMin = Math.round(workoutMin);
        const typeStr = (workoutType && String(workoutType).trim()) || "Apple Salud / Xiaomi";
        const alreadyLogged = state.workouts.some(w => w.date === today && w.minutes === cleanMin && w.type === typeStr);
        if (!alreadyLogged) {
          state.workouts.push({
            id: "wo_sync_" + Date.now(),
            date: today,
            type: typeStr,
            minutes: cleanMin,
            intensity: "Moderada"
          });
        }
        parts.push(`${cleanMin} min entreno`);
      }

      if (periodStart && /^\d{4}-\d{2}-\d{2}$/.test(String(periodStart).trim())) {
        const cleanStart = String(periodStart).trim();
        const cleanLen = (Number.isFinite(cycleLength) && cycleLength >= 20 && cycleLength <= 50)
          ? Math.round(cycleLength)
          : (state.cycleProfile?.avgCycleLength || 28);
        const cleanPDays = (Number.isFinite(periodDays) && periodDays >= 2 && periodDays <= 10)
          ? Math.round(periodDays)
          : (state.cycleProfile?.periodDays || 5);
        state.cycleProfile = {
          ...(state.cycleProfile || DEFAULT_STATE.cycleProfile),
          mode: "auto",
          lastPeriodStart: cleanStart,
          avgCycleLength: cleanLen,
          periodDays: cleanPDays,
          clueSource: sourceLabel,
          clueSyncedAt: new Date().toLocaleDateString("es-ES", { day: "numeric", month: "short" })
        };
        const cInfo = getActiveCyclePhase({ sex: "F" });
        parts.push(cInfo ? `Clue Día ${cInfo.cycleDay}/${cleanLen} (${cInfo.short})` : `Ciclo ${cleanStart}`);
      } else if (cyclePhase && CYCLE_PHASE_META[cyclePhase]) {
        state.cycleProfile = {
          ...(state.cycleProfile || DEFAULT_STATE.cycleProfile),
          mode: "manual",
          phase: cyclePhase,
          clueSource: sourceLabel,
          clueSyncedAt: new Date().toLocaleDateString("es-ES", { day: "numeric", month: "short" })
        };
        parts.push(`Fase ${CYCLE_PHASE_META[cyclePhase].short}`);
      }

      if (Number.isFinite(energy) && energy >= 1 && energy <= 5) {
        state.cycleProfile = {
          ...(state.cycleProfile || DEFAULT_STATE.cycleProfile),
          dailyEnergy: Math.round(energy),
          dailyEnergyDate: today
        };
        parts.push(`Energía ${Math.round(energy)}/5`);
      }

      if (!parts.length) return false;

      const stamp = new Date().toLocaleDateString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      state.syncConfig = {
        ...(state.syncConfig || {}),
        lastSyncAt: stamp,
        lastSyncSummary: `${sourceLabel}: ${parts.join(" · ")}`
      };
      saveState();
      return parts.join(" · ");
    }

    function importHealthHistoryData() {
      const raw = (document.getElementById("healthImportArea")?.value || "").trim();
      if (!raw) {
        showToast("Pega datos CSV o JSON primero");
        return;
      }
      let importedCount = 0;
      try {
        if (raw.startsWith("{") || raw.startsWith("[")) {
          const parsed = JSON.parse(raw);
          const rows = Array.isArray(parsed) ? parsed : (parsed.data || parsed.metrics || [parsed]);
          rows.forEach(item => {
            const date = String(item.date || item.fecha || new Date().toISOString().slice(0, 10)).slice(0, 10);
            const steps = parseNumInput(item.steps ?? item.pasos, NaN);
            const weight = parseNumInput(item.weight ?? item.peso, NaN);
            if (Number.isFinite(steps) && steps > 0) {
              const idx = state.stepsLogs.findIndex(s => s.date === date);
              if (idx >= 0) state.stepsLogs[idx].steps = Math.round(steps);
              else state.stepsLogs.push({ date, steps: Math.round(steps) });
              importedCount++;
            }
            if (Number.isFinite(weight) && weight >= 30 && weight <= 250) {
              const idx = state.weightLogs.findIndex(w => w.date === date);
              if (idx >= 0) state.weightLogs[idx].weight = Number(weight.toFixed(1));
              else state.weightLogs.push({ id: "w_imp_" + Date.now() + importedCount, date, weight: Number(weight.toFixed(1)) });
              importedCount++;
            }
          });
        } else {
          raw.split(/\r?\n/).forEach(line => {
            const cols = line.split(/[;,]/).map(s => s.trim());
            if (cols.length < 2) return;
            const date = /^\d{4}-\d{2}-\d{2}$/.test(cols[0]) ? cols[0] : new Date().toISOString().slice(0, 10);
            const steps = parseNumInput(cols[1], NaN);
            const weight = cols[2] !== undefined ? parseNumInput(cols[2], NaN) : NaN;
            if (Number.isFinite(steps) && steps > 0) {
              const idx = state.stepsLogs.findIndex(s => s.date === date);
              if (idx >= 0) state.stepsLogs[idx].steps = Math.round(steps);
              else state.stepsLogs.push({ date, steps: Math.round(steps) });
              importedCount++;
            }
            if (Number.isFinite(weight) && weight >= 30 && weight <= 250) {
              const idx = state.weightLogs.findIndex(w => w.date === date);
              if (idx >= 0) state.weightLogs[idx].weight = Number(weight.toFixed(1));
              else state.weightLogs.push({ id: "w_imp_" + Date.now() + importedCount, date, weight: Number(weight.toFixed(1)) });
              importedCount++;
            }
          });
        }
        if (!importedCount) throw new Error();
        state.syncConfig.lastSyncAt = new Date().toLocaleDateString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        state.syncConfig.lastSyncSummary = `Importación manual (${importedCount} registros)`;
        saveState();
        closeSheet();
        render();
        showToast(`✓ Importados ${importedCount} dato(s) de Salud`);
      } catch (e) {
        showToast("Formato no reconocido (usa fecha,pasos,peso o JSON)");
      }
    }

    function processAutoSyncFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (!params.has("autosync") && !params.has("steps") && !params.has("weight") && !params.has("workoutMin") && !params.has("periodStart") && !params.has("cyclePhase") && !params.has("energy")) {
          return;
        }
        const steps = parseNumInput(params.get("steps"), NaN);
        const weight = parseNumInput(params.get("weight"), NaN);
        const workoutMin = parseNumInput(params.get("workoutMin"), NaN);
        const workoutType = params.get("workoutType") || "Apple Salud / Xiaomi";
        const periodStart = params.get("periodStart") || "";
        const cycleLength = parseNumInput(params.get("cycleLength"), NaN);
        const periodDays = parseNumInput(params.get("periodDays"), NaN);
        const cyclePhase = params.get("cyclePhase") || "";
        const energy = parseNumInput(params.get("energy"), NaN);
        const summary = applySyncedHealthPayload({ steps, weight, workoutMin, workoutType, periodStart, cycleLength, periodDays, cyclePhase, energy });
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
        if (summary) {
          setTimeout(() => showToast(`✓ Sincronizado: ${summary}`), 250);
        }
      } catch (e) {}
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    processAutoSyncFromUrl();
    render();
  </script>
</body>
</html>
