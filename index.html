<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F9E8EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MealPrep" />
  <title>MealPrep &amp; NutriTrack</title>
  <style>
    :root {
      --bg-app: #FAF7F8;
      --bg-surface: #FFFFFF;
      --bg-soft: #FAF1F4;
      --bg-tint: #F4E1E8;
      --border: #EFE1E6;
      --border-strong: #E1C2CE;
      --text-main: #271920;
      --text-muted: #6C5560;
      --text-soft: #967D88;
      --rose: #CF537D;
      --rose-dark: #A93B62;
      --rose-badge-bg: #F9E6ED;
      --rose-badge-text: #9E3359;
      --mint-bg: #EAF6F0;
      --mint-text: #1E6B4E;
      --amber-bg: #FFF4E4;
      --amber-text: #8F560A;
      --danger-bg: #FDECEC;
      --danger-text: #A62626;
      --shadow-sm: 0 2px 10px rgba(42, 25, 32, 0.045);
      --shadow-md: 0 10px 28px rgba(42, 25, 32, 0.10);
      --radius-lg: 18px;
      --radius-md: 13px;
      --radius-sm: 10px;
      --radius-pill: 999px;
      --nav-height: 68px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F4E4EA;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .phone-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(74, 24, 43, 0.14);
    }

    @media (min-width: 520px) {
      body {
        padding: 16px;
        align-items: center;
      }
      .phone-shell {
        height: min(910px, calc(100dvh - 32px));
        border-radius: 36px;
        border: 6px solid #3B232C;
      }
    }

    .topbar {
      background: linear-gradient(135deg, #522639 0%, #733450 100%);
      color: #FFFFFF;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: calc(11px + env(safe-area-inset-top)) 16px 10px;
      z-index: 20;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(59, 24, 40, 0.16);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .brand > div {
      min-width: 0;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      display: none;
    }

    .pill-status {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pill-status.over-budget {
      background: #FDECEC;
      border-color: #F6B8B8;
      color: #A62626;
    }

    .macro-strip {
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 11px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.92);
    }

    .macro-strip-item {
      display: flex;
      align-items: baseline;
      gap: 3px;
      white-space: nowrap;
    }

    .macro-strip-item strong {
      color: #FFFFFF;
      font-weight: 800;
    }

    .macro-strip-sep {
      opacity: 0.35;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 15px 15px calc(24px + env(safe-area-inset-bottom));
      scroll-behavior: smooth;
    }

    .section-gap {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 15px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px 14px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 750;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .card-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 0;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    .btn-primary {
      background: var(--rose);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(212, 91, 132, 0.25);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: var(--rose-dark);
    }

    .btn-secondary {
      background: var(--bg-soft);
      color: var(--rose-badge-text);
      border: 1px solid var(--border-strong);
      font-weight: 700;
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary:active {
      background: var(--bg-tint);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      font-weight: 650;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 11.5px;
      border-radius: var(--radius-sm);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding-bottom: 2px;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 650;
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    .chip.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--rose-badge-bg);
      color: var(--rose-badge-text);
    }

    .badge-mint {
      background: var(--mint-bg);
      color: var(--mint-text);
    }

    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .recipe-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recipe-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .recipe-title {
      font-size: 14.5px;
      font-weight: 750;
      margin: 0;
    }

    .recipe-price {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--rose-dark);
      white-space: nowrap;
    }

    .macros-line {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-soft);
      padding: 6px 9px;
      border-radius: var(--radius-sm);
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(212, 91, 132, 0.14);
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
    }

    .check-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
    }

    .check-item.done .check-box {
      background: var(--rose);
      border-color: var(--rose);
    }

    .check-item.done .check-label {
      text-decoration: line-through;
      color: var(--text-soft);
    }

    .check-label {
      font-size: 13px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-track {
      height: 8px;
      background: var(--bg-tint);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #E3789C, var(--rose-dark));
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .progress-fill-mint {
      height: 100%;
      background: linear-gradient(90deg, #43B88C, #1E6B4E);
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .goal-box {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px;
    }

    .pantry-group-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--rose-dark);
      margin: 8px 0 5px;
    }

    .bmi-bar {
      position: relative;
      height: 10px;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, #8EC5FC 0%, #7ED9A6 25%, #7ED9A6 55%, #F7C97E 78%, #F28B82 100%);
      margin: 10px 0 6px;
    }

    .bmi-marker {
      position: absolute;
      top: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--rose-dark);
      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.28);
      transform: translateX(-50%);
    }

    .satiety-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sat-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 750;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-muted);
    }

    .sat-btn.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }

    .bottom-nav {
      height: var(--nav-height);
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 18px rgba(42, 25, 32, 0.05);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      flex-shrink: 0;
      z-index: 20;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10.5px;
      font-weight: 650;
      color: var(--text-soft);
      padding: 5px 2px;
      min-width: 0;
    }

    .nav-btn.active {
      color: var(--rose-dark);
      font-weight: 800;
    }

    .nav-btn.active .nav-icon {
      background: var(--rose-badge-bg);
      border-radius: 10px;
      padding: 2px 10px;
    }

    .nav-icon {
      font-size: 17px;
      line-height: 1.15;
      padding: 2px 10px;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 25, 32, 0.42);
      backdrop-filter: blur(2px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-width: 440px;
      max-height: 86dvh;
      background: var(--bg-app);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .sheet-header {
      padding: 10px 16px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-strong);
      margin: 0 auto 10px;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      position: fixed;
      bottom: calc(var(--nav-height) + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #2A1920;
      color: #fff;
      font-size: 12.5px;
      font-weight: 650;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 80;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-note {
      text-align: center;
      padding: 20px 12px;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--bg-soft);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-strong);
    }

    .seg-control {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: var(--radius-md);
    }

    .seg-control.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .seg-control.cols-4 {
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .seg-control.cols-4 .seg-btn {
      font-size: 11px;
      padding: 7px 3px;
      white-space: nowrap;
    }

    .seg-btn {
      padding: 7px 6px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--rose-dark);
      box-shadow: 0 2px 6px rgba(180, 67, 106, 0.12);
    }

    .macro-targets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .macro-target-tile {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 10px;
    }

    .macro-target-tile.highlight {
      background: linear-gradient(135deg, #FCEAF1, #FFF7FA);
      border-color: var(--border-strong);
    }

    .macro-target-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .macro-target-tile.highlight .macro-target-val {
      color: var(--rose-dark);
    }

    .macro-target-lbl {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .macro-target-sub {
      font-size: 10px;
      color: var(--text-soft);
      margin-top: 2px;
    }

    .clinical-tip-box {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .clinical-tip-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--text-main);
      line-height: 1.42;
    }

    .clinical-tip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rose);
      margin-top: 6px;
      flex-shrink: 0;
    }

    .carb-rations-box {
      background: #FFF9FB;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 11px;
      margin-top: 10px;
    }

    .meal-ration-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
    }

    .micro-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .micro-item {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 11px;
    }

    .micro-item.priority {
      background: #FFF7FA;
      border-color: var(--border-strong);
    }

    .micro-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .micro-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
    }

    .micro-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
      margin: 0;
    }

    .micro-care {
      font-size: 11.5px;
      color: var(--text-main);
      line-height: 1.4;
      margin: 4px 0 0;
    }

    .disclaimer-box {
      background: rgba(252, 238, 243, 0.55);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.45;
      color: var(--text-soft);
    }

    .workout-day-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .workout-day-card.done {
      background: #FCF9FA;
      border-color: var(--border-strong);
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 10px;
    }

    .exercise-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      line-height: 1.38;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(228, 184, 200, 0.45);
    }

    .exercise-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .exercise-name {
      font-weight: 700;
      color: var(--text-main);
    }

    .exercise-scheme {
      font-size: 11px;
      font-weight: 750;
      color: var(--rose-dark);
      white-space: nowrap;
      flex-shrink: 0;

    function getRecipeCost(recipe, servings = 1, excludePantry = true) {
      let total = 0;
      (recipe.ingredients || []).forEach(ing => {
        if (excludePantry && state.pantryKeys.includes(ing.key)) return;
        total += (Number(ing.qty) || 0) * servings * getUnitPrice(ing.key);
      });
      return total;
    }

    function getShoppingList() {
      const map = {};
      Object.values(state.tapers).forEach(recipeId => {
        const r = state.recipes.find(x => x.id === recipeId);
        if (!r) return;
        (r.ingredients || []).forEach(ing => {
          if (state.pantryKeys.includes(ing.key)) return;
          if (!map[ing.key]) {
            const meta = state.prices[ing.key] || { name: ing.key, unit: "ud", aisle: "Despensa", price: 2, packSize: 1, packLabel: "unidad" };
            map[ing.key] = {
              key: ing.key,
              name: meta.name,
              unit: meta.unit,
              aisle: meta.aisle || "Despensa",
              qty: 0,
              unitPrice: getUnitPrice(ing.key),
              packSize: meta.packSize || 1,
              packLabel: meta.packLabel || meta.unit
            };
          }
          map[ing.key].qty += Number(ing.qty || 0);
        });
      });
      return Object.values(map).map(item => {
        const packsNeeded = Math.max(1, Math.ceil(item.qty / item.packSize));
        return {
          ...item,
          cost: item.qty * item.unitPrice,
          packCost: packsNeeded * item.packSize * item.unitPrice,
          packsNeeded
        };
      });
    }

    function getTotalShoppingCost() {
      return getShoppingList().reduce((sum, item) => sum + item.cost, 0);

    function scaleIngredientLabel(label, mult) {
      if (mult === 1) return label;
      const str = String(label || "");
      const fmtNum = (n) => {
        const rounded = Math.round(n * 10) / 10;
        return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(".", ",");
      };
      // Handle leading fraction like "1/2 limón"
      const fracMatch = str.match(/^(\d+)\s*\/\s*(\d+)(.*)$/);
      if (fracMatch) {
        const val = (Number(fracMatch[1]) / Number(fracMatch[2])) * mult;
        return `${fmtNum(val)}${fracMatch[3]}`;
      }
      // Handle leading range like "4–5 hojas..."
      const rangeMatch = str.match(/^(\d+(?:[.,]\d+)?)\s*[–-]\s*(\d+(?:[.,]\d+)?)(.*)$/);
      if (rangeMatch) {
        const a = parseFloat(rangeMatch[1].replace(",", ".")) * mult;
        const b = parseFloat(rangeMatch[2].replace(",", ".")) * mult;
        return `${fmtNum(a)}–${fmtNum(b)}${rangeMatch[3]}`;
      }
      // Handle leading number like "180 g pechuga..." or "1.5 cdtas..."
      const numMatch = str.match(/^(\d+(?:[.,]\d+)?)(.*)$/);
      if (numMatch) {
        const val = parseFloat(numMatch[1].replace(",", ".")) * mult;
        return `${fmtNum(val)}${numMatch[2]}`;
      }
      return `${str} (×${mult})`;
    }

    function getAdaptiveNutritionMetrics() {
      const sex = state.bodyProfile.sex === "M" ? "M" : "F";
      const age = Math.max(15, Math.min(90, Number(state.bodyProfile.age) || 21));
      const heightCm = Math.max(120, Math.min(220, Number(state.bodyProfile.heightCm) || 158));
      const heightM = heightCm / 100;
      const weightKg = getCurrentWeightKg();
      const activity = Number(state.bodyProfile.activity) || 1.55;
      const goal = ["deficit", "hypertrophy", "maintenance"].includes(state.bodyProfile.goal) ? state.bodyProfile.goal : "deficit";
      const deficitVal = Math.max(250, Math.min(800, Number(state.bodyProfile.deficit) || 550));
      const surplusVal = Math.max(150, Math.min(500, Number(state.bodyProfile.surplus) || 250));

      const bmi = weightKg / (heightM * heightM);
      let bmiCategory = "Normopeso";
      let bmiColor = "var(--mint-text)";
      if (bmi < 18.5) {
        bmiCategory = "Bajo peso";
        bmiColor = "#2B6CB0";
      } else if (bmi >= 25 && bmi < 30) {
        bmiCategory = "Sobrepeso";
        bmiColor = "var(--amber-text)";
      } else if (bmi >= 30) {
        bmiCategory = "Obesidad";
        bmiColor = "var(--danger-text)";
      }
      const bmiPct = Math.max(4, Math.min(96, ((bmi - 16) / (35 - 16)) * 100));
      const healthyMinKg = (18.5 * heightM * heightM).toFixed(1);
      const healthyMaxKg = (24.9 * heightM * heightM).toFixed(1);

      const bmr = Math.round(10 * weightKg + 6.25 * heightCm - 5 * age + (sex === "M" ? 5 : -161));
      const tdee = Math.round(bmr * activity);

      const minSafeKcal = sex === "M" ? 1500 : 1250;
      let targetKcal = tdee;
      let kcalDelta = 0;
      let kcalDeltaLabel = "Equilibrio (0)";
      if (goal === "deficit") {
        targetKcal = Math.max(minSafeKcal, tdee - deficitVal);
        kcalDelta = targetKcal - tdee;
        kcalDeltaLabel = `Déficit (${kcalDelta})`;
      } else if (goal === "hypertrophy") {
        targetKcal = tdee + surplusVal;
        kcalDelta = surplusVal;
        kcalDeltaLabel = `Superávit (+${surplusVal})`;
      }

      const protPerKg = goal === "hypertrophy" ? 2.1 : (goal === "deficit" ? 1.9 : 1.6);
      const targetProtein = Math.round(weightKg * protPerKg);

      const todayStr = new Date().toISOString().slice(0, 10);
      const trainedToday = state.workouts.some(w => w.date === todayStr);
      const isDiabetes = hasCondition("diabetes");
      const isIR = hasCondition("insulin_resistance");
      const isPCOS = hasCondition("pcos");
      const glycemicControl = isDiabetes || isIR || isPCOS;

      let carbRatio = 0.42;
      if (isDiabetes) {
        carbRatio = goal === "hypertrophy" ? 0.36 : (goal === "deficit" ? 0.30 : 0.33);
      } else if (isIR) {
        carbRatio = goal === "hypertrophy" ? 0.40 : (goal === "deficit" ? 0.31 : 0.36);
      } else if (isPCOS) {
        carbRatio = goal === "hypertrophy" ? 0.41 : (goal === "deficit" ? 0.33 : 0.37);
      } else {
        carbRatio = goal === "hypertrophy" ? 0.48 : (goal === "deficit" ? 0.37 : 0.43);
      }

      let rawCarbs = Math.round((targetKcal * carbRatio) / 4) + (trainedToday ? 15 : 0);
      const minFatG = Math.max(42, Math.round(weightKg * (sex === "F" ? 0.78 : 0.72)));
      const maxCarbsByFatFloor = Math.max(70, Math.round((targetKcal - targetProtein * 4 - minFatG * 9) / 4));
      const targetCarbs = Math.max(70, Math.min(rawCarbs, maxCarbsByFatFloor));
      const targetFat = Math.max(38, Math.round((targetKcal - targetProtein * 4 - targetCarbs * 4) / 9));

      const mealsPerDay = [3, 4, 5].includes(Number(state.clinicalProfile?.mealsPerDay)) ? Number(state.clinicalProfile.mealsPerDay) : 4;
      const gramsPerRation = [10, 15].includes(Number(state.clinicalProfile?.gramsPerRation)) ? Number(state.clinicalProfile.gramsPerRation) : 15;
      const totalRations = Number((targetCarbs / gramsPerRation).toFixed(1));

      const mealTemplates = {
        3: [
          { name: "Desayuno", share: 0.30 },
          { name: "Almuerzo", share: 0.40 },
          { name: "Cena", share: 0.30 }
        ],
        4: [
          { name: "Desayuno", share: 0.25 },
          { name: "Almuerzo", share: 0.35 },
          { name: "Merienda / snack", share: 0.15 },
          { name: "Cena", share: 0.25 }
        ],
        5: [
          { name: "Desayuno", share: 0.22 },
          { name: "Media mañana", share: 0.13 },
          { name: "Almuerzo", share: 0.30 },
          { name: "Merienda", share: 0.13 },
          { name: "Cena", share: 0.22 }
        ]
      };

      const mealBreakdown = mealTemplates[mealsPerDay].map(slot => {
        const grams = Math.round(targetCarbs * slot.share);
        const rations = Number((grams / gramsPerRation).toFixed(1));
        return { name: slot.name, grams, rations };
      });

      return {
        sex,
        age,
        heightCm,
        weightKg,
        activity,
        goal,
        goalMeta: GOAL_META[goal],
        deficitVal,
        surplusVal,
        bmi,
        bmiCategory,
        bmiColor,
        bmiPct,
        healthyMinKg,
        healthyMaxKg,
        bmr,
        tdee,
        kcalDelta,
        kcalDeltaLabel,
        targetKcal,
        protPerKg,
        targetProtein,
        targetCarbs,
        targetFat,
        trainedToday,
        glycemicControl,
        isDiabetes,
        isIR,
        isPCOS,
        isIronDef: hasCondition("iron_deficiency"),
        takesMetformin: takesMetformin(),
        diabetesRations: {
          mealsPerDay,
          gramsPerRation,
          totalRations,
          mealBreakdown
        }
      };
    }

    function getBodyGoalMetrics() {
      const currentKg = getCurrentWeightKg();
      const rawStart = Number(state.bodyGoals.startWeight) || currentKg;
      const milestoneKg = Number(state.bodyGoals.milestoneKg) || 64.0;
      const annualKg = Number(state.bodyGoals.annualKg) || 60.0;
      const isGainGoal = milestoneKg > rawStart;

      const startKg = isGainGoal ? Math.min(currentKg, rawStart) : Math.max(currentKg, rawStart);

      const totalToMilestone = Math.max(0.1, Math.abs(startKg - milestoneKg));
      const progressMilestone = isGainGoal ? Math.max(0, currentKg - startKg) : Math.max(0, startKg - currentKg);
      const milestonePct = Math.max(0, Math.min(100, Math.round((progressMilestone / totalToMilestone) * 100)));
      const remMilestone = isGainGoal ? Math.max(0, milestoneKg - currentKg) : Math.max(0, currentKg - milestoneKg);

      const isGainAnnual = annualKg > rawStart;
      const totalToAnnual = Math.max(0.1, Math.abs(startKg - annualKg));
      const progressAnnual = isGainAnnual ? Math.max(0, currentKg - startKg) : Math.max(0, startKg - currentKg);
      const annualPct = Math.max(0, Math.min(100, Math.round((progressAnnual / totalToAnnual) * 100)));
      const remAnnual = isGainAnnual ? Math.max(0, annualKg - currentKg) : Math.max(0, currentKg - annualKg);

      const goal = state.bodyProfile.goal || "deficit";
      const kcalDelta = goal === "hypertrophy"
        ? Math.max(150, Number(state.bodyProfile.surplus) || 250)
        : Math.max(250, Number(state.bodyProfile.deficit) || 550);
      const weeklyRateKg = goal === "maintenance" ? 0 : (kcalDelta * 7) / 7700;
      const weeksTo64 = (remMilestone > 0 && weeklyRateKg > 0) ? Math.ceil(remMilestone / weeklyRateKg) : 0;
      const etaDate = new Date();
      etaDate.setDate(etaDate.getDate() + weeksTo64 * 7);
      const etaStr = etaDate.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });

      return {
        currentKg,
        startKg,
        milestoneKg,
        annualKg,
        milestonePct,
        remMilestone,
        annualPct,
        remAnnual,
        weeklyLossKg: weeklyRateKg,
        weeksTo64,
        etaStr,
        isGainGoal
      };
    }

        tab = "comida";

      } else if (tab === "semana") {
        tab = "hoy";
        hoySubTab = "semana";
      } else if (tab === "comida" && subTab) {
        comidaSubTab = subTab;
      } else if (tab === "hoy" && subTab) {
        hoySubTab = subTab;
      } else if (tab === "progreso" && subTab) {
        saludSubTab = subTab;
      }
      currentTab = tab;
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      render();
      document.getElementById("mainContent").scrollTop = 0;
    }

    function setHoySubTab(sub) {
      hoySubTab = sub;
      render();
    }

    function setSaludSubTab(sub) {
      saludSubTab = sub;
      render();
      document.getElementById("mainContent").scrollTop = 0;
    }

    function selectCalendarDay(dayName) {
      selectedCalendarDay = dayName;
      render();
      setTimeout(() => {
        const el = document.getElementById("cal_day_" + dayName);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 30);
    }

    function setComidaSubTab(sub) {
      comidaSubTab = sub;
      render();
    }

    function render() {
      updateHeader();
      const container = document.getElementById("mainContent");
      if (currentTab === "hoy") renderHoy(container);
      else if (currentTab === "comida") renderComida(container);
      else if (currentTab === "super") renderSuper(container);
      else if (currentTab === "entreno") renderEntreno(container);
      else if (currentTab === "progreso") renderProgreso(container);
    }

    function getTodayWeekdayName() {
      const idx = new Date().getDay(); // 0 Sun, 1 Mon ... 5 Fri, 6 Sat
      const map = { 1: "Lunes", 2: "Martes", 3: "Miércoles", 4: "Jueves", 5: "Viernes" };
      return map[idx] || null;
    }

    function getFullWeekdayName(jsDayIdx) {
      const map = { 0: "Domingo", 1: "Lunes", 2: "Martes", 3: "Miércoles", 4: "Jueves", 5: "Viernes", 6: "Sábado" };
      return map[jsDayIdx] || "Lunes";
    }

    function getPlanDayWeekday(dayObj) {
      const lbl = String(dayObj?.dayLabel || "");
      if (lbl.includes("(Lun)")) return "Lunes";
      if (lbl.includes("(Mar)")) return "Martes";
      if (lbl.includes("(Mié)")) return "Miércoles";
      if (lbl.includes("(Jue)")) return "Jueves";
      if (lbl.includes("(Vie)")) return "Viernes";
      if (lbl.includes("(Sáb)")) return "Sábado";
      if (lbl.includes("(Dom)")) return "Domingo";
      return "Lunes";
    }

    function getCurrentWeekCalendarData(m, plan) {
      const now = new Date();
      const jsDay = now.getDay(); // 0 Sun .. 6 Sat
      const offsetToMon = jsDay === 0 ? -6 : (1 - jsDay);
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offsetToMon);
      const todayFullName = getFullWeekdayName(jsDay);
      const completedMap = state.trainingProfile?.completedPlanDays || {};

      const workoutByDay = {};
      (plan.schedule || []).forEach(item => {
        workoutByDay[getPlanDayWeekday(item)] = item;
      });

      const weekMeta = [
        { name: "Lunes", abbr: "Lun", isWeekend: false },
        { name: "Martes", abbr: "Mar", isWeekend: false },
        { name: "Miércoles", abbr: "Mié", isWeekend: false },
        { name: "Jueves", abbr: "Jue", isWeekend: false },
        { name: "Viernes", abbr: "Vie", isWeekend: false },
        { name: "Sábado", abbr: "Sáb", isWeekend: true },
        { name: "Domingo", abbr: "Dom", isWeekend: true }
      ];

      return weekMeta.map((info, i) => {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        const dayNum = d.getDate();
        const dateLabel = d.toLocaleDateString("es-ES", { day: "numeric", month: "short" });
        const recId = info.isWeekend ? (state.weekendMeals?.[info.name] || "") : state.tapers[info.name];
        const recipe = recId ? (state.recipes.find(r => r.id === recId) || null) : null;
        const workout = workoutByDay[info.name] || null;
        return {
          ...info,
          dayNum,
          dateLabel,
          isToday: info.name === todayFullName,
          recipe,
          dayExtra: state.dayExtras?.[info.name] || "",
          workout,
          workoutDone: workout ? Boolean(completedMap[workout.id]) : false
        };
      });
    }

    function buildWeeklyCalendarHtml(m, plan) {
      const weekData = getCurrentWeekCalendarData(m, plan);
      const activeDay = selectedCalendarDay || (weekData.find(d => d.isToday)?.name || "Lunes");
      const plannedMealsCount = weekData.filter(d => Boolean(d.recipe)).length;
      const workoutsTotal = weekData.filter(d => Boolean(d.workout)).length;
      const workoutsDone = weekData.filter(d => d.workout && d.workoutDone).length;

      const restDayTip = m.isIronDef
        ? "Descanso reparador + hidratación (prioridad recuperación con déficit de hierro)."
        : (m.glycemicControl
          ? "Caminata suave de 10–15 min tras las comidas + pasos diarios (control glucémico)."
          : "Pasos diarios (NEAT) y movilidad suave de 10 min.");

      const stripHtml = `
        <div class="week-strip">
          ${weekData.map(d => `
            <button class="week-day-pill ${d.isToday ? "today" : ""} ${activeDay === d.name ? "selected" : ""}" onclick="selectCalendarDay('${d.name}')">
              <span class="week-day-abbr">${d.abbr}</span>
              <span class="week-day-num">${d.dayNum}</span>
              <div class="week-dots">
                ${d.recipe ? `<span class="week-dot-meal" title="Comida"></span>` : ""}
                ${d.workout ? `<span class="week-dot-work" title="Entreno"></span>` : ""}
              </div>
            </button>
          `).join("")}
        </div>
      `;

      const cardsHtml = weekData.map(d => {
        const isSelected = activeDay === d.name;
        const mealBlockHtml = d.recipe
          ? `
            <div class="cal-slot">
              <div class="cal-slot-head">
                <span>🍲 ${d.isWeekend ? "Comida planificada" : "Táper del día"}</span>
                <div style="display:flex; gap:4px;">
                  <button class="btn-ghost btn-sm" style="padding:2px 6px; font-size:11px; color:var(--rose-dark);" onclick="openRecipeSheet('${d.recipe.id}')">Receta</button>
                  <button class="btn-ghost btn-sm" style="padding:2px 6px; font-size:11px;" onclick="openDaySelectorSheet('${d.name}')">Cambiar</button>
                </div>
              </div>
              <div style="font-size:13px; font-weight:750; color:var(--text-main);">${d.recipe.title}</div>
              <div style="font-size:11px; color:var(--text-muted);">
                ${d.recipe.kcal} kcal · ${d.recipe.protein}g prot · ${d.recipe.carbs}g carb · ⏱ ${d.recipe.timeMin} min
              </div>
              ${d.dayExtra ? `<div style="font-size:10.5px; color:var(--text-soft); margin-top:2px;">📝 ${escapeHtml(d.dayExtra)}</div>` : ""}
            </div>
          `
          : `
            <div class="cal-slot rest">
              <div class="cal-slot-head">
                <span>🍲 Fin de semana libre</span>
                <button class="btn-ghost btn-sm" style="padding:2px 6px; font-size:11px; color:var(--rose-dark);" onclick="openDaySelectorSheet('${d.name}')">+ Elegir</button>
              </div>
            </div>
          `;

        const workoutBlockHtml = d.workout
          ? `
            <div class="cal-slot workout">
              <div class="cal-slot-head">
                <span>🏋️ ${d.workout.badge} · ${d.workout.mins} min</span>
                <div style="display:flex; gap:4px; align-items:center;">
                  <button class="btn-ghost btn-sm" style="padding:2px 6px; font-size:11px; color:var(--mint-text); font-weight:800;" onclick="togglePlanDayDone('${d.workout.id}')">${d.workoutDone ? "✓ Hecho" : "○ Marcar"}</button>
                  <button class="btn-ghost btn-sm" style="padding:2px 6px; font-size:11px;" onclick="switchTab('entreno')">Ver rutina</button>
                </div>
              </div>
              <div style="font-size:13px; font-weight:750; color:var(--text-main);">${d.workout.title}</div>
              <div style="font-size:11px; color:var(--text-muted);">
                ${plan.rpeLabel} · Descanso ${plan.restMain} · ${plan.location === "home" ? "Casa" : "Gym"}
              </div>
            </div>
          `
          : `
            <div class="cal-slot rest">
              <div class="cal-slot-head">
                <span>🌿 Descanso activo</span>
                <span style="font-size:10.5px; font-weight:650; color:var(--text-soft);">Meta: ${Number(state.stepsGoal).toLocaleString("es-ES")} pasos</span>
              </div>
              <div style="font-size:11.5px; color:var(--text-muted);">${restDayTip}</div>
            </div>
          `;

        return `
          <div class="cal-day-card ${d.isToday ? "today" : ""} ${isSelected && !d.isToday ? "highlight" : ""}" id="cal_day_${d.name}">
            <div class="row-between">
              <div style="display:flex; align-items:center; gap:6px;">
                <strong style="font-size:14px; color:var(--text-main);">${d.name}</strong>
                <span style="font-size:11.5px; color:var(--text-soft);">${d.dateLabel}</span>
                ${d.isToday ? `<span class="badge">HOY</span>` : ""}
              </div>
              <div style="display:flex; gap:5px;">
                ${d.workout ? `<span class="badge badge-mint">${d.workoutDone ? "✓ Entreno" : d.workout.badge}</span>` : `<span class="badge" style="background:var(--bg-soft); color:var(--text-soft);">Descanso</span>`}
              </div>
            </div>
            ${mealBlockHtml}
            ${workoutBlockHtml}
          </div>
        `;
      }).join("");

      return `
        <div class="card">
          <div class="row-between" style="margin-bottom:8px;">
            <div class="card-title" style="margin:0;">Calendario Semanal</div>
            <span style="font-size:11.5px; color:var(--text-muted);"><strong>${plannedMealsCount}/7</strong> comidas · <strong>${workoutsDone}/${workoutsTotal}</strong> entrenos</span>
          </div>
          ${stripHtml}
          <div style="display:flex; align-items:center; gap:12px; font-size:10.5px; color:var(--text-soft); margin-top:7px;">
            <span style="display:inline-flex; align-items:center; gap:4px;"><span class="week-dot-meal"></span> Comida</span>
            <span style="display:inline-flex; align-items:center; gap:4px;"><span class="week-dot-work"></span> Entreno</span>
          </div>
        </div>
        ${cardsHtml}
      `;
    }

    function renderHoy(container) {
      const m = getAdaptiveNutritionMetrics();
      const plan = getAdaptiveTrainingPlan(m);

      const topSwitcherHtml = `
        <div class="seg-control">
          <button class="seg-btn ${hoySubTab === "hoy" ? "active" : ""}" onclick="setHoySubTab('hoy')">⚡ Hoy</button>
          <button class="seg-btn ${hoySubTab === "semana" ? "active" : ""}" onclick="setHoySubTab('semana')">📅 Semana (L–D)</button>
        </div>
      `;

      if (hoySubTab === "semana") {
        container.innerHTML = `
          <div class="section-gap">
            ${topSwitcherHtml}
            ${buildWeeklyCalendarHtml(m, plan)}
          </div>
        `;
        return;
      }

      const quickList = state.recipes.filter(r => {
        if (!r.quickToday) return false;
        if (onlyPantryToday) {
          return (r.ingredients || []).some(i => state.pantryKeys.includes(i.key));
        }
        return true;
      }).sort((a, b) => getRecipeProfileMeta(b, m).score - getRecipeProfileMeta(a, m).score);

      const medsDone = state.meds.filter(med => isMedTakenToday(med)).length;
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayStepsObj = state.stepsLogs.find(s => s.date === todayStr) || state.stepsLogs[state.stepsLogs.length - 1] || { steps: 0 };
      const g = getBodyGoalMetrics();
      const completedMap = state.trainingProfile?.completedPlanDays || {};
      const nextWorkout = plan.schedule.find(d => !completedMap[d.id]) || plan.schedule[0];
      const workoutsDoneCount = plan.schedule.filter(d => Boolean(completedMap[d.id])).length;

      const todayDayName = getTodayWeekdayName();
      const activeDayKey = todayDayName || "Lunes";
      const todayRecipe = state.recipes.find(x => x.id === state.tapers[activeDayKey]) || state.recipes[0];
      const totalHomeCount = state.pantryKeys.length + state.customPantry.length;
      const activeCondLabels = (state.clinicalProfile.conditions || [])
        .map(c => CLINICAL_CONDITION_META[c]?.short)
        .filter(Boolean);
      const healthBannerTitle = activeCondLabels.length
        ? `Salud (${activeCondLabels.join(" · ")}) & Pasos hoy`
        : "Salud, Protocolo & Pasos hoy";

      const cyclePhase = getActiveCyclePhase(m);
      const cycleHoyBannerHtml = cyclePhase ? `
        <div class="cycle-banner" onclick="switchTab('progreso', 'diario')" style="cursor:pointer;">
          <span>${cyclePhase.hoyShort}</span>
          <span style="color:var(--rose-dark); font-weight:800; flex-shrink:0;">Ajustar</span>
        </div>
      ` : "";

      const todayDiaryTot = getDailyDiaryTotals(todayStr);
      const todayDiaryDay = getDayDiary(todayStr);
      const kcalTargetHoy = Number(state.targets.kcal || m.targetKcal || 1640);
      const protTargetHoy = Number(state.targets.protein || m.targetProtein || 130);
      const carbTargetHoy = Number(state.targets.carbsMax || m.targetCarbs || 135);
      const fatTargetHoy = Math.max(35, Number(m.targetFat || 55));
      const kcalPctHoy = Math.min(100, Math.round((todayDiaryTot.kcal / Math.max(1, kcalTargetHoy)) * 100));
      const kcalRemHoy = kcalTargetHoy - todayDiaryTot.kcal;
      const kcalRemTxt = kcalRemHoy >= 0 ? `Faltan ${kcalRemHoy} kcal` : `+${Math.abs(kcalRemHoy)} kcal`;
      const carbPref = (m.isDiabetes || m.isIR || m.isPCOS) ? "≤" : "";

      const renderHoyMealRow = (slotId, icon, label) => {
        const items = todayDiaryDay[slotId] || [];
        const st = getSlotTotals(items);
        if (items.length) {
          const firstTitle = items[0].title + (items.length > 1 ? ` +${items.length - 1}` : "");
          return `
            <div class="hoy-meal-row">
              <div style="min-width:0; flex:1;">
                <div style="font-size:12px; font-weight:800; color:var(--text-main);">${icon} ${label} <span style="font-weight:700; color:var(--mint-text);">· ${st.kcal} kcal</span></div>
                <div style="font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(firstTitle)}</div>
              </div>
              <button class="btn-ghost btn-sm" style="color:var(--rose-dark); font-weight:800; flex-shrink:0;" onclick="openAddFoodSheet('${slotId}','${todayStr}')">+</button>
            </div>
          `;
        }
        if (slotId === "almuerzo" && todayRecipe) {
          return `
            <div class="hoy-meal-row">
              <div style="min-width:0; flex:1;">
                <div style="font-size:12px; font-weight:800; color:var(--text-main);">${icon} ${label} <span style="font-weight:650; color:var(--text-soft);">· Táper ${todayRecipe.kcal} kcal</span></div>
                <div style="font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(todayRecipe.title)}</div>
              </div>
              <div style="display:flex; gap:4px; flex-shrink:0;">
                <button class="btn-secondary btn-sm" style="padding:5px 8px;" onclick="openRecipeSheet('${todayRecipe.id}')">Ver</button>
                <button class="btn-primary btn-sm" style="padding:5px 9px;" onclick="logPlannedLunchToDiary('${todayStr}')" title="Marcar almuerzo como comido">✓</button>
              </div>
            </div>
          `;
        }
        return `
          <div class="hoy-meal-row">
            <div style="min-width:0; flex:1;">
              <div style="font-size:12px; font-weight:800; color:var(--text-main);">${icon} ${label}</div>
              <div style="font-size:11px; color:var(--text-soft);">${slotId === "snacks" ? "Opcional" : "Pendiente"}</div>
            </div>
            <button class="btn-secondary btn-sm" style="flex-shrink:0;" onclick="openAddFoodSheet('${slotId}','${todayStr}')">+ Añadir</button>
          </div>
        `;
      };

      container.innerHTML = `
        <div class="section-gap">
          ${topSwitcherHtml}
          ${buildHoyDueMedsBannerHtml()}

          <div class="hero-today-card">
            <div class="row-between" style="margin-bottom:6px;">
              <div>
                <div style="font-size:11px; font-weight:800; color:var(--rose-dark); text-transform:uppercase; letter-spacing:0.03em;">Tu día · ${todayDayName || "Hoy"}</div>
                <div style="font-size:18px; font-weight:850; color:var(--text-main); line-height:1.2;">
                  ${todayDiaryTot.kcal} <span style="font-size:12.5px; font-weight:650; color:var(--text-soft);">/ ${kcalTargetHoy} kcal</span>
                </div>
              </div>
              <span class="badge ${kcalRemHoy >= 0 ? "badge-mint" : "badge-amber"}">${kcalRemTxt}</span>
            </div>

            <div class="progress-track" style="margin-bottom:6px;">
              <div class="progress-fill" style="width:${kcalPctHoy}%; background:${kcalRemHoy < -120 ? "#D6913A" : "linear-gradient(90deg, var(--rose), var(--rose-dark))"};"></div>
            </div>

            <div class="row-between" style="font-size:11px; color:var(--text-muted); margin-bottom:10px;">
              <span>P <strong>${todayDiaryTot.protein}</strong>/${protTargetHoy}g · C <strong>${todayDiaryTot.carbs}</strong>/${carbPref}${carbTargetHoy}g · G <strong>${todayDiaryTot.fat}</strong>/${fatTargetHoy}g</span>
              <button class="btn-ghost btn-sm" style="padding:2px 4px; color:var(--rose-dark);" onclick="switchTab('comida', 'diario')">Diario →</button>
            </div>

            <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;">
              ${renderHoyMealRow("desayuno", "🌅", "Desayuno")}
              ${renderHoyMealRow("almuerzo", "☀️", "Almuerzo")}
              ${renderHoyMealRow("cena", "🌙", "Cena")}
              ${renderHoyMealRow("snacks", "🍎", "Snacks")}
            </div>

            <div class="grid-2">
              <button class="btn-secondary btn-sm" onclick="openEatingOutSheet()">🍽️ Hoy como fuera</button>
              <button class="btn-secondary btn-sm" onclick="switchTab('comida', 'recetario')">🍲 Ver recetario</button>
            </div>
          </div>

          ${cycleHoyBannerHtml}

          <div class="card">
            <div class="row-between">
              <div style="min-width:0;">
                <div style="font-size:12.5px; font-weight:800; color:var(--text-main);">🏋️ Entreno · ${workoutsDoneCount}/${plan.schedule.length} sem</div>
                <div class="card-sub" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${nextWorkout.title} · ${nextWorkout.mins} min</div>
              </div>
              <button class="btn-secondary btn-sm" style="white-space:nowrap;" onclick="switchTab('entreno')">Ver</button>
            </div>
          </div>

          <div class="card">
            <div class="row-between" style="gap:8px;">
              <div style="min-width:0;">
                <div style="font-size:12.5px; font-weight:800;">💗 ${healthBannerTitle}</div>
                <div class="card-sub">Tomas <strong>${medsDone}/${state.meds.length}</strong> · Pasos <strong>${Number(todayStepsObj.steps || 0).toLocaleString("es-ES")}</strong>/${Number(state.stepsGoal).toLocaleString("es-ES")}</div>
              </div>
              <div style="display:flex; gap:5px; flex-shrink:0;">
                ${(m.takesMetformin || (state.metforminTracker?.logs?.length > 0)) ? `<button class="btn-secondary btn-sm" onclick="openMetforminLogSheet()" title="Registrar tolerancia metformina hoy">💊 GI</button>` : ""}
                <button class="btn-secondary btn-sm" onclick="switchTab('progreso', 'diario')">Abrir</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="row-between" style="margin-bottom:7px;">
              <div style="font-size:12.5px; font-weight:800; color:var(--rose-dark);">🎯 Meta: ${g.currentKg.toFixed(1)} → ${g.milestoneKg} kg <span style="font-weight:600; color:var(--text-muted);">(${g.weeksTo64 > 0 ? `~${g.weeksTo64} sem` : (state.bodyProfile.goal === "maintenance" ? "Mant." : "Logrado")})</span></div>
              <span style="font-size:11.5px; font-weight:750; color:var(--text-soft);">${g.annualPct}%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${g.annualPct}%;"></div></div>
          </div>
        </div>
      `;
    }

    function scrollToQuickToday() {
      const el = document.getElementById("hoyQuickSection");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function openEatingOutSheet() {
      const m = getAdaptiveNutritionMetrics();
      const cycle = getActiveCyclePhase(m);
      const steps = [];

      if (m.isIR || m.isPCOS || m.isDiabetes) {
        steps.push("<strong>Orden del plato:</strong> empieza por ensalada o verdura → sigue con proteína y grasa saludable → deja arroz, pan, pasta o postre para el final (amortigua el pico de glucosa).");
      }

      if (m.goal === "hypertrophy") {
        steps.push("<strong>No te quedes corto:</strong> pide proteína principal generosa (carne, pollo, pescado o doble porción) + carbohidrato de calidad (arroz, papa o pasta) para sostener tu meta de " + m.targetKcal + " kcal.");
      } else if (m.goal === "deficit") {
        steps.push("<strong>Truco de restaurante:</strong> elige plancha, horno o parrilla, pide salsas/aderezos aparte y acompaña con verdura; come despacio hasta ~80% de saciedad.");
      } else {
        steps.push("<strong>Plato equilibrado:</strong> busca mitad verdura, un cuarto proteína y un cuarto carbohidrato complejo; disfruta con flexibilidad.");
      }

      if (m.isIronDef) {
        steps.push("<strong>Cuidado del hierro:</strong> prioriza carne magra, pescado o legumbres con limón/tomate y deja el café, té o postres lácteos para 1–2 h después.");
      }

      if (m.isIR || m.isPCOS || m.isDiabetes) {
        steps.push("<strong>Cierre metabólico:</strong> camina 10–15 min suaves después de comer (vuelve caminando o da una vuelta corta); mejora la captación muscular de glucosa.");
      } else {
        steps.push("<strong>Hidratación inteligente:</strong> elige agua con gas, limón o infusión en lugar de bebidas azucaradas para mantener saciedad.");
      }

      if (cycle && (cycle.id === "menstrual" || cycle.id === "luteal")) {
        steps.push(`<strong>${cycle.label}:</strong> ${cycle.nutritionCue}`);
      }

      const activeLabels = [m.goalMeta.shortLabel];
      (state.clinicalProfile.conditions || []).forEach(c => {
        if (CLINICAL_CONDITION_META[c]?.short) activeLabels.push(CLINICAL_CONDITION_META[c].short);
      });

      openSheet("🍽️ Hoy como fuera", `
        <div class="section-gap">

    function getRecipeProfileMeta(r, m = null) {
      const metrics = m || getAdaptiveNutritionMetrics();
      const goals = Array.isArray(r.goals) && r.goals.length
        ? r.goals
        : (r.kcal >= 680 ? ["hypertrophy"] : (r.kcal >= 480 ? ["maintenance"] : ["deficit"]));
      const hasDairy = (r.ingredients || []).some(i => ["queso_fresco", "yogur_griego"].includes(i.key));
      const hasIronSrc = (r.ingredients || []).some(i => ["carne_magra", "lentejas", "espinaca"].includes(i.key));
      const hasVitC = (r.ingredients || []).some(i => ["limon", "tomate", "brocoli"].includes(i.key));

      const inferredConds = [];
      if (r.carbs <= 28 && r.protein >= 30) inferredConds.push("insulin_resistance", "pcos");
      if (r.carbs >= 10 && r.carbs <= 44 && r.protein >= 30) inferredConds.push("diabetes");
      if (hasIronSrc && hasVitC && !hasDairy) inferredConds.push("iron_deficiency");

      const conditions = Array.isArray(r.conditions) && r.conditions.length ? r.conditions : inferredConds;

      let score = 0;
      if (goals.includes(metrics.goal)) score += 30;
      else if (metrics.goal === "hypertrophy" && goals.includes("maintenance")) score += 10;
      else if (metrics.goal === "maintenance" && r.kcal >= 440 && r.kcal <= 660) score += 12;

      const activeConds = state.clinicalProfile?.conditions || [];
      activeConds.forEach(c => {
        if (conditions.includes(c)) score += 20;
      });

      // Calorie fit against user's target lunch (~35% of daily target)
      const idealLunchKcal = Math.round(metrics.targetKcal * 0.35);
      const kcalDiff = Math.abs(r.kcal - idealLunchKcal);
      score += Math.max(0, 15 - Math.round(kcalDiff / 45));

      // Suggested portion scaling for taller/higher-kcal users viewing lighter recipes
      let suggestedScale = 1;
      if (idealLunchKcal >= 760 && r.kcal <= 460) suggestedScale = 2;
      else if (idealLunchKcal >= 650 && r.kcal <= 520) suggestedScale = 1.5;

      let focusBadge = "";
      if (goals.includes("hypertrophy")) focusBadge = "💪 Volumen";
      else if (conditions.includes("iron_deficiency") && !hasDairy) focusBadge = "🩸 Hierro+C";
      else if (conditions.includes("diabetes") && r.carbs >= 25 && r.carbs <= 44) focusBadge = "🩺 Diabetes";
      else if (goals.includes("maintenance") && !goals.includes("deficit")) focusBadge = "⚖️ Balance";

      return { goals, conditions, score, suggestedScale, focusBadge };
    }

    function getRecipeMealType(r) {
      if (r && ["desayuno", "almuerzo", "cena"].includes(r.mealType)) return r.mealType;
      return "almuerzo";
    }

    function getRecipeCyclePhases(r) {
      if (Array.isArray(r?.cyclePhases) && r.cyclePhases.length) return r.cyclePhases;
      const keys = (r?.ingredients || []).map(i => i.key);
      const phases = [];
      if (keys.some(k => ["carne_magra", "lentejas", "espinaca", "salmon", "atun_lata"].includes(k))) {
        phases.push("menstrual");
      }
      if (keys.some(k => ["salmon", "palta", "espinaca", "huevos", "yogur_griego"].includes(k)) || Number(r?.fat || 0) >= 18) {
        phases.push("luteal");
      }
      if (Number(r?.carbs || 0) >= 25 || keys.some(k => ["pechuga_pollo", "arroz_integral", "fideos_integrales", "papa"].includes(k))) {
        phases.push("follicular");
      }
      if (Number(r?.protein || 0) >= 34) {
        phases.push("ovulatory");
      }
      return phases.length ? [...new Set(phases)] : ["follicular", "ovulatory"];
    }

    function getFilteredRecipes() {
      const m = getAdaptiveNutritionMetrics();
      const cyclePhase = getActiveCyclePhase(m);
      const q = recipeSearch.trim().toLowerCase();
      return state.recipes.filter(r => {
        const meta = getRecipeProfileMeta(r, m);
        const mt = getRecipeMealType(r);
        if (recipeMealTypeFilter !== "all" && mt !== recipeMealTypeFilter) return false;
        if (recipeFilter !== "Todas") {
          if (recipeFilter === "TikTok Fit") {
            if (!r.tiktokUrl) return false;
          } else if (r.category !== recipeFilter) {
            return false;
          }
        }
        if (recipeQuickFilter === "cycle" && cyclePhase) {
          if (!getRecipeCyclePhases(r).includes(cyclePhase.id)) return false;
        }
        if (recipeQuickFilter === "profile") {
          const activeConds = state.clinicalProfile?.conditions || [];
          const matchesGoal = meta.goals.includes(m.goal);
          const matchesCond = activeConds.length ? activeConds.some(c => meta.conditions.includes(c)) : true;
          if (m.goal === "hypertrophy") {
            if (!matchesGoal) return false;
          } else if (!matchesGoal && !matchesCond) {
            return false;
          }
        }
        if (recipeQuickFilter === "hypertrophy" && !meta.goals.includes("hypertrophy")) return false;
        if (recipeQuickFilter === "maintenance" && !meta.goals.includes("maintenance")) return false;
        if (recipeQuickFilter === "deficit_ir" && !(meta.goals.includes("deficit") || meta.conditions.includes("insulin_resistance") || meta.conditions.includes("pcos"))) return false;
        if (recipeQuickFilter === "iron" && !meta.conditions.includes("iron_deficiency")) return false;
        if (recipeQuickFilter === "diabetes" && !meta.conditions.includes("diabetes")) return false;
        if (recipeQuickFilter === "fast15" && r.timeMin > 15) return false;
        if (recipeQuickFilter === "fav" && !isFavoriteRecipe(r.id)) return false;
        if (recipeQuickFilter === "pantry") {
          const pm = getRecipePantryMatch(r);
          if (pm.haveCount === 0) return false;
        }
        if (q) {
          const hay = [
            r.title,
            r.category,
            mt,
            ...(r.ingredients || []).map(i => i.label)
          ].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a, b) => {
        if (recipeQuickFilter === "pantry") {
          return getRecipePantryMatch(b).haveCount - getRecipePantryMatch(a).haveCount;
        }
        const cycleBoostA = (cyclePhase && getRecipeCyclePhases(a).includes(cyclePhase.id)) ? 12 : 0;
        const cycleBoostB = (cyclePhase && getRecipeCyclePhases(b).includes(cyclePhase.id)) ? 12 : 0;
        return (getRecipeProfileMeta(b, m).score + cycleBoostB) - (getRecipeProfileMeta(a, m).score + cycleBoostA);
      });
    }

    function getTodayDateKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function shiftDateKey(dateStr, deltaDays) {
      const d = new Date(dateStr + "T12:00:00");
      d.setDate(d.getDate() + deltaDays);
      return d.toISOString().slice(0, 10);
    }

    function formatDiaryDateLabel(dateStr) {
      const today = getTodayDateKey();
      const yest = shiftDateKey(today, -1);
      const tom = shiftDateKey(today, 1);
      const d = new Date(dateStr + "T12:00:00");
      const nice = d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
      if (dateStr === today) return `Hoy · ${nice}`;
      if (dateStr === yest) return `Ayer · ${nice}`;
      if (dateStr === tom) return `Mañana · ${nice}`;
      return nice;
    }

    function getDayDiary(dateKey) {
      const key = dateKey || getTodayDateKey();
      const raw = (state.foodDiary && state.foodDiary[key]) || {};
      return {
        desayuno: Array.isArray(raw.desayuno) ? raw.desayuno : [],
        almuerzo: Array.isArray(raw.almuerzo) ? raw.almuerzo : [],
        cena: Array.isArray(raw.cena) ? raw.cena : [],
        snacks: Array.isArray(raw.snacks) ? raw.snacks : []
      };
    }

    function getSlotTotals(entries) {
      return (entries || []).reduce((acc, item) => ({
        kcal: acc.kcal + Math.round(Number(item.kcal || 0)),
        protein: acc.protein + Math.round(Number(item.protein || 0)),
        carbs: acc.carbs + Math.round(Number(item.carbs || 0)),
        fat: acc.fat + Math.round(Number(item.fat || 0))
      }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });
    }

    function getDailyDiaryTotals(dateKey) {
      const day = getDayDiary(dateKey);
      const all = [...day.desayuno, ...day.almuerzo, ...day.cena, ...day.snacks];
      return { ...getSlotTotals(all), count: all.length };
    }

    function getPlannedLunchForDate(dateKey) {
      const d = new Date((dateKey || getTodayDateKey()) + "T12:00:00");
      const name = getFullWeekdayName(d.getDay());
      const recipeId = state.tapers[name] || (state.weekendMeals && state.weekendMeals[name]) || state.tapers.Lunes;
