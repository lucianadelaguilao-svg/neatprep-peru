      if (!state.trainingProfile.completedPlanDays) state.trainingProfile.completedPlanDays = {};
      state.trainingProfile.completedPlanDays[dayId] = !state.trainingProfile.completedPlanDays[dayId];
      saveState();
      render();
    }

    function logPlannedWorkoutToday(dayId) {
      const m = getAdaptiveNutritionMetrics();
      const plan = getAdaptiveTrainingPlan(m);
      const day = plan.schedule.find(d => d.id === dayId);
      if (!day) return;
      const today = new Date().toISOString().slice(0, 10);
      if (!state.trainingProfile.completedPlanDays) state.trainingProfile.completedPlanDays = {};
      state.trainingProfile.completedPlanDays[dayId] = true;
      state.workouts.push({
        id: "wo_" + Date.now(),
        date: today,
        type: `${day.type} · ${day.badge}`,
        minutes: day.mins,
        intensity: plan.intensityText
      });
      saveState();
      render();
      showToast(`Sesión registrada (${day.mins} min) · carbos de hoy ajustados`);

    function renderWeightChartSvg(logs) {
      if (!logs || logs.length < 2) {
        return `<div style="font-size:12px; color:var(--text-soft); padding:8px; background:var(--bg-soft); border-radius:10px;">Registra tu siguiente pesaje para ver la curva hacia 64 kg y 60 kg.</div>`;
      }
      const recent = logs.slice(-8);
      const weights = recent.map(x => Number(x.weight));
      const minW = Math.min(...weights) - 0.5;
      const maxW = Math.max(...weights) + 0.5;
      const span = Math.max(0.5, maxW - minW);
      const W = 340, H = 96, padX = 18, padY = 16;

      const pts = recent.map((item, idx) => {
        const x = padX + (idx / (recent.length - 1)) * (W - padX * 2);
        const y = H - padY - ((Number(item.weight) - minW) / span) * (H - padY * 2);
        return { x, y, w: Number(item.weight).toFixed(1) };
      });

      const polyline = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      const circles = pts.map(p => `
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#B5436A" />
        <text x="${p.x.toFixed(1)}" y="${(p.y - 7).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6E525D">${p.w}</text>
      `).join("");

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:96px; background:var(--bg-soft); border-radius:12px; border:1px solid var(--border);">
          <polyline fill="none" stroke="#D45B84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polyline}" />
          ${circles}
        </svg>
      `;
    }

    function updateBodyProfile() {
      const hEl = document.getElementById("bpHeight");

      const defEl = document.getElementById("bpDeficit");

      if (hEl) state.bodyProfile.heightCm = Math.max(120, Math.min(220, parseNumInput(hEl.value, 158)));

      if (defEl) state.bodyProfile.deficit = parseNumInput(defEl.value, 550);
      if (surEl) state.bodyProfile.surplus = parseNumInput(surEl.value, 250);

      if (wEl) {
        const parsedW = parseNumInput(wEl.value, NaN);
        const currentW = getCurrentWeightKg();
        if (Number.isFinite(parsedW) && parsedW >= 30 && parsedW <= 250 && Math.abs(parsedW - currentW) >= 0.05) {
          const today = new Date().toISOString().slice(0, 10);
          const todayIdx = state.weightLogs.findIndex(x => x.date === today);

          } else {
            state.weightLogs.push({ id: "w_" + Date.now(), date: today, weight: Number(parsedW.toFixed(1)) });
          }
        }
      }

      saveState();
      render();
    }

    function exportBackupJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement("a");
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `mealprep-respaldo-${new Date().toISOString().slice(0, 10)}.json`);

    function applyImportBackup() {
      try {
        const raw = document.getElementById("importJsonArea").value.trim();
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") throw new Error();
        state = normalizeState(parsed);
        saveState();
        closeSheet();
        render();
        showToast("Respaldo restaurado con éxito");
      } catch (e) {
        showToast("JSON inválido, revisa el texto pegado");
      }
    }

    function downloadRemindersIcs() {
      const m = getAdaptiveNutritionMetrics();
      const plan = getAdaptiveTrainingPlan(m);
      const rems = state.reminders || {};
      const pad2 = n => String(n).padStart(2, "0");

      const now = new Date();
      const y = now.getFullYear();
      const mo = pad2(now.getMonth() + 1);
      const da = pad2(now.getDate());
      const dtStamp = `${y}${mo}${da}T${pad2(now.getHours())}${pad2(now.getMinutes())}00`;

      const weekdayToIcs = {
        Lunes: "MO",
        Martes: "TU",
        Miércoles: "WE",
        Jueves: "TH",
        Viernes: "FR",
        Sábado: "SA",
        Domingo: "SU"
      };
      const workoutByDays = (plan.schedule || [])
        .map(d => weekdayToIcs[getPlanDayWeekday(d)])
        .filter(Boolean);
      const uniqueWorkoutDays = Array.from(new Set(workoutByDays));

      const makeEvent = (uid, summary, desc, timeStr, durationMin, rrule) => {
        const parts = String(timeStr || "09:00").split(":");
        const hh = pad2(parseInt(parts[0], 10) || 9);
        const mm = pad2(parseInt(parts[1], 10) || 0);
        const startMinTotal = (parseInt(hh, 10) * 60) + parseInt(mm, 10) + durationMin;
        const endHh = pad2(Math.floor(startMinTotal / 60) % 24);
        const endMm = pad2(startMinTotal % 60);
        return [
          "BEGIN:VEVENT",
          `UID:${uid}@mealprep-nutritrack`,
          `DTSTAMP:${dtStamp}`,
          `DTSTART:${y}${mo}${da}T${hh}${mm}00`,
          `DTEND:${y}${mo}${da}T${endHh}${endMm}00`,
          `RRULE:${rrule}`,
          `SUMMARY:${summary}`,
          `DESCRIPTION:${desc}`,
          "BEGIN:VALARM",
          "TRIGGER:-PT0M",
          "ACTION:DISPLAY",
          `DESCRIPTION:${summary}`,
          "END:VALARM",
          "END:VEVENT"
        ].join("\r\n");
      };

      const events = [];
      if (rems.morningMeds?.enabled) {
        events.push(makeEvent(
          "mp-morning-meds",
          "💊 MealPrep: Toma mañana y desayuno proteico",
          "Revisa tu protocolo de mañana y empieza con proteína + fibra.",
          rems.morningMeds.time, 15, "FREQ=DAILY"
        ));
      }
      if (rems.postMealWalk?.enabled) {
        events.push(makeEvent(
          "mp-postmeal-walk",
          "🚶 MealPrep: Caminata 15 min post-almuerzo",
          "Caminata suave de 10–15 min tras comer para estabilidad glucémica.",
          rems.postMealWalk.time, 15, "FREQ=DAILY"
        ));
      }
      if (rems.workout?.enabled && uniqueWorkoutDays.length) {
        events.push(makeEvent(
          "mp-workout",
          `🏋️ MealPrep: ${plan.planTitle}`,
          `Plan activo: ${plan.planTitle} (${plan.rpeLabel} · descansos ${plan.restMain}). Abre Entreno para ver tu rutina del día.`,
          rems.workout.time, 45, `FREQ=WEEKLY;BYDAY=${uniqueWorkoutDays.join(",")}`
        ));
      }
      if (rems.eveningMeds?.enabled) {
        events.push(makeEvent(
          "mp-evening-meds",
          "💊 MealPrep: Toma noche y cierre del día",
          "Completa tu protocolo nocturno (ej. Magnesio) y revisa tus pasos.",
          rems.eveningMeds.time, 10, "FREQ=DAILY"
        ));
      }
      if (rems.batchPrep?.enabled) {
        events.push(makeEvent(
          "mp-batch-prep",
          "🥡 MealPrep: Batch Cooking semanal (5 tápers L–V)",
          "Revisa tu lista en Súper y cocina tus tápers de la semana.",
          rems.batchPrep.time, 60, "FREQ=WEEKLY;BYDAY=SU"
        ));
      }
      if (rems.dailySync?.enabled) {
        events.push(makeEvent(
          "mp-daily-sync",
          "🔄 MealPrep: Sincronizar Apple Salud / Xiaomi",
          "Ejecuta tu Atajo Sync MealPrep para guardar pasos, peso y entreno de hoy.",
          rems.dailySync.time, 5, "FREQ=DAILY"
        ));
      }

      if (!events.length) {
        showToast("Activa al menos un recordatorio primero");
        return;
      }

      const ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//MealPrep & NutriTrack//Recordatorios iPhone//ES",
        "CALSCALE:GREGORIAN",
        "X-WR-CALNAME:MealPrep & NutriTrack",
        ...events,
        "END:VCALENDAR"
      ].join("\r\n");

      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "mealprep-recordatorios-iphone.ics";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(`📅 ${events.length} recordatorios descargados (.ics) — ábrelo en tu iPhone`);
    }

    function openIphoneAutomationGuideSheet() {
      const base = getEffectiveAppBaseUrl().replace(/\?.*$/, "");
      openSheet("📱 Automatización iPhone (0 €)", `
        <div class="card-soft">
          <strong style="font-size:13px; color:var(--rose-dark);">Todo automático y 100% gratis en iPhone</strong>
          <p class="card-sub" style="margin-top:4px;">Conecta <strong>Mi Fitness (Xiaomi) → Apple Salud → Atajos de iPhone</strong> para sincronizar pasos, peso y entrenos cada día sin pagar Apple Developer.</p>
        </div>

        <div class="card">
          <div style="font-size:12.5px; font-weight:800; color:var(--rose-dark); margin-bottom:6px;">Paso 1 · Enlazar Xiaomi (Mi Fitness) con Apple Salud</div>
          <div style="font-size:12px; color:var(--text-muted); line-height:1.45;">
            Abre <strong>Mi Fitness</strong> → <strong>Perfil</strong> → <strong>Datos de terceros / Apps conectadas</strong> → activa <strong>Apple Salud</strong>. Desde ese momento tu pulsera/reloj Xiaomi envía pasos, peso y sesiones a Apple Salud automáticamente.
          </div>
        </div>

        <div class="card">
          <div style="font-size:12.5px; font-weight:800; color:var(--rose-dark); margin-bottom:6px;">Paso 2 · Crear el Atajo "Sync MealPrep" (1 vez)</div>
          <ol style="margin:0; padding-left:18px; font-size:12px; color:var(--text-main); line-height:1.5;">
            <li>Abre la app <strong>Atajos (Shortcuts)</strong> en tu iPhone y toca <strong>+</strong>.</li>
            <li>Añade <strong>Buscar muestras de Salud</strong> → Tipo: <em>Pasos</em>, Fecha inicio: <em>es hoy</em> → añade <strong>Calcular estadísticas</strong> (<em>Suma</em>).</li>
            <li>Añade <strong>Buscar muestras de Salud</strong> → Tipo: <em>Peso</em>, ordenar por <em>Fecha (recientes primero)</em>, límite <em>1</em>.</li>
            <li>Añade <strong>Abrir URL</strong> y pega tu enlace con esas dos variables:</li>
          </ol>
          <div class="code-url-box" style="margin-top:7px;">${escapeHtml(base)}?autosync=1&amp;steps=[Suma]&amp;weight=[Muestras de Salud]</div>
        </div>

        <div class="card">
          <div style="font-size:12.5px; font-weight:800; color:var(--mint-text); margin-bottom:6px;">Paso 3 · Hacerlo automático todos los días</div>
          <div style="font-size:12px; color:var(--text-main); line-height:1.45;">
            En <strong>Atajos → Automatización → + → Momento del día</strong> (ej. <strong>21:30 todos los días</strong>) elige <strong>Ejecutar inmediatamente</strong> y selecciona <em>Sync MealPrep</em>.<br>
            <small style="color:var(--text-muted);">Truco pro: crea otra automatización «Al cerrar app: Mi Fitness» para que se sincronice cada vez que revises tu reloj Xiaomi.</small>
          </div>
        </div>

        <div class="card">
          <label>URL donde tienes abierta la app (GitHub Pages)</label>
          <input type="url" value="${escapeAttr(state.syncConfig?.appBaseUrl || base)}" onchange="updateSyncBaseUrl(this.value)" placeholder="https://usuario.github.io/neatprep-peru/" />
          <div class="grid-2" style="margin-top:8px;">
            <button class="btn-secondary btn-sm" onclick="copyShortcutSyncUrl()">📋 Copiar URL base</button>
            <button class="btn-primary btn-sm" onclick="simulateAutoSyncDemo()">⚡ Probar sync ahora</button>
          </div>
        </div>

        <div class="card">
          <div style="font-size:12.5px; font-weight:800; color:var(--text-main); margin-bottom:4px;">Importar historial CSV / JSON (Salud o Mi Fitness)</div>
          <p class="card-sub" style="margin-bottom:7px;">Pega líneas CSV (<code>fecha,pasos,peso</code> ej. <code>2026-11-23,9450,68.6</code>) o JSON exportado de Health Auto Export.</p>
          <textarea id="healthImportArea" rows="3" placeholder="2026-11-23,9450,68.6"></textarea>
          <button class="btn-secondary" style="width:100%; margin-top:7px;" onclick="importHealthHistoryData()">Importar pasos y peso</button>
        </div>
      `);
    }

    function applySyncedHealthPayload({ steps, weight, workoutMin, workoutType, sourceLabel = "Apple Salud / Xiaomi" }) {
      const today = new Date().toISOString().slice(0, 10);
      const parts = [];

      if (Number.isFinite(steps) && steps > 0) {
        const roundedSteps = Math.round(steps);
        const idx = state.stepsLogs.findIndex(s => s.date === today);
        if (idx >= 0) state.stepsLogs[idx].steps = roundedSteps;
        else state.stepsLogs.push({ date: today, steps: roundedSteps });
        parts.push(`${roundedSteps.toLocaleString("es-ES")} pasos`);
      }

      if (Number.isFinite(weight) && weight >= 30 && weight <= 250) {
        const cleanW = Number(weight.toFixed(1));
        const idx = state.weightLogs.findIndex(w => w.date === today);
        if (idx >= 0) state.weightLogs[idx].weight = cleanW;
        else state.weightLogs.push({ id: "w_sync_" + Date.now(), date: today, weight: cleanW });
        parts.push(`${cleanW.toFixed(1)} kg`);
      }

      if (Number.isFinite(workoutMin) && workoutMin >= 5 && workoutMin <= 360) {
        const cleanMin = Math.round(workoutMin);
        const typeStr = (workoutType && String(workoutType).trim()) || "Apple Salud / Xiaomi";
        const alreadyLogged = state.workouts.some(w => w.date === today && w.minutes === cleanMin && w.type === typeStr);
        if (!alreadyLogged) {
          state.workouts.push({
            id: "wo_sync_" + Date.now(),
            date: today,
            type: typeStr,
            minutes: cleanMin,
            intensity: "Moderada"
          });
        }
        parts.push(`${cleanMin} min entreno`);
      }

      if (!parts.length) return false;

      const stamp = new Date().toLocaleDateString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      state.syncConfig = {
        ...(state.syncConfig || {}),
        lastSyncAt: stamp,
        lastSyncSummary: `${sourceLabel}: ${parts.join(" · ")}`
      };
      saveState();
      return parts.join(" · ");
    }

    function simulateAutoSyncDemo() {
      const currentW = getCurrentWeightKg();
      const summary = applySyncedHealthPayload({
        steps: 9420,
        weight: currentW,
        workoutMin: 35,
        workoutType: "Caminata / Xiaomi Sync",
        sourceLabel: "Apple Salud (prueba)"
      });
      closeSheet();
      render();
      if (summary) showToast(`✓ Sincronizado: ${summary}`);
    }

    function importHealthHistoryData() {
      const raw = (document.getElementById("healthImportArea")?.value || "").trim();
      if (!raw) {
        showToast("Pega datos CSV o JSON primero");
        return;
      }
      let importedCount = 0;
      try {
        if (raw.startsWith("{") || raw.startsWith("[")) {
          const parsed = JSON.parse(raw);
          const rows = Array.isArray(parsed) ? parsed : (parsed.data || parsed.metrics || [parsed]);
          rows.forEach(item => {
            const date = String(item.date || item.fecha || new Date().toISOString().slice(0, 10)).slice(0, 10);
            const steps = parseNumInput(item.steps ?? item.pasos, NaN);
            const weight = parseNumInput(item.weight ?? item.peso, NaN);
            if (Number.isFinite(steps) && steps > 0) {
              const idx = state.stepsLogs.findIndex(s => s.date === date);
              if (idx >= 0) state.stepsLogs[idx].steps = Math.round(steps);
              else state.stepsLogs.push({ date, steps: Math.round(steps) });
              importedCount++;
            }
            if (Number.isFinite(weight) && weight >= 30 && weight <= 250) {
              const idx = state.weightLogs.findIndex(w => w.date === date);
              if (idx >= 0) state.weightLogs[idx].weight = Number(weight.toFixed(1));
              else state.weightLogs.push({ id: "w_imp_" + Date.now() + importedCount, date, weight: Number(weight.toFixed(1)) });
              importedCount++;
            }
          });
        } else {
          raw.split(/\r?\n/).forEach(line => {
            const cols = line.split(/[;,]/).map(s => s.trim());
            if (cols.length < 2) return;
            const date = /^\d{4}-\d{2}-\d{2}$/.test(cols[0]) ? cols[0] : new Date().toISOString().slice(0, 10);
            const steps = parseNumInput(cols[1], NaN);
            const weight = cols[2] !== undefined ? parseNumInput(cols[2], NaN) : NaN;
            if (Number.isFinite(steps) && steps > 0) {
              const idx = state.stepsLogs.findIndex(s => s.date === date);
              if (idx >= 0) state.stepsLogs[idx].steps = Math.round(steps);
              else state.stepsLogs.push({ date, steps: Math.round(steps) });
              importedCount++;
            }
            if (Number.isFinite(weight) && weight >= 30 && weight <= 250) {
              const idx = state.weightLogs.findIndex(w => w.date === date);
              if (idx >= 0) state.weightLogs[idx].weight = Number(weight.toFixed(1));
              else state.weightLogs.push({ id: "w_imp_" + Date.now() + importedCount, date, weight: Number(weight.toFixed(1)) });
              importedCount++;
            }
          });
        }
        if (!importedCount) throw new Error();
        state.syncConfig.lastSyncAt = new Date().toLocaleDateString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        state.syncConfig.lastSyncSummary = `Importación manual (${importedCount} registros)`;
        saveState();
        closeSheet();
        render();
        showToast(`✓ Importados ${importedCount} dato(s) de Salud`);
      } catch (e) {
        showToast("Formato no reconocido (usa fecha,pasos,peso o JSON)");
      }
    }

    function processAutoSyncFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (!params.has("autosync") && !params.has("steps") && !params.has("weight") && !params.has("workoutMin")) {
          return;
        }
        const steps = parseNumInput(params.get("steps"), NaN);
        const weight = parseNumInput(params.get("weight"), NaN);
        const workoutMin = parseNumInput(params.get("workoutMin"), NaN);
        const workoutType = params.get("workoutType") || "Apple Salud / Xiaomi";
        const summary = applySyncedHealthPayload({ steps, weight, workoutMin, workoutType });
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
        if (summary) {
          setTimeout(() => showToast(`✓ Sincronizado: ${summary}`), 250);
        }
      } catch (e) {}
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    processAutoSyncFromUrl();
    render();
  </script>
