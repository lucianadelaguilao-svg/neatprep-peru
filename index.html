<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F9E8EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MealPrep" />
  <title>MealPrep &amp; NutriTrack</title>
  <style>
    :root {
      --bg-app: #FDF7F9;
      --bg-surface: #FFFFFF;
      --bg-soft: #FCEEF3;
      --bg-tint: #F8E2EA;
      --border: #F2D6E0;
      --border-strong: #E4B8C8;
      --text-main: #2A1920;
      --text-muted: #6E525D;
      --text-soft: #967783;
      --rose: #D45B84;
      --rose-dark: #B5436A;
      --rose-badge-bg: #FBE3EC;
      --rose-badge-text: #A8375E;
      --mint-bg: #E8F6F0;
      --mint-text: #1E6B4E;
      --amber-bg: #FFF4E2;
      --amber-text: #8F560A;
      --danger-bg: #FDECEC;
      --danger-text: #A62626;
      --shadow-sm: 0 2px 10px rgba(180, 67, 106, 0.06);
      --shadow-md: 0 8px 24px rgba(180, 67, 106, 0.12);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --radius-pill: 999px;
      --nav-height: 70px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F4E4EA;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .phone-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(74, 24, 43, 0.14);
    }

    @media (min-width: 520px) {
      body {
        padding: 16px;
        align-items: center;
      }
      .phone-shell {
        height: min(910px, calc(100dvh - 32px));
        border-radius: 36px;
        border: 6px solid #3B232C;
      }
    }

    .topbar {
      background: rgba(253, 247, 249, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      z-index: 20;
      flex-shrink: 0;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .brand > div {
      min-width: 0;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 11px;
      background: linear-gradient(135deg, #E3789C, var(--rose-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(181, 67, 106, 0.24);
    }

    .brand-title {
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-status {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--rose-badge-text);
      font-size: 11px;
      font-weight: 750;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .macro-strip {
      margin-top: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }

    .macro-item-val {
      font-size: 12px;
      font-weight: 750;
      color: var(--text-main);
    }

    .macro-item-lbl {
      font-size: 10px;
      color: var(--text-soft);
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      scroll-behavior: smooth;
    }

    .section-gap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 750;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .card-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 0;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    .btn-primary {
      background: var(--rose);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(212, 91, 132, 0.25);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: var(--rose-dark);
    }

    .btn-secondary {
      background: var(--bg-soft);
      color: var(--rose-badge-text);
      border: 1px solid var(--border-strong);
      font-weight: 700;
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary:active {
      background: var(--bg-tint);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      font-weight: 650;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 11.5px;
      border-radius: var(--radius-sm);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding-bottom: 2px;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 650;
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    .chip.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--rose-badge-bg);
      color: var(--rose-badge-text);
    }

    .badge-mint {
      background: var(--mint-bg);
      color: var(--mint-text);
    }

    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .recipe-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recipe-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .recipe-title {
      font-size: 14.5px;
      font-weight: 750;
      margin: 0;
    }

    .recipe-price {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--rose-dark);
      white-space: nowrap;
    }

    .macros-line {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-soft);
      padding: 6px 9px;
      border-radius: var(--radius-sm);
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(212, 91, 132, 0.14);
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
    }

    .check-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
    }

    .check-item.done .check-box {
      background: var(--rose);
      border-color: var(--rose);
    }

    .check-item.done .check-label {
      text-decoration: line-through;
      color: var(--text-soft);
    }

    .check-label {
      font-size: 13px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-track {
      height: 8px;
      background: var(--bg-tint);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #E3789C, var(--rose-dark));
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .progress-fill-mint {
      height: 100%;
      background: linear-gradient(90deg, #43B88C, #1E6B4E);
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .goal-box {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px;
    }

    .pantry-group-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--rose-dark);
      margin: 8px 0 5px;
    }

    .bmi-bar {
      position: relative;
      height: 10px;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, #8EC5FC 0%, #7ED9A6 25%, #7ED9A6 55%, #F7C97E 78%, #F28B82 100%);
      margin: 10px 0 6px;
    }

    .bmi-marker {
      position: absolute;
      top: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--rose-dark);
      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.28);
      transform: translateX(-50%);
    }

    .satiety-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sat-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 750;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-muted);
    }

    .sat-btn.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }

    .bottom-nav {
      height: var(--nav-height);
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      flex-shrink: 0;
      z-index: 20;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 650;
      color: var(--text-soft);
      padding: 4px 2px;
      min-width: 0;
    }

    .nav-btn.active {
      color: var(--rose-dark);
      font-weight: 800;
    }

    .nav-icon {
      font-size: 18px;
      line-height: 1.1;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 25, 32, 0.42);
      backdrop-filter: blur(2px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-width: 440px;
      max-height: 86dvh;
      background: var(--bg-app);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .sheet-header {
      padding: 10px 16px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-strong);
      margin: 0 auto 10px;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      position: fixed;
      bottom: calc(var(--nav-height) + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #2A1920;
      color: #fff;
      font-size: 12.5px;
      font-weight: 650;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 80;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-note {
      text-align: center;
      padding: 20px 12px;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--bg-soft);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-strong);
    }

    .seg-control {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: var(--radius-md);
    }

    .seg-control.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .seg-btn {
      padding: 7px 6px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--rose-dark);
      box-shadow: 0 2px 6px rgba(180, 67, 106, 0.12);
    }

    .macro-targets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .macro-target-tile {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 10px;
    }

    .macro-target-tile.highlight {
      background: linear-gradient(135deg, #FCEAF1, #FFF7FA);
      border-color: var(--border-strong);
    }

    .macro-target-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .macro-target-tile.highlight .macro-target-val {
      color: var(--rose-dark);
    }

    .macro-target-lbl {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .macro-target-sub {
      font-size: 10px;
      color: var(--text-soft);
      margin-top: 2px;
    }

    .clinical-tip-box {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .clinical-tip-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--text-main);
      line-height: 1.42;
    }

    .clinical-tip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rose);
      margin-top: 6px;
      flex-shrink: 0;
    }

    .carb-rations-box {
      background: #FFF9FB;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 11px;
      margin-top: 10px;
    }

    .meal-ration-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
    }

    .micro-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .micro-item {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 11px;
    }

    .micro-item.priority {
      background: #FFF7FA;
      border-color: var(--border-strong);
    }

    .micro-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .micro-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
    }

    .micro-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
      margin: 0;
    }

    .micro-care {
      font-size: 11.5px;
      color: var(--text-main);
      line-height: 1.4;
      margin: 4px 0 0;
    }

    .disclaimer-box {
      background: rgba(252, 238, 243, 0.55);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.45;
      color: var(--text-soft);
    }

    .workout-day-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .workout-day-card.done {
      background: #FCF9FA;
      border-color: var(--border-strong);
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 10px;
    }

    .exercise-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      line-height: 1.38;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(228, 184, 200, 0.45);
    }

    .exercise-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .exercise-name {
      font-weight: 700;
      color: var(--text-main);
    }

    .exercise-scheme {
      font-size: 11px;
      font-weight: 750;
      color: var(--rose-dark);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .science-card-block {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .science-block-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--rose-dark);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;

    }

      color: var(--border-strong);

    .fav-btn.active {
      color: #E09100;
    }

    .fav-btn:active {
      transform: scale(1.15);
    }

      color: var(--text-muted);
      display: flex;
      align-items: center;

      flex-wrap: wrap;

    }

      padding-left: 32px;
      font-size: 13px;
      background: var(--bg-soft);
      border-color: var(--border);
    }

    .search-box .search-ico {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-soft);
      pointer-events: none;
    }

    .taper-compact-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 13px;
      box-shadow: var(--shadow-sm);
    }

    .taper-compact-card.expanded {
      border-color: var(--border-strong);
    }

    .taper-details {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-strong);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cook-step-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-size: 12.5px;
      cursor: pointer;
    }

    .cook-step-item.done {
      background: var(--bg-soft);
      color: var(--text-soft);
      text-decoration: line-through;
    }

    .in-home-pill {
      background: var(--bg-soft);
      border: 1px solid var(--border-strong);
      color: var(--rose-dark);
      font-size: 10.5px;
      font-weight: 750;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .in-home-pill:active {
      background: var(--bg-tint);
    }

    .hero-today-card {
      background: linear-gradient(135deg, #FFF7FA, #FCEAF1);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .week-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .week-day-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 7px 2px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .week-day-pill.today {
      border-color: var(--rose);
      background: #FFF6F9;
    }

    .week-day-pill.selected {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
      box-shadow: 0 4px 10px rgba(212, 91, 132, 0.25);
    }

    .week-day-abbr {
      font-size: 9.5px;
      font-weight: 700;
      opacity: 0.82;
      text-transform: uppercase;

    .week-day-num {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.1;
    }

    .week-dots {
      display: flex;
      gap: 3px;
      align-items: center;
      height: 6px;
    }

    .week-dot-meal {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--rose);
    }

    .week-dot-work {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #1E6B4E;

      background: #FFE0EC;

      background: #A9F2D4;

      flex-direction: column;

    function getShoppingList() {
      const map = {};
      Object.values(state.tapers).forEach(recipeId => {
        const r = state.recipes.find(x => x.id === recipeId);
        if (!r) return;
        (r.ingredients || []).forEach(ing => {
          if (state.pantryKeys.includes(ing.key)) return;
          if (!map[ing.key]) {
            const meta = state.prices[ing.key] || { name: ing.key, unit: "ud", aisle: "Despensa", price: 2, packSize: 1, packLabel: "unidad" };
            map[ing.key] = {
              key: ing.key,
              name: meta.name,
              unit: meta.unit,
              aisle: meta.aisle || "Despensa",
              qty: 0,
              unitPrice: getUnitPrice(ing.key),
              packSize: meta.packSize || 1,
              packLabel: meta.packLabel || meta.unit
            };
          }
          map[ing.key].qty += Number(ing.qty || 0);
        });
      });
      return Object.values(map).map(item => {
        const packsNeeded = Math.max(1, Math.ceil(item.qty / item.packSize));
        return {
          ...item,
          cost: item.qty * item.unitPrice,
          packCost: packsNeeded * item.packSize * item.unitPrice,
          packsNeeded
        };
      });
    }

    function scaleIngredientLabel(label, mult) {
      if (mult === 1) return label;
      const str = String(label || "");
      const fmtNum = (n) => {
        const rounded = Math.round(n * 10) / 10;
        return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(".", ",");
      };
      // Handle leading fraction like "1/2 limón"
      const fracMatch = str.match(/^(\d+)\s*\/\s*(\d+)(.*)$/);
      if (fracMatch) {
        const val = (Number(fracMatch[1]) / Number(fracMatch[2])) * mult;
        return `${fmtNum(val)}${fracMatch[3]}`;
      }
      // Handle leading range like "4–5 hojas..."
      const rangeMatch = str.match(/^(\d+(?:[.,]\d+)?)\s*[–-]\s*(\d+(?:[.,]\d+)?)(.*)$/);
      if (rangeMatch) {
        const a = parseFloat(rangeMatch[1].replace(",", ".")) * mult;
        const b = parseFloat(rangeMatch[2].replace(",", ".")) * mult;
        return `${fmtNum(a)}–${fmtNum(b)}${rangeMatch[3]}`;
      }
      // Handle leading number like "180 g pechuga..." or "1.5 cdtas..."
      const numMatch = str.match(/^(\d+(?:[.,]\d+)?)(.*)$/);
      if (numMatch) {
        const val = parseFloat(numMatch[1].replace(",", ".")) * mult;
        return `${fmtNum(val)}${numMatch[2]}`;
      }
      return `${str} (×${mult})`;
    }

      const sex = state.bodyProfile.sex === "M" ? "M" : "F";

      const deficitVal = Math.max(250, Math.min(800, Number(state.bodyProfile.deficit) || 550));
      const surplusVal = Math.max(150, Math.min(500, Number(state.bodyProfile.surplus) || 250));

      const bmi = weightKg / (heightM * heightM);
      let bmiCategory = "Normopeso";
      let bmiColor = "var(--mint-text)";
      if (bmi < 18.5) {
        bmiCategory = "Bajo peso";
        bmiColor = "#2B6CB0";
      } else if (bmi >= 25 && bmi < 30) {
        bmiCategory = "Sobrepeso";
        bmiColor = "var(--amber-text)";
      } else if (bmi >= 30) {
        bmiCategory = "Obesidad";

      }
      const bmiPct = Math.max(4, Math.min(96, ((bmi - 16) / (35 - 16)) * 100));
      const healthyMinKg = (18.5 * heightM * heightM).toFixed(1);

      const bmr = Math.round(10 * weightKg + 6.25 * heightCm - 5 * age + (sex === "M" ? 5 : -161));
      const tdee = Math.round(bmr * activity);

      const minSafeKcal = sex === "M" ? 1500 : 1250;
      let targetKcal = tdee;
      let kcalDelta = 0;
      let kcalDeltaLabel = "Equilibrio (0)";
      if (goal === "deficit") {
        targetKcal = Math.max(minSafeKcal, tdee - deficitVal);
        kcalDelta = targetKcal - tdee;
        kcalDeltaLabel = `Déficit (${kcalDelta})`;
      } else if (goal === "hypertrophy") {
        targetKcal = tdee + surplusVal;
        kcalDelta = surplusVal;
        kcalDeltaLabel = `Superávit (+${surplusVal})`;
      }

      const protPerKg = goal === "hypertrophy" ? 2.1 : (goal === "deficit" ? 1.9 : 1.6);
      const targetProtein = Math.round(weightKg * protPerKg);

      const todayStr = new Date().toISOString().slice(0, 10);
      const trainedToday = state.workouts.some(w => w.date === todayStr);
      const isDiabetes = hasCondition("diabetes");
      const isIR = hasCondition("insulin_resistance");

      let carbRatio = 0.42;
      if (isDiabetes) {

        carbRatio = goal === "hypertrophy" ? 0.40 : (goal === "deficit" ? 0.31 : 0.36);

      } else {
        carbRatio = goal === "hypertrophy" ? 0.48 : (goal === "deficit" ? 0.37 : 0.43);
      }

      let rawCarbs = Math.round((targetKcal * carbRatio) / 4) + (trainedToday ? 15 : 0);
      const minFatG = Math.max(42, Math.round(weightKg * (sex === "F" ? 0.78 : 0.72)));
      const maxCarbsByFatFloor = Math.max(70, Math.round((targetKcal - targetProtein * 4 - minFatG * 9) / 4));
      const targetCarbs = Math.max(70, Math.min(rawCarbs, maxCarbsByFatFloor));
      const targetFat = Math.max(38, Math.round((targetKcal - targetProtein * 4 - targetCarbs * 4) / 9));

      const mealsPerDay = [3, 4, 5].includes(Number(state.clinicalProfile?.mealsPerDay)) ? Number(state.clinicalProfile.mealsPerDay) : 4;
      const gramsPerRation = [10, 15].includes(Number(state.clinicalProfile?.gramsPerRation)) ? Number(state.clinicalProfile.gramsPerRation) : 15;
      const totalRations = Number((targetCarbs / gramsPerRation).toFixed(1));

      const mealTemplates = {
        3: [
          { name: "Desayuno", share: 0.30 },
          { name: "Almuerzo", share: 0.40 },

        const grams = Math.round(targetCarbs * slot.share);
        const rations = Number((grams / gramsPerRation).toFixed(1));
        return { name: slot.name, grams, rations };
      });

        sex,
        age,
        heightCm,

    function getBodyGoalMetrics() {
      const currentKg = getCurrentWeightKg();
      const rawStart = Number(state.bodyGoals.startWeight) || currentKg;
      const milestoneKg = Number(state.bodyGoals.milestoneKg) || 64.0;
      const annualKg = Number(state.bodyGoals.annualKg) || 60.0;
      const isGainGoal = milestoneKg > rawStart;

      const startKg = isGainGoal ? Math.min(currentKg, rawStart) : Math.max(currentKg, rawStart);

      const totalToMilestone = Math.max(0.1, Math.abs(startKg - milestoneKg));
      const progressMilestone = isGainGoal ? Math.max(0, currentKg - startKg) : Math.max(0, startKg - currentKg);
      const milestonePct = Math.max(0, Math.min(100, Math.round((progressMilestone / totalToMilestone) * 100)));
      const remMilestone = isGainGoal ? Math.max(0, milestoneKg - currentKg) : Math.max(0, currentKg - milestoneKg);

      const isGainAnnual = annualKg > rawStart;
      const totalToAnnual = Math.max(0.1, Math.abs(startKg - annualKg));
      const progressAnnual = isGainAnnual ? Math.max(0, currentKg - startKg) : Math.max(0, startKg - currentKg);
      const annualPct = Math.max(0, Math.min(100, Math.round((progressAnnual / totalToAnnual) * 100)));
      const remAnnual = isGainAnnual ? Math.max(0, annualKg - currentKg) : Math.max(0, currentKg - annualKg);

      const goal = state.bodyProfile.goal || "deficit";
      const kcalDelta = goal === "hypertrophy"
        ? Math.max(150, Number(state.bodyProfile.surplus) || 250)
        : Math.max(250, Number(state.bodyProfile.deficit) || 550);
      const weeklyRateKg = goal === "maintenance" ? 0 : (kcalDelta * 7) / 7700;
      const weeksTo64 = (remMilestone > 0 && weeklyRateKg > 0) ? Math.ceil(remMilestone / weeklyRateKg) : 0;
      const etaDate = new Date();
      etaDate.setDate(etaDate.getDate() + weeksTo64 * 7);
      const etaStr = etaDate.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });

      return {
        currentKg,
        startKg,
        milestoneKg,
        annualKg,
        milestonePct,
        remMilestone,
        annualPct,
        remAnnual,
        weeklyLossKg: weeklyRateKg,
        weeksTo64,
        etaStr,
        isGainGoal
      };
    }

    function switchTab(tab, subTab = null) {
      if (tab === "cocina") {
        openSettingsSheet();
        return;
      }
      if (tab === "recetas") {
        tab = "comida";
        comidaSubTab = "recetario";
      } else if (tab === "tapers") {
        tab = "comida";
        comidaSubTab = "tapers";
      } else if (tab === "semana") {
        tab = "hoy";
        hoySubTab = "semana";
      } else if (tab === "comida" && subTab) {
        comidaSubTab = subTab;
      } else if (tab === "hoy" && subTab) {
        hoySubTab = subTab;
      }
      currentTab = tab;
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      render();
      document.getElementById("mainContent").scrollTop = 0;
    }

    function getTodayWeekdayName() {
      const idx = new Date().getDay(); // 0 Sun, 1 Mon ... 5 Fri, 6 Sat
      const map = { 1: "Lunes", 2: "Martes", 3: "Miércoles", 4: "Jueves", 5: "Viernes" };
      return map[idx] || null;
    }

    function getFullWeekdayName(jsDayIdx) {
      const map = { 0: "Domingo", 1: "Lunes", 2: "Martes", 3: "Miércoles", 4: "Jueves", 5: "Viernes", 6: "Sábado" };
      return map[jsDayIdx] || "Lunes";
    }

    function getPlanDayWeekday(dayObj) {
      const lbl = String(dayObj?.dayLabel || "");
      if (lbl.includes("(Lun)")) return "Lunes";
      if (lbl.includes("(Mar)")) return "Martes";
      if (lbl.includes("(Mié)")) return "Miércoles";
      if (lbl.includes("(Jue)")) return "Jueves";
      if (lbl.includes("(Vie)")) return "Viernes";
      if (lbl.includes("(Sáb)")) return "Sábado";
      if (lbl.includes("(Dom)")) return "Domingo";
      return "Lunes";
    }

    function getCurrentWeekCalendarData(m, plan) {
      const now = new Date();
      const jsDay = now.getDay(); // 0 Sun .. 6 Sat
      const offsetToMon = jsDay === 0 ? -6 : (1 - jsDay);
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offsetToMon);
      const todayFullName = getFullWeekdayName(jsDay);
      const completedMap = state.trainingProfile?.completedPlanDays || {};

      const workoutByDay = {};
      (plan.schedule || []).forEach(item => {
        workoutByDay[getPlanDayWeekday(item)] = item;
      });

      const weekMeta = [
        { name: "Lunes", abbr: "Lun", isWeekend: false },
        { name: "Martes", abbr: "Mar", isWeekend: false },
        { name: "Miércoles", abbr: "Mié", isWeekend: false },
        { name: "Jueves", abbr: "Jue", isWeekend: false },
        { name: "Viernes", abbr: "Vie", isWeekend: false },
        { name: "Sábado", abbr: "Sáb", isWeekend: true },
        { name: "Domingo", abbr: "Dom", isWeekend: true }
      ];

      return weekMeta.map((info, i) => {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        const dayNum = d.getDate();
        const dateLabel = d.toLocaleDateString("es-ES", { day: "numeric", month: "short" });
        const recId = info.isWeekend ? (state.weekendMeals?.[info.name] || "") : state.tapers[info.name];
        const recipe = recId ? (state.recipes.find(r => r.id === recId) || null) : null;
        const workout = workoutByDay[info.name] || null;
        return {
          ...info,
          dayNum,
          dateLabel,
          isToday: info.name === todayFullName,
          recipe,
          dayExtra: state.dayExtras?.[info.name] || "",
          workout,
          workoutDone: workout ? Boolean(completedMap[workout.id]) : false
        };
      });
    }

                  <button class="btn-ghost btn-sm" style="padding:2px 6px; font-size:11px; color:var(--mint-text); font-weight:800;" onclick="togglePlanDayDone('${d.workout.id}')">${d.workoutDone ? "✓ Hecho" : "○ Marcar"}</button>
                  <button class="btn-ghost btn-sm" style="padding:2px 6px; font-size:11px;" onclick="switchTab('entreno')">Ver rutina</button>
                </div>
              </div>
              <div style="font-size:13px; font-weight:750; color:var(--text-main);">${d.workout.title}</div>
              <div style="font-size:11px; color:var(--text-muted);">

          `

            <div class="cal-slot rest">
              <div class="cal-slot-head">
                <span>🌿 Descanso activo</span>
                <span style="font-size:10.5px; font-weight:650; color:var(--text-soft);">Meta: ${Number(state.stepsGoal).toLocaleString("es-ES")} pasos</span>
              </div>
              <div style="font-size:11.5px; color:var(--text-muted);">${restDayTip}</div>

            <div class="row-between">
              <div style="display:flex; align-items:center; gap:6px;">
                <strong style="font-size:14px; color:var(--text-main);">${d.name}</strong>
                <span style="font-size:11.5px; color:var(--text-soft);">${d.dateLabel}</span>
                ${d.isToday ? `<span class="badge">HOY</span>` : ""}
              </div>
              <div style="display:flex; gap:5px;">
                ${d.workout ? `<span class="badge badge-mint">${d.workoutDone ? "✓ Entreno" : d.workout.badge}</span>` : `<span class="badge" style="background:var(--bg-soft); color:var(--text-soft);">Descanso</span>`}
              </div>
            </div>
            ${mealBlockHtml}
            ${workoutBlockHtml}

      }).join("");

      return `
        <div class="card">
          <div class="row-between" style="margin-bottom:8px;">
            <div>
              <div class="card-title">📅 Calendario Semanal (L–D)</div>
              <div class="card-sub">Comidas: <strong>${plannedMealsCount}/7</strong> · Entrenos: <strong>${workoutsDone}/${workoutsTotal}</strong> (${plan.planTitle})</div>
            </div>
          </div>
          ${stripHtml}
          <div style="display:flex; align-items:center; gap:12px; font-size:10.5px; color:var(--text-soft); margin-top:8px;">
            <span style="display:inline-flex; align-items:center; gap:4px;"><span class="week-dot-meal"></span> Comida</span>
            <span style="display:inline-flex; align-items:center; gap:4px;"><span class="week-dot-work"></span> Entreno</span>
            <span style="margin-left:auto;">Toca un día para saltar</span>
          </div>
        </div>
        ${cardsHtml}
      `;
    }

    function renderHoy(container) {
      const m = getAdaptiveNutritionMetrics();
      const plan = getAdaptiveTrainingPlan(m);

      const topSwitcherHtml = `
        <div class="seg-control">
          <button class="seg-btn ${hoySubTab === "hoy" ? "active" : ""}" onclick="setHoySubTab('hoy')">⚡ Hoy</button>
          <button class="seg-btn ${hoySubTab === "semana" ? "active" : ""}" onclick="setHoySubTab('semana')">📅 Semana (L–D)</button>
        </div>
      `;

      if (hoySubTab === "semana") {
        container.innerHTML = `
          <div class="section-gap">
            ${topSwitcherHtml}
            ${buildWeeklyCalendarHtml(m, plan)}
          </div>
        `;
        return;
      }

      const quickList = state.recipes.filter(r => {
        if (!r.quickToday) return false;
        if (onlyPantryToday) {
          return (r.ingredients || []).some(i => state.pantryKeys.includes(i.key));
        }
        return true;
      });

      const medsDone = state.meds.filter(med => med.checked).length;
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayStepsObj = state.stepsLogs.find(s => s.date === todayStr) || state.stepsLogs[state.stepsLogs.length - 1] || { steps: 0 };
      const g = getBodyGoalMetrics();
      const completedMap = state.trainingProfile?.completedPlanDays || {};
      const nextWorkout = plan.schedule.find(d => !completedMap[d.id]) || plan.schedule[0];
      const workoutsDoneCount = plan.schedule.filter(d => Boolean(completedMap[d.id])).length;

      const todayDayName = getTodayWeekdayName();
      const activeDayKey = todayDayName || "Lunes";
      const todayRecipe = state.recipes.find(x => x.id === state.tapers[activeDayKey]) || state.recipes[0];
      const totalHomeCount = state.pantryKeys.length + state.customPantry.length;
      const activeCondLabels = (state.clinicalProfile.conditions || [])
        .map(c => CLINICAL_CONDITION_META[c]?.short)
        .filter(Boolean);
      const healthBannerTitle = activeCondLabels.length
        ? `Salud (${activeCondLabels.join(" · ")}) & Pasos hoy`
        : "Salud, Protocolo & Pasos hoy";

      container.innerHTML = `
        <div class="section-gap">
          ${topSwitcherHtml}

          <div class="hero-today-card">
            <div class="row-between" style="margin-bottom:6px;">
              <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                <span class="badge">${todayDayName ? `Tu táper de ${todayDayName}` : "Próximo táper (Lunes)"}</span>
                <span class="badge badge-mint">⏱ ${todayRecipe.timeMin} min</span>
              </div>
              <button class="btn-ghost btn-sm" style="color:var(--rose-dark);" onclick="setHoySubTab('semana')">📅 Semana</button>
            </div>
            <div style="font-size:15px; font-weight:800; color:var(--text-main); margin-bottom:5px;">${todayRecipe.title}</div>
            <div class="macros-line" style="background:rgba(255,255,255,0.8); margin-bottom:9px;">
              <span><strong>${todayRecipe.kcal}</strong> kcal</span>
              <span>·</span>
              <span>Prot: <strong>${todayRecipe.protein}g</strong></span>
              <span>·</span>
              <span>Carb: <strong>${todayRecipe.carbs}g</strong></span>
              <span>·</span>
              <span>Grasa: <strong>${todayRecipe.fat}g</strong></span>
            </div>
            <div class="row-between" style="gap:7px;">
              <button class="btn-primary btn-sm" style="flex:1;" onclick="openRecipeSheet('${todayRecipe.id}')">Preparar / Escalar</button>
              <button class="btn-secondary btn-sm" style="flex:1;" onclick="scrollToQuickToday()">¿No te provoca? Rápida</button>
            </div>
          </div>

          <div class="card">
            <div class="row-between" style="margin-bottom:5px;">
              <div>
                <div style="font-size:13px; font-weight:800; color:var(--text-main);">🏋️ Entreno sugerido (${workoutsDoneCount}/${plan.schedule.length} sem)</div>
                <div class="card-sub"><strong>${nextWorkout.title}</strong> · ${nextWorkout.mins} min · ${plan.rpeLabel}</div>
              </div>
              <button class="btn-secondary btn-sm" style="white-space:nowrap;" onclick="switchTab('entreno')">Ver plan</button>
            </div>
          </div>

          <div class="card">
            <div class="row-between">
              <div>
                <div style="font-size:13px; font-weight:750;">${healthBannerTitle}</div>
                <div class="card-sub">Tomas: <strong>${medsDone}/${state.meds.length}</strong> · Pasos: <strong>${Number(todayStepsObj.steps || 0).toLocaleString("es-ES")}</strong> / ${Number(state.stepsGoal).toLocaleString("es-ES")}</div>
              </div>
              <button class="btn-secondary btn-sm" onclick="switchTab('progreso')">Registrar</button>
            </div>
          </div>

          <div class="card">
            <div class="row-between" style="margin-bottom:6px;">
              <div>
                <div style="font-size:13.5px; font-weight:800; color:var(--rose-dark);">Body Goals · ${g.currentKg.toFixed(1)} kg → ${g.milestoneKg} kg / ${g.annualKg} kg</div>
                <div class="card-sub">Fase 1: <strong>${g.milestoneKg} kg</strong> (${g.weeksTo64 > 0 ? `~${g.weeksTo64} sem` : (state.bodyProfile.goal === "maintenance" ? "Mantenimiento" : "¡Logrado!")}) · Meta ${state.bodyGoals.annualYear}: <strong>${g.annualKg} kg</strong></div>
              </div>
              <button class="btn-secondary btn-sm" onclick="switchTab('progreso')">Ver salud</button>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${g.annualPct}%;"></div></div>
          </div>

          <div class="card-soft" id="hoyQuickSection">
            <div class="row-between">
              <div>
                <div class="card-title">Para hacer hoy (sin planear semana)</div>
                <div class="card-sub">Opciones rápidas de 8–20 min listas al momento.</div>
              </div>
              <span class="badge">${quickList.length} opciones</span>
            </div>
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
              <button class="chip ${!onlyPantryToday ? "active" : ""}" onclick="setOnlyPantry(false)">Todas las rápidas</button>
              <button class="chip ${onlyPantryToday ? "active" : ""}" onclick="setOnlyPantry(true)">Con algo de mi casa (${totalHomeCount})</button>
              <button class="chip" onclick="switchTab('comida', 'recetario')">Buscar en recetario →</button>
            </div>
          </div>

          ${quickList.length ? quickList.map(r => renderRecipeCardHtml(r, true)).join("") : `
            <div class="empty-note">
              No hay recetas rápidas con lo marcado en tu despensa. Toca "Todas las rápidas" o marca lo que tienes en <strong>Comida → En casa</strong>.
            </div>
          `}
        </div>
      `;
    }

    function scrollToQuickToday() {
      const el = document.getElementById("hoyQuickSection");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function setOnlyPantry(val) {
      onlyPantryToday = val;
      render();
    }

    function renderRecipeCardHtml(r, showAssignBtn = false) {
      const cost = getRecipeCost(r, 1, true);
      const hasAppliance = !(r.appliances || []).length || r.appliances.some(a => state.appliances.includes(a));
      const gPerRation = [10, 15].includes(Number(state.clinicalProfile?.gramsPerRation)) ? Number(state.clinicalProfile.gramsPerRation) : 15;
      const diabetesRationChip = hasCondition("diabetes")
        ? `<span>·</span><span><strong>${(r.carbs / gPerRation).toFixed(1)}</strong> rac. HC</span>`
        : "";
      const fav = isFavoriteRecipe(r.id);
      const match = getRecipePantryMatch(r);
      const missingPreview = match.missingNames.slice(0, 3).join(", ") + (match.missingNames.length > 3 ? ` +${match.missingNames.length - 3}` : "");
      const pantryHtml = match.isReady
        ? `<div class="pantry-match-line ready">✓ Lista con lo que ya tienes en casa (${match.haveCount}/${match.totalCount})</div>`
        : `<div class="pantry-match-line"><span>🏠 Tienes <strong>${match.haveCount}/${match.totalCount}</strong></span><span>·</span><span>Falta: ${missingPreview}</span></div>`;

      return `
        <div class="recipe-card">
          <div class="recipe-top">
            <div>
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px;">
                <span class="badge">${r.category}</span>
                <span class="badge badge-mint">⏱ ${r.timeMin} min</span>
                ${r.carbs <= 20 ? `<span class="badge badge-mint">Baja HC</span>` : ""}
                ${r.tiktokUrl ? `<span class="badge badge-amber">🎵 TikTok Fit</span>` : ""}
                ${!hasAppliance ? `<span class="badge" style="background:var(--danger-bg);color:var(--danger-text);">Revisar aparato</span>` : ""}
              </div>
              <h3 class="recipe-title">${r.title}</h3>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">
              <div class="recipe-price">${fmtEur(cost)}</div>
              <button class="fav-btn ${fav ? "active" : ""}" onclick="toggleFavoriteRecipe('${r.id}')" aria-label="Guardar favorita">${fav ? "★" : "☆"}</button>
            </div>
          </div>
          <div class="macros-line">
            <span><strong>${r.kcal}</strong> kcal</span>
            <span>·</span>
            <span>Prot: <strong>${r.protein}g</strong></span>
            <span>·</span>
            <span>Carb: <strong>${r.carbs}g</strong></span>
            ${diabetesRationChip}
            <span>·</span>
            <span>Grasa: <strong>${r.fat}g</strong></span>
          </div>
          ${pantryHtml}
          <div class="row-between" style="margin-top:2px;">
            <div style="display:flex; gap:6px;">
              <button class="btn-secondary btn-sm" onclick="openRecipeSheet('${r.id}')">Preparación</button>
              <button class="btn-ghost btn-sm" onclick="shareRecipe('${r.id}')">Compartir</button>
            </div>
            ${showAssignBtn ? `<button class="btn-primary btn-sm" onclick="openBatchAssignSheet('${r.id}')">+ Táper / Batch</button>` : ""}
          </div>
        </div>
      `;
    }

    function shareRecipe(id) {
      const r = state.recipes.find(x => x.id === id);
      if (!r) return;
      const text = `🍲 ${r.title} (${r.kcal} kcal | ${r.protein}g prot | ${r.carbs}g carb)\nIngredientes:\n` +
        (r.ingredients || []).map(i => `• ${i.label}`).join("\n") +
        `\nPasos:\n` + (r.steps || []).map((s, idx) => `${idx + 1}. ${s}`).join("\n") +
        (r.tiktokUrl ? `\nVideo: ${r.tiktokUrl}` : "");

      if (navigator.share) {
        navigator.share({ title: r.title, text }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast("Receta copiada para enviar a tu amiga"));
      } else {
        showToast("Receta lista");
      }
    }

    function getFilteredRecipes() {
      const q = recipeSearch.trim().toLowerCase();
      return state.recipes.filter(r => {
        if (recipeFilter !== "Todas") {
          if (recipeFilter === "TikTok Fit") {
            if (!r.tiktokUrl) return false;
          } else if (r.category !== recipeFilter) {
            return false;
          }
        }
        if (recipeQuickFilter === "fast15" && r.timeMin > 15) return false;
        if (recipeQuickFilter === "lowcarb" && r.carbs > 20) return false;
        if (recipeQuickFilter === "fav" && !isFavoriteRecipe(r.id)) return false;
        if (recipeQuickFilter === "pantry") {
          const m = getRecipePantryMatch(r);
          if (m.haveCount === 0) return false;
        }
        if (q) {
          const hay = [
            r.title,
            r.category,
            ...(r.ingredients || []).map(i => i.label)
          ].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a, b) => {
        if (recipeQuickFilter === "pantry") {
          return getRecipePantryMatch(b).haveCount - getRecipePantryMatch(a).haveCount;
        }
        return 0;
      });
    }

    function renderComida(container) {
      const totalHomeCount = state.pantryKeys.length + state.customPantry.length;
      const subNavHtml = `
        <div class="seg-control cols-3">
          <button class="seg-btn ${comidaSubTab === "recetario" ? "active" : ""}" onclick="setComidaSubTab('recetario')">🍲 Recetario</button>
          <button class="seg-btn ${comidaSubTab === "tapers" ? "active" : ""}" onclick="setComidaSubTab('tapers')">🥡 Tápers L–V</button>
          <button class="seg-btn ${comidaSubTab === "despensa" ? "active" : ""}" onclick="setComidaSubTab('despensa')">🏠 En casa (${totalHomeCount})</button>
        </div>
      `;

      let bodyHtml = "";
      if (comidaSubTab === "recetario") bodyHtml = buildRecetarioHtml();
      else if (comidaSubTab === "tapers") bodyHtml = buildTapersHtml();
      else bodyHtml = buildDespensaHtml();

      container.innerHTML = `
        <div class="section-gap">
          ${subNavHtml}
          ${bodyHtml}
        </div>
      `;
    }

    function buildRecetarioHtml() {
      const cats = ["Todas", "Pollo", "Carne", "Atún / Salmón", "Lentejas", "TikTok Fit"];
      const quickChips = [
        { id: "all", label: "Todo" },
        { id: "fast15", label: "⚡ ≤15 min" },
        { id: "lowcarb", label: "💚 Baja en carbos" },
        { id: "fav", label: "⭐ Favoritas" },
        { id: "pantry", label: "🏠 Con mi casa" }
      ];
      const filtered = getFilteredRecipes();

      return `
        <div class="card">
          <div class="row-between">
            <div>
              <div class="card-title">Recetario Fit &amp; TikTok</div>
              <div class="card-sub">Busca por ingrediente o filtra por tiempo, IR y favoritas.</div>
            </div>
            <button class="btn-primary btn-sm" style="white-space:nowrap;" onclick="openAddTikTokSheet()">+ TikTok Fit</button>
          </div>

          <div class="search-box">
            <span class="search-ico">🔍</span>
            <input type="text" id="recipeSearchInput" value="${escapeAttr(recipeSearch)}" oninput="onRecipeSearchInput(this.value)" placeholder="Buscar: pollo, atún, salmón, palta..." />
          </div>

          <div class="chip-row" style="margin-top:9px;">
            ${quickChips.map(qc => `<button class="chip ${recipeQuickFilter === qc.id ? "active" : ""}" onclick="setRecipeQuickFilter('${qc.id}')">${qc.label}</button>`).join("")}
          </div>

          <div class="chip-row" style="margin-top:7px;">
            ${cats.map(c => `<button class="chip ${recipeFilter === c ? "active" : ""}" onclick="setRecipeFilter('${c}')">${c}</button>`).join("")}
          </div>
        </div>

        <div id="recipeResultsContainer" class="section-gap">
          ${filtered.length ? filtered.map(r => renderRecipeCardHtml(r, true)).join("") : `
            <div class="empty-note">
              No encontramos recetas con ese filtro. Prueba limpiar la búsqueda o tocar <strong>Todo</strong>.
            </div>
          `}
        </div>
      `;
    }

    function onRecipeSearchInput(val) {
      recipeSearch = val;
      const box = document.getElementById("recipeResultsContainer");
      if (!box) {
        render();
        return;
      }
      const filtered = getFilteredRecipes();
      box.innerHTML = filtered.length
        ? filtered.map(r => renderRecipeCardHtml(r, true)).join("")
        : `<div class="empty-note">No encontramos recetas con "${escapeHtml(val)}". Prueba otro ingrediente.</div>`;
    }

    function setRecipeFilter(cat) {
      recipeFilter = cat;
      render();
    }

    function setRecipeQuickFilter(qf) {
      recipeQuickFilter = qf;
      render();
    }

    function toggleExpandTaperDay(day) {
      expandedTaperDay = expandedTaperDay === day ? null : day;
      render();
    }

    function buildTapersHtml() {
      const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
      let totalKcal = 0, totalProt = 0, totalCarbs = 0;

      const counts = {};
      const uniqueRecipes = {};
      days.forEach(d => {
        const id = state.tapers[d];
        counts[id] = (counts[id] || 0) + 1;
        const rec = state.recipes.find(x => x.id === id);
        if (rec) uniqueRecipes[id] = rec;
      });
      const uniqueList = Object.values(uniqueRecipes);
      const estBatchMins = uniqueList.reduce((sum, r) => sum + (Number(r.timeMin) || 15), 0);

      const rowsHtml = days.map(day => {
        const rId = state.tapers[day];
        const r = state.recipes.find(x => x.id === rId) || state.recipes[0];
        totalKcal += r.kcal;
        totalProt += r.protein;
        totalCarbs += r.carbs;
        const sat = state.satietyScores[day] || 4;
        const batchCount = counts[r.id] || 1;
        const isExpanded = expandedTaperDay === day;

        return `
          <div class="taper-compact-card ${isExpanded ? "expanded" : ""}">
            <div class="row-between" style="margin-bottom:5px; cursor:pointer;" onclick="toggleExpandTaperDay('${day}')">
              <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                <span class="badge">${day}</span>
                ${batchCount > 1 ? `<span class="badge badge-mint">Batch ×${batchCount}</span>` : ""}
                <span style="font-size:11px; color:var(--text-soft);">Saciedad ${sat}/5</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="recipe-price">${fmtEur(getRecipeCost(r, 1, true))}</span>
                <span style="font-size:11px; color:var(--rose-dark); font-weight:750;">${isExpanded ? "▴" : "▾"}</span>
              </div>
            </div>

            <div class="row-between" style="align-items:flex-start; gap:8px;">
              <div style="flex:1; cursor:pointer;" onclick="toggleExpandTaperDay('${day}')">
                <div style="font-size:13.5px; font-weight:750; margin-bottom:2px;">${r.title}</div>
                <div style="font-size:11px; color:var(--text-muted);">
                  ${r.kcal} kcal · ${r.protein}g prot · ${r.carbs}g carb · ⏱ ${r.timeMin} min
                </div>
              </div>
              <button class="btn-primary btn-sm" style="flex-shrink:0;" onclick="openDaySelectorSheet('${day}')">Cambiar</button>
            </div>

            ${isExpanded ? `
              <div class="taper-details">
                <div style="font-size:11.5px; background:var(--bg-soft); padding:7px 9px; border-radius:var(--radius-sm); color:var(--text-muted);">
                  💡 ${r.taperTip || "Guarda en táper hermético."}
                </div>

                <div>
                  <label style="font-size:10.5px;">Resto del día (desayuno / cena / snacks)</label>
                  <input type="text" style="font-size:12px; padding:6px 9px;" value="${escapeAttr(state.dayExtras[day] || "")}" onchange="updateDayExtra('${day}', this.value)" placeholder="Añade desayuno y cena para cuadrar macros..." />
                </div>

                <div class="row-between">
                  <span style="font-size:11px; color:var(--text-muted); font-weight:650;">Saciedad / energía post-comida:</span>
                  <div class="satiety-row">
                    ${[1,2,3,4,5].map(n => `
                      <button class="sat-btn ${sat === n ? "active" : ""}" onclick="setSatiety('${day}', ${n})">${n}</button>
                    `).join("")}
                  </div>
                </div>

                <div class="row-between">
                  <button class="btn-secondary btn-sm" onclick="openRecipeSheet('${r.id}')">Preparación / Escalar</button>
                  <button class="btn-secondary btn-sm" onclick="openBatchAssignSheet('${r.id}')">Repetir en Batch ×2/3</button>
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");

      return `
        <div class="card-soft">
          <div class="row-between" style="margin-bottom:6px;">
            <div>
              <div class="card-title">Resumen Batch Cooking (L–V)</div>
              <div class="card-sub"><strong>5 tápers</strong> con <strong>${uniqueList.length} preparaciones</strong> (~${estBatchMins} min total)</div>
            </div>

    function handleCustomProductPhoto(key, inputEl) {
      const file = inputEl?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 260;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
          if (!state.customProductImages) state.customProductImages = {};
          state.customProductImages[key] = dataUrl;
          saveState();
          render();
          openProductDetailSheet(key);
          showToast("Foto del producto guardada");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function resetCustomProductPhoto(key) {
      if (state.customProductImages) {
        delete state.customProductImages[key];
        saveState();
        render();
        openProductDetailSheet(key);
        showToast("Foto REWE restaurada");
      }
    }

    function getAdaptiveTrainingPlan(m) {
      const tp = state.trainingProfile || DEFAULT_STATE.trainingProfile;
      const isFemale = m.sex === "F";
      const isHome = tp.location === "home";
      const days = [3, 4, 5].includes(Number(tp.daysPerWeek)) ? Number(tp.daysPerWeek) : 4;
      const level = ["beginner", "intermediate", "advanced"].includes(tp.level) ? tp.level : "intermediate";
      const userStyle = tp.style || "auto";

      // Resolve recommended style when "auto" is selected
      let effectiveStyle = userStyle;
      let autoReason = "";
      if (userStyle === "auto") {
        if (m.isIronDef) {
          effectiveStyle = "hybrid_pilates";
          autoReason = "Déficit de hierro activo: priorizamos fuerza moderada + Pilates y cardio suave Zona 1–2 sin HIIT extenuante para evitar picos de hepcidina y fatiga.";
        } else if (m.goal === "hypertrophy") {
          effectiveStyle = "strength";
          autoReason = "Meta hipertrofia: sobrecarga progresiva en fuerza para maximizar síntesis proteica y ganancia de masa magra.";
        } else if (m.isPCOS || m.isIR || m.isDiabetes) {
          effectiveStyle = "strength";
          autoReason = "Enfoque metabólico (SOP / IR / Diabetes): el músculo esquelético es el mayor captador de glucosa; priorizamos fuerza multiarticular + caminatas post-comida.";
        } else {
          effectiveStyle = "hybrid_pilates";
          autoReason = "Evidencia actual para pérdida de grasa / tonificación y mantenimiento: enfoque híbrido de Fuerza (músculo, BMR y densidad ósea) + Pilates (core profundo, postura y salud articular).";
        }
      }

      // Sets, reps, rest & intensity based on sex, goal, level and iron deficiency
      const baseSets = level === "beginner" ? 2 : (level === "advanced" ? 4 : 3);
      const setsCompound = m.isIronDef ? Math.min(baseSets, 3) : baseSets;
      const setsAccessory = m.isIronDef ? 2 : Math.max(2, baseSets);

      let repRangeCompound = isFemale ? "8–12 reps" : "6–10 reps";

        { name: isFemale ? "Hip Thrust en máquina/banco" : "Press inclinado en máquina o mancuernas", scheme: `${setsCompound}×${repRangeAccessory} · ${restMain}` },
        { name: "Remo en polea baja (control postural)", scheme: `${setsAccessory}×${repRangeAccessory} · 60 s` },
        { name: "Plancha frontal + respiración diafragmática", scheme: `${setsAccessory}×40 s · 45 s` }
      ] : [
        { name: "Peso muerto rumano con mancuernas", scheme: `${setsCompound}×${repRangeCompound} · ${restMain}` },
        { name: "Press pecho en máquina o mancuernas", scheme: `${setsCompound}×${repRangeCompound} · ${restMain}` },
        { name: "Zancada atrás en multipower o mancuernas", scheme: `${setsCompound}×${repRangeAccessory} · ${restMain}` },
        { name: "Face pull + elevaciones laterales suaves", scheme: `${setsAccessory}×12–15 reps · 60 s` },
        { name: "Pallof press en polea", scheme: `${setsAccessory}×12/lado · 45 s` }
      ]);

      const buildPilatesSession = (focus = "core") => focus === "sculpt" ? [
        { name: "Respiración costal + activación transverso/suelo pélvico", scheme: `5 min · control` },
        { name: "Puente articulado de columna + marchas de cadera", scheme: `3×12 reps · ${restPilates}` },
        { name: "Serie lateral de glúteo medio (Clamshell + elevaciones)", scheme: `3×15/lado · ${restPilates}` },
        { name: "Pilates Push-up + tríceps con mancuernas ligeras (1–3 kg)", scheme: `3×10–12 reps · ${restPilates}` },
        { name: "Hundred adaptado + Criss-Cross controlado", scheme: `3×40 s · ${restPilates}` },
        { name: "Swan Dive (extensión dorsal) + estiramiento de cadera", scheme: `2×10 reps · movilidad` }
      ] : [
        { name: "Activación de core profundo (Imprint & Dead Bug)", scheme: `3×10/lado · ${restPilates}` },
        { name: "Single Leg Stretch + Double Leg Stretch", scheme: `3×12 reps · ${restPilates}` },
        { name: "Shoulder Bridge (puente glúteo articulado)", scheme: `3×12 reps · ${restPilates}` },
        { name: "Swimming (cadena posterior y postura lumbar)", scheme: `3×35 s · ${restPilates}` },
        { name: "Side Plank + rotación torácica controlada", scheme: `2×30 s/lado · ${restPilates}` },
        { name: "Cat-Cow + apertura torácica y flexores de cadera", scheme: `5 min · descarga` }
      ];

      const buildCardioZone2 = () => [
        { name: m.isIronDef ? "Caminata suave / bici estática ritmo conversacional" : "Caminata rápida inclinada, natación o bici Zona 2", scheme: m.isIronDef ? "20–30 min · RPE 5" : "35–45 min · Zona 2" },
        { name: m.glycemicControl ? "O dividir en 2 caminatas de 15 min tras comidas principales" : "Movilidad articular de cadera, hombros y tobillo", scheme: "10–15 min · suave" },
        { name: "Core suave: plancha frontal + estiramientos", scheme: "2×35 s · recuperación" }
      ];

      // Build weekly schedule based on effectiveStyle and daysPerWeek (3, 4, 5)
      let schedule = [];
      if (effectiveStyle === "strength") {
        if (days === 3) {
          schedule = [
            { id: "d1", dayLabel: "Día 1 (Lun)", title: "Full Body A · Fuerza Multiarticular", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildFullBody(1) },
            { id: "d2", dayLabel: "Día 2 (Mié)", title: "Full Body B · Glúteo, Espalda y Core", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildFullBody(2) },
            { id: "d3", dayLabel: "Día 3 (Vie)", title: "Tren Inferior + Tren Superior Equilibrado", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 50, exercises: buildLowerStrength() }
          ];
        } else if (days === 4) {
          schedule = [
            { id: "d1", dayLabel: "Día 1 (Lun)", title: isFemale ? "Tren Inferior · Glúteo y Cadena Posterior" : "Tren Inferior · Fuerza Compuesta", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 50, exercises: buildLowerStrength() },
            { id: "d2", dayLabel: "Día 2 (Mar)", title: "Tren Superior · Espalda, Pecho y Postura", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildUpperStrength() },
            { id: "d3", dayLabel: "Día 3 (Jue)", title: "Full Body Metabólico + Core Profundo", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildFullBody(1) },
            { id: "d4", dayLabel: "Día 4 (Sáb)", title: (m.isPCOS || m.isIR || m.isDiabetes) ? "Zona 2 / Natación + Movilidad Glucémica" : "Full Body B · Progresión y Estabilidad", type: (m.isPCOS || m.isIR || m.isDiabetes) ? "Caminata post-comida / Zona 2" : (isHome ? "Fuerza en casa" : "Fuerza (Gym)"), badge: (m.isPCOS || m.isIR || m.isDiabetes) ? "Zona 2" : "Fuerza", mins: 40, exercises: (m.isPCOS || m.isIR || m.isDiabetes) ? buildCardioZone2() : buildFullBody(2) }
          ];
        } else {
          schedule = [
            { id: "d1", dayLabel: "Día 1 (Lun)", title: isFemale ? "Tren Inferior A · Glúteo y Cuádriceps" : "Tren Inferior A · Fuerza Base", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 50, exercises: buildLowerStrength() },
            { id: "d2", dayLabel: "Día 2 (Mar)", title: "Tren Superior A · Tracción y Empuje", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildUpperStrength() },
            { id: "d3", dayLabel: "Día 3 (Mié)", title: "Recuperación Activa · Zona 2 o Pilates Core", type: "Pilates / Tonificación", badge: "Core / Zona 2", mins: 35, exercises: buildPilatesSession("core") },
            { id: "d4", dayLabel: "Día 4 (Vie)", title: "Full Body Progresivo · Sobrecarga", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 50, exercises: buildFullBody(2) },
            { id: "d5", dayLabel: "Día 5 (Sáb)", title: "Zona 2 / Natación + Movilidad", type: "Natación", badge: "Zona 2", mins: 40, exercises: buildCardioZone2() }
          ];
        }
      } else if (effectiveStyle === "hybrid_pilates") {
        if (days === 3) {
          schedule = [
            { id: "d1", dayLabel: "Día 1 (Lun)", title: "Fuerza Full Body · Músculo y Densidad Ósea", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildFullBody(1) },
            { id: "d2", dayLabel: "Día 2 (Mié)", title: "Pilates Tonificación · Core Profundo y Postura", type: "Pilates / Tonificación", badge: "Pilates", mins: 40, exercises: buildPilatesSession("sculpt") },
            { id: "d3", dayLabel: "Día 3 (Vie)", title: "Fuerza Tren Inferior + Espalda", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildFullBody(2) }
          ];
        } else if (days === 4) {
          schedule = [
            { id: "d1", dayLabel: "Día 1 (Lun)", title: "Fuerza Tren Inferior & Glúteo", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildLowerStrength() },
            { id: "d2", dayLabel: "Día 2 (Mié)", title: "Pilates Core & Suelo Pélvico", type: "Pilates / Tonificación", badge: "Pilates", mins: 40, exercises: buildPilatesSession("core") },
            { id: "d3", dayLabel: "Día 3 (Jue)", title: "Fuerza Tren Superior & Postura", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildUpperStrength() },
            { id: "d4", dayLabel: "Día 4 (Sáb)", title: "Pilates Sculpt + Caminata Zona 2", type: "Pilates / Tonificación", badge: "Pilates + Z2", mins: 40, exercises: buildPilatesSession("sculpt") }
          ];
        } else {
          schedule = [
            { id: "d1", dayLabel: "Día 1 (Lun)", title: "Fuerza Tren Inferior", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildLowerStrength() },
            { id: "d2", dayLabel: "Día 2 (Mar)", title: "Pilates Core & Movilidad Espinal", type: "Pilates / Tonificación", badge: "Pilates", mins: 35, exercises: buildPilatesSession("core") },
            { id: "d3", dayLabel: "Día 3 (Jue)", title: "Fuerza Tren Superior", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildUpperStrength() },
            { id: "d4", dayLabel: "Día 4 (Vie)", title: "Pilates Tonificación (Glúteo y Brazos)", type: "Pilates / Tonificación", badge: "Pilates", mins: 40, exercises: buildPilatesSession("sculpt") },
            { id: "d5", dayLabel: "Día 5 (Dom)", title: "Zona 2 / Natación Suave", type: "Caminata post-comida / Zona 2", badge: "Zona 2", mins: 35, exercises: buildCardioZone2() }
          ];
        }
      } else if (effectiveStyle === "pilates_tone") {
        const basePilates = [
          { id: "d1", dayLabel: "Día 1 (Lun)", title: "Pilates Core Profundo & Alineación", type: "Pilates / Tonificación", badge: "Pilates", mins: 40, exercises: buildPilatesSession("core") },
          { id: "d2", dayLabel: "Día 2 (Mié)", title: "Pilates Sculpt · Glúteo, Pierna y Brazos", type: "Pilates / Tonificación", badge: "Tonificación", mins: 40, exercises: buildPilatesSession("sculpt") },
          { id: "d3", dayLabel: "Día 3 (Vie)", title: "Fuerza Ligera / Carga Ósea + Core", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza base", mins: 40, exercises: buildFullBody(1) },
          { id: "d4", dayLabel: "Día 4 (Sáb)", title: "Zona 2 · Caminata Activa o Natación", type: "Caminata post-comida / Zona 2", badge: "Zona 2", mins: 35, exercises: buildCardioZone2() },
          { id: "d5", dayLabel: "Día 5 (Dom)", title: "Pilates Movilidad & Descarga Postural", type: "Pilates / Tonificación", badge: "Movilidad", mins: 30, exercises: buildPilatesSession("core") }
        ];
        schedule = basePilates.slice(0, days);
      } else {
        // cardio_mix
        const baseMix = [
          { id: "d1", dayLabel: "Día 1 (Lun)", title: "Fuerza Full Body A", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildFullBody(1) },
          { id: "d2", dayLabel: "Día 2 (Mar)", title: "Natación / Cardio Zona 2", type: "Natación", badge: "Zona 2", mins: 40, exercises: buildCardioZone2() },
          { id: "d3", dayLabel: "Día 3 (Jue)", title: "Fuerza Full Body B", type: isHome ? "Fuerza en casa" : "Fuerza (Gym)", badge: "Fuerza", mins: 45, exercises: buildFullBody(2) },
          { id: "d4", dayLabel: "Día 4 (Sáb)", title: "Caminata Activa / Cardio + Core", type: "Caminata post-comida / Zona 2", badge: "Cardio", mins: 40, exercises: buildCardioZone2() },
          { id: "d5", dayLabel: "Día 5 (Dom)", title: "Pilates & Movilidad de Recuperación", type: "Pilates / Tonificación", badge: "Movilidad", mins: 35, exercises: buildPilatesSession("core") }
        ];
        schedule = baseMix.slice(0, days);
      }

      // Science / deep research notes customized by biological sex & clinical conditions
      const sexScience = isFemale
        ? {
            title: "Fisiología Femenina aplicada a tu plan",
            points: [
              "<strong>Metabolismo de sustratos:</strong> durante el ejercicio submáximo, las mujeres oxidan una mayor proporción de <strong>grasas</strong> (ahorrando glucógeno muscular gracias al estrógeno).",
              "<strong>Mayor resistencia a la fatiga y descansos cortos:</strong> la recuperación entre series suele ser más rápida (menor acumulación de lactato), haciendo muy eficaces descansos de <strong>60–90 s</strong> y rangos de 8–15 repeticiones.",
              "<strong>Salud ósea y energía:</strong> la carga de fuerza protege la densidad mineral ósea; en días de mayor fatiga menstrual o fase lútea tardía, reduce 1–2 puntos el RPE sin culpa y evita déficits extremos (riesgo RED-S)."
            ]
          }
        : {
            title: "Fisiología Masculina aplicada a tu plan",
            points: [
              "<strong>Metabolismo glucolítico y carga absoluta:</strong> a igual carga relativa suele haber mayor uso de glucógeno y mayor tensión mecánica absoluta por serie.",
              "<strong>Descansos y daño muscular (CK/DOMS):</strong> los ejercicios multiarticulares pesados producen mayor microdaño estructural; descansos de <strong>90–150 s</strong> mantienen la calidad técnica y la fuerza entre series.",
              "<strong>Respuesta metabólica:</strong> combinar fuerza progresiva (6–12 reps) con cardio Zona 2 optimiza la sensibilidad a la insulina y la reducción de grasa visceral preservando masa magra."
            ]
          };

      const clinicalScience = [];
      if (m.isPCOS) {
        clinicalScience.push({
          title: "SOP (PCOS) · Guía Internacional",
          text: "El músculo esquelético capta glucosa incluso sin picos de insulina. Se recomiendan al menos <strong>2 días no consecutivos de fuerza</strong> + 150–300 min/sem de actividad moderada sostenible. No es obligatorio hacer HIIT extremo diario si te eleva fatiga o estrés."
        });
      }
      if (m.isIR) {
        clinicalScience.push({
          title: "Resistencia a la Insulina · Activación GLUT4",
          text: "Priorizar ejercicios multiarticulares grandes (piernas, espalda) y añadir <strong>10–15 min de caminata suave tras el almuerzo o cena</strong> mejora directamente la entrada de glucosa al músculo."
        });
      }
      if (m.isDiabetes) {
        clinicalScience.push({
          title: "Diabetes · Estándares ADA",
          text: "Combina 2–3 sesiones/sem de fuerza no consecutivas con aeróbico regular <strong>sin pasar más de 2 días seguidos sin entrenar</strong>. Caminar 10–15 min entre 15 y 45 min después de comer y levantarte 3 min cada 30 min sentado amortigua los picos glucémicos."
        });
      }
      if (m.isIronDef) {
        clinicalScience.push({
          title: "Déficit de Hierro · Protección y Hepcidina",
          text: "Con ferritina o hemoglobina bajas cae el transporte de oxígeno. Mantén <strong>RPE 5–6/10</strong>, descansos amplios y pausa el HIIT extenuante (los entrenos muy inflamatorios elevan la <strong>hepcidina</strong>, que bloquea temporalmente la absorción de hierro). Detente si notas mareo o palpitaciones."
        });
      }
      if (!clinicalScience.length) {
        clinicalScience.push({
          title: effectiveStyle === "hybrid_pilates" || effectiveStyle === "pilates_tone"
            ? "Fuerza + Pilates · Enfoque Híbrido Actual"
            : "Sobrecarga Progresiva & Longevidad",
          text: "La evidencia actual muestra que la <strong>fuerza progresiva</strong> es el estándar de oro para masa muscular, gasto basal y hueso, mientras que el <strong>Pilates</strong> sobresale en core profundo, postura y longevidad articular. Combinarlos ofrece los mejores resultados estéticos y funcionales."
        });
      }

      const styleTitleMap = {
        strength: (m.isPCOS || m.isIR || m.isDiabetes) ? "Fuerza Metabólica + Zona 2" : "Fuerza & Hipertrofia Progresiva",
        hybrid_pilates: m.isIronDef ? "Plan Suave: Fuerza Moderada + Pilates" : "Híbrido: Fuerza + Pilates & Tonificación",
        pilates_tone: "Pilates, Core & Tonificación Suave",
        cardio_mix: "Fuerza + Natación / Cardio Zona 2"
      };

      return {
        userStyle,
        effectiveStyle,
        planTitle: styleTitleMap[effectiveStyle] || "Plan Adaptativo",
        autoReason,
        days,
        location: tp.location || "gym",
        level,
        repRangeCompound,
        restMain,
        rpeLabel,
        intensityText,
        cardioTarget,
        schedule,
        sexScience,
        clinicalScience
      };
    }

    function renderEntreno(container) {
      const m = getAdaptiveNutritionMetrics();

      const completedMap = state.trainingProfile?.completedPlanDays || {};
      const doneCount = plan.schedule.filter(d => Boolean(completedMap[d.id])).length;
      const weekPct = plan.schedule.length ? Math.round((doneCount / plan.schedule.length) * 100) : 0;

      const activeConds = state.clinicalProfile.conditions || [];
      const sexLabel = m.sex === "M" ? "Hombre" : "Mujer";
      const condSummary = activeConds.length
        ? activeConds.map(c => CLINICAL_CONDITION_META[c]?.short).filter(Boolean).join(" + ")
        : "General";

              <button class="btn-secondary btn-sm" onclick="logPlannedWorkoutToday('${day.id}')">+ Registrar hoy</button>
            </div>

      }).join("");

      container.innerHTML = `

            <div class="row-between" style="margin-bottom:6px;">
              <div>
                <div class="card-title">🏋️ Motor de Entrenamiento Adaptativo</div>

                  <button class="chip ${plan.userStyle === st.id ? "active" : ""}" onclick="setTrainingStyle('${st.id}')">${st.id === "auto" ? "✨ " : ""}${st.label}</button>

            <div style="margin-bottom:10px;">
              <label>Nivel de experiencia</label>
              <div class="seg-control cols-3">

            <div class="goal-box">

                  <div style="font-size:12px; font-weight:800; color:var(--text-main);">${plan.repRangeCompound}</div>

                  <div style="font-size:12px; font-weight:800; color:var(--rose-dark);">${plan.restMain}</div>
                  <div style="font-size:9.5px; color:var(--text-soft);">Descanso series</div>
