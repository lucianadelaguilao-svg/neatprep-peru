<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F9E8EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NeatPrep" />
  <title>NeatPrep &amp; NutriTrack</title>
  <style>
    :root {
      --bg-app: #FDF7F9;
      --bg-surface: #FFFFFF;
      --bg-soft: #FCEEF3;
      --bg-tint: #F8E2EA;
      --border: #F2D6E0;
      --border-strong: #E4B8C8;
      --text-main: #2A1920;
      --text-muted: #6E525D;
      --text-soft: #967783;
      --rose: #D45B84;
      --rose-dark: #B5436A;
      --rose-light: #FDF0F5;
      --rose-badge-bg: #FBE3EC;
      --rose-badge-text: #A8375E;
      --mint-bg: #E8F6F0;
      --mint-text: #1E6B4E;
      --amber-bg: #FFF4E2;
      --amber-text: #8F560A;
      --danger-bg: #FDECEC;
      --danger-text: #A62626;
      --shadow-sm: 0 2px 10px rgba(180, 67, 106, 0.06);
      --shadow-md: 0 8px 24px rgba(180, 67, 106, 0.10);
      --radius-xl: 22px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --radius-pill: 999px;
      --nav-height: 70px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F4E4EA;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .phone-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(74, 24, 43, 0.14);
    }

    @media (min-width: 520px) {
      body {
        padding: 16px;
        align-items: center;
      }
      .phone-shell {
        height: min(900px, calc(100dvh - 32px));
        border-radius: 36px;
        border: 6px solid #3B232C;
      }
    }

    /* Top Header */
    .topbar {
      background: rgba(253, 247, 249, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      z-index: 20;
      flex-shrink: 0;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, #E3789C, var(--rose-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(181, 67, 106, 0.24);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 750;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-status {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--rose-badge-text);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .macro-strip {
      margin-top: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }

    .macro-item-val {
      font-size: 12.5px;
      font-weight: 750;
      color: var(--text-main);
    }

    .macro-item-lbl {
      font-size: 10px;
      color: var(--text-soft);
    }

    /* Main Scroll Area */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
      scroll-behavior: smooth;
    }

    .section-gap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 750;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .card-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 0;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Buttons & Chips */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    .btn-primary {
      background: var(--rose);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(212, 91, 132, 0.25);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: var(--rose-dark);
    }

    .btn-secondary {
      background: var(--bg-soft);
      color: var(--rose-badge-text);
      border: 1px solid var(--border-strong);
      font-weight: 700;
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary:active {
      background: var(--bg-tint);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      font-weight: 650;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 11.5px;
      border-radius: var(--radius-sm);
    }

    .chip-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 650;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chip.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--rose-badge-bg);
      color: var(--rose-badge-text);
    }

    .badge-mint {
      background: var(--mint-bg);
      color: var(--mint-text);
    }

    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    /* Recipe Cards */
    .recipe-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recipe-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .recipe-title {
      font-size: 14.5px;
      font-weight: 750;
      margin: 0;
    }

    .recipe-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    .recipe-price {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--rose-dark);
      white-space: nowrap;
    }

    .macros-line {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-soft);
      padding: 6px 9px;
      border-radius: var(--radius-sm);
    }

    /* Form Controls */
    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(212, 91, 132, 0.14);
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    /* Check List */
    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
    }

    .check-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
    }

    .check-item.done .check-box {
      background: var(--rose);
      border-color: var(--rose);
    }

    .check-item.done .check-label {
      text-decoration: line-through;
      color: var(--text-soft);
    }

    .check-label {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress Bar */
    .progress-track {
      height: 8px;
      background: var(--bg-tint);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #E3789C, var(--rose-dark));
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    /* Bottom Navigation */
    .bottom-nav {
      height: var(--nav-height);
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      flex-shrink: 0;
      z-index: 20;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 650;
      color: var(--text-soft);
      padding: 4px 2px;
    }

    .nav-btn.active {
      color: var(--rose-dark);
      font-weight: 800;
    }

    .nav-icon {
      font-size: 16px;
      line-height: 1.1;
    }

    /* Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 25, 32, 0.42);
      backdrop-filter: blur(2px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-width: 440px;
      max-height: 86dvh;
      background: var(--bg-app);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .sheet-header {
      padding: 10px 16px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-strong);
      margin: 0 auto 10px;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      position: fixed;
      bottom: calc(var(--nav-height) + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #2A1920;
      color: #fff;
      font-size: 12.5px;
      font-weight: 650;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 80;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-note {
      text-align: center;
      padding: 20px 12px;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--bg-soft);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-strong);
    }
  </style>
</head>

  <!-- Bottom Sheet -->

          <strong id="sheetTitle" style="font-size:15px;">Detalle</strong>
          <button class="btn-ghost" onclick="closeSheet()">✕ Cerrar</button>
        </div>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          prices: { ...JSON.parse(JSON.stringify(DEFAULT_PRICES)), ...(parsed.prices || {}) },
          tapers: { ...DEFAULT_STATE.tapers, ...(parsed.tapers || {}) },
          targets: { ...DEFAULT_STATE.targets, ...(parsed.targets || {}) },
          bodyProfile: { ...DEFAULT_STATE.bodyProfile, ...(parsed.bodyProfile || {}) }
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function fmtEur(val) {
      return Number(val || 0).toFixed(2).replace(".", ",") + " €";
    }

    function marketFactor() {
      if (state.supermarket === "ALDI") return 0.88;
      if (state.supermarket === "EDEKA") return 1.08;
      return 1.0;
    }

    function getUnitPrice(key) {
      const item = state.prices[key];
      if (!item) return 2.5;
      return item.price * marketFactor();
    }

    function getRecipeCost(recipe, servings = 1, excludePantry = true) {
      let total = 0;
      (recipe.ingredients || []).forEach(ing => {
        if (excludePantry && state.pantryKeys.includes(ing.key)) return;
        total += (ing.qty || 0) * servings * getUnitPrice(ing.key);
      });
      return total;
    }

    function getShoppingList() {
      const map = {};
      Object.values(state.tapers).forEach(recipeId => {
        const r = state.recipes.find(x => x.id === recipeId);
        if (!r) return;
        (r.ingredients || []).forEach(ing => {
          if (state.pantryKeys.includes(ing.key)) return;
          if (!map[ing.key]) {
            const meta = state.prices[ing.key] || { name: ing.key, unit: "ud", aisle: "Despensa", price: 2 };
            map[ing.key] = {
              key: ing.key,
              name: meta.name,
              unit: meta.unit,
              aisle: meta.aisle || "Despensa",
              qty: 0,
              unitPrice: getUnitPrice(ing.key)
            };
          }
          map[ing.key].qty += Number(ing.qty || 0);
        });
      });
      return Object.values(map).map(item => ({
        ...item,
        cost: item.qty * item.unitPrice
      }));
    }

    function getTotalShoppingCost() {
      return getShoppingList().reduce((sum, item) => sum + item.cost, 0);
    }

    function updateHeader() {
      const spent = getTotalShoppingCost();
      const pill = document.getElementById("headerBudgetPill");
      pill.textContent = `${fmtEur(spent)} / ${fmtEur(state.budget)}`;
      if (spent > state.budget) {
        pill.style.background = "var(--danger-bg)";
        pill.style.color = "var(--danger-text)";
      } else {
        pill.style.background = "var(--bg-soft)";
        pill.style.color = "var(--rose-badge-text)";
      }

      document.getElementById("headerSub").textContent = `${state.supermarket} · 5 tápers L–V`;

      const days = Object.keys(state.tapers);
      let avgKcal = 0, avgProt = 0, avgCarbs = 0, count = 0;
      days.forEach(d => {
        const r = state.recipes.find(x => x.id === state.tapers[d]);
        if (r) {
          avgKcal += r.kcal;
          avgProt += r.protein;
          avgCarbs += r.carbs;
          count++;
        }
      });
      if (count) {
        avgKcal = Math.round(avgKcal / count);
        avgProt = Math.round(avgProt / count);
        avgCarbs = Math.round(avgCarbs / count);
      }

      document.getElementById("headerMacroStrip").innerHTML = `
        <div>
          <div class="macro-item-val">${avgKcal} / ${state.targets.kcal} kcal</div>
          <div class="macro-item-lbl">Prom. táper vs meta</div>
        </div>
        <div>
          <div class="macro-item-val">${avgProt}g / ${state.targets.protein}g</div>
          <div class="macro-item-lbl">Proteína plato</div>
        </div>
        <div>
          <div class="macro-item-val">${avgCarbs}g · ≤${state.targets.carbsMax}g</div>
          <div class="macro-item-lbl">Carbos (IR control)</div>
        </div>
      `;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      render();
      document.getElementById("mainContent").scrollTop = 0;
    }

    function render() {
      updateHeader();
      const container = document.getElementById("mainContent");
      if (currentTab === "hoy") renderHoy(container);
      else if (currentTab === "recetas") renderRecetas(container);
      else if (currentTab === "tapers") renderTapers(container);
      else if (currentTab === "super") renderSuper(container);
      else if (currentTab === "progreso") renderProgreso(container);
      else if (currentTab === "cocina") renderCocina(container);
    }

      const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
      days.forEach((d, idx) => {
        state.tapers[d] = pool[idx % pool.length].id;
      });
      saveState();
      render();
      showToast("Tápers de lunes a viernes actualizados");
    }

      const list = getShoppingList();
      const totalCost = getTotalShoppingCost();
      const checkedCount = list.filter(i => state.checkedShopping[i.key]).length;
      const pct = list.length ? Math.round((checkedCount / list.length) * 100) : 0;

      const byAisle = {};
      list.forEach(item => {
        if (!byAisle[item.aisle]) byAisle[item.aisle] = [];

      });

      const aislesHtml = Object.keys(byAisle).map(aisle => `

          <div style="font-size:13px; font-weight:750; margin-bottom:8px; color:var(--rose-dark);">${aisle}</div>

            ${byAisle[aisle].map(item => {
              const done = Boolean(state.checkedShopping[item.key]);
              return `
                <div class="check-item ${done ? "done" : ""}" onclick="toggleShoppingItem('${item.key}')">
                  <div class="check-left">
                    <div class="check-box">${done ? "✓" : ""}</div>
                    <div>
                      <div class="check-label">${item.name}</div>
                      <div style="font-size:11px; color:var(--text-soft);">~${item.qty.toFixed(2)} ${item.unit} (${fmtEur(item.unitPrice)}/${item.unit})</div>
                    </div>
                  </div>
                  <strong style="font-size:12.5px;">${fmtEur(item.cost)}</strong>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `).join("");

      container.innerHTML = `
        <div class="section-gap">
          <div class="card">
            <div class="row-between" style="margin-bottom:8px;">
              <div>
                <div class="card-title">Lista del Súper · ${state.supermarket}</div>
                <div class="card-sub">Estimado ${fmtEur(totalCost)} frente a tu presupuesto de ${fmtEur(state.budget)}.</div>
              </div>
              <button class="btn-secondary btn-sm" onclick="openPriceEditorSheet()">Editar precios</button>
            </div>
            <div class="chip-row" style="margin-bottom:10px;">
              ${["ALDI", "REWE", "EDEKA"].map(m => `
                <button class="chip ${state.supermarket === m ? "active" : ""}" onclick="setMarket('${m}')">${m}</button>
              `).join("")}
            </div>
            <div class="row-between" style="font-size:11.5px; color:var(--text-muted); margin-bottom:5px;">
              <span>Progreso en tienda: ${checkedCount}/${list.length}</span>
              <span>${pct}%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
            <div style="font-size:11px; color:var(--text-soft); margin-top:8px;">
              * Calcula la porción usada en tus 5 tápers (excluyendo lo que ya tienes en casa). En caja el envase puede venir en formato estándar.
            </div>
          </div>
          ${aislesHtml || `<div class="empty-note">Todo cubierto con lo que ya tienes en casa.</div>`}
        </div>
      `;

    function setMarket(m) {
      state.supermarket = m;
      saveState();
      render();
      showToast(`Supermercado: ${m}`);
    }

    function toggleShoppingItem(key) {
      state.checkedShopping[key] = !state.checkedShopping[key];
      saveState();
      render();
    }

    /* ---------------- TAB 5: PROGRESO (BMI, DÉFICIT, PESO/GRASA, INSULINA, DEPORTE) ---------------- */
    function renderProgreso(container) {
      const latestW = state.weightLogs[state.weightLogs.length - 1] || { weight: 66.1, bodyFat: 27.4, date: "Hoy" };
      const heightM = Math.max(1.2, (Number(state.bodyProfile.heightCm) || 165) / 100);
      const bmi = Number(latestW.weight) / (heightM * heightM);
      let bmiCategory = "Normopeso";
      if (bmi < 18.5) bmiCategory = "Bajo peso";
      else if (bmi >= 25 && bmi < 30) bmiCategory = "Sobrepeso";
      else if (bmi >= 30) bmiCategory = "Obesidad";

      const leanMass = Number(latestW.weight) * (1 - (Number(latestW.bodyFat || 0) / 100));
      const fatMass = Number(latestW.weight) - leanMass;

      // Mifflin-St Jeor
      const sexOffset = state.bodyProfile.sex === "M" ? 5 : -161;
      const bmr = Math.round(10 * Number(latestW.weight) + 6.25 * Number(state.bodyProfile.heightCm || 165) - 5 * Number(state.bodyProfile.age || 22) + sexOffset);
      const tdee = Math.round(bmr * Number(state.bodyProfile.activity || 1.55));
      const deficitVal = Number(state.bodyProfile.deficit || 400);
      const targetKcal = Math.max(1200, tdee - deficitVal);
      const suggestedProt = Math.round(Number(latestW.weight) * 1.9);

      const medsDone = state.meds.filter(m => m.checked).length;

      container.innerHTML = `
        <div class="section-gap">
          <!-- BMI & Déficit Calórico -->
          <div class="card">
            <div class="row-between" style="margin-bottom:6px;">
              <div>
                <div class="card-title">BMI &amp; Déficit Calórico</div>
                <div class="card-sub">Cálculo dinámico con tu peso actual (${latestW.weight} kg) y actividad.</div>
              </div>
              <span class="badge">${bmi.toFixed(1)} · ${bmiCategory}</span>
            </div>

            <div class="grid-3" style="margin:10px 0;">
              <div class="card-soft" style="padding:9px; text-align:center;">
                <div style="font-size:15px; font-weight:800; color:var(--rose-dark);">${bmi.toFixed(1)}</div>
                <div style="font-size:10.5px; color:var(--text-muted);">BMI (IMC)</div>
              </div>
              <div class="card-soft" style="padding:9px; text-align:center;">
                <div style="font-size:15px; font-weight:800;">${tdee}</div>
                <div style="font-size:10.5px; color:var(--text-muted);">TDEE (kcal)</div>
              </div>
              <div class="card-soft" style="padding:9px; text-align:center;">
                <div style="font-size:15px; font-weight:800; color:var(--mint-text);">${targetKcal}</div>
                <div style="font-size:10.5px; color:var(--text-muted);">Meta (-${deficitVal})</div>
              </div>
            </div>

            <div class="grid-2">
              <div>
                <label>Estatura (cm)</label>
                <input type="number" id="bpHeight" value="${state.bodyProfile.heightCm}" onchange="updateBodyProfile()" />
              </div>
              <div>
                <label>Edad (años)</label>
                <input type="number" id="bpAge" value="${state.bodyProfile.age}" onchange="updateBodyProfile()" />
              </div>
              <div>
                <label>Actividad semanal</label>
                <select id="bpActivity" onchange="updateBodyProfile()">
                  <option value="1.375" ${state.bodyProfile.activity == 1.375 ? "selected" : ""}>Ligera (1–2 días)</option>
                  <option value="1.55" ${state.bodyProfile.activity == 1.55 ? "selected" : ""}>Moderada (3–5 días)</option>
                  <option value="1.725" ${state.bodyProfile.activity == 1.725 ? "selected" : ""}>Alta (6–7 días / fuerza + natación)</option>
                </select>
              </div>
              <div>
                <label>Déficit calórico</label>
                <select id="bpDeficit" onchange="updateBodyProfile()">
                  <option value="300" ${state.bodyProfile.deficit == 300 ? "selected" : ""}>Suave (-300 kcal/día)</option>
                  <option value="400" ${state.bodyProfile.deficit == 400 ? "selected" : ""}>Moderado (-400 kcal/día)</option>
                  <option value="500" ${state.bodyProfile.deficit == 500 ? "selected" : ""}>Sostenido (-500 kcal/día)</option>
                </select>
              </div>
            </div>

            <div style="margin-top:10px; font-size:11.5px; color:var(--text-muted);">
              Proteína sugerida: <strong>~${suggestedProt} g/día</strong> · Masa magra estimada: <strong>${leanMass.toFixed(1)} kg</strong> · Masa grasa: <strong>${fatMass.toFixed(1)} kg</strong>.
            </div>
            <button class="btn-primary" style="width:100%; margin-top:10px;" onclick="applyCalculatedTargets(${targetKcal}, ${suggestedProt})">
              Aplicar ${targetKcal} kcal y ${suggestedProt}g prot a mi plan
            </button>
          </div>

          <!-- Peso y % Grasa -->
          <div class="card">
            <div class="row-between" style="margin-bottom:8px;">
              <div>
                <div class="card-title">Peso &amp; % Grasa Corporal</div>
                <div class="card-sub">Último registro: <strong>${latestW.weight} kg</strong> · <strong>${latestW.bodyFat}% grasa</strong></div>
              </div>
              <button class="btn-secondary btn-sm" onclick="openWeightLogSheet()">+ Registrar</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              ${state.weightLogs.slice().reverse().slice(0, 5).map(w => `
                <div class="row-between" style="padding:7px 10px; background:var(--bg-soft); border-radius:var(--radius-sm); font-size:12.5px;">
                  <span>${w.date}</span>
                  <strong>${w.weight} kg</strong>
                  <span class="badge">${w.bodyFat}% grasa</span>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Resistencia a la Insulina -->
          <div class="card">
            <div class="row-between" style="margin-bottom:8px;">
              <div>
                <div class="card-title">Resistencia a la Insulina</div>
                <div class="card-sub">Adherencia diaria: ${medsDone}/${state.meds.length}</div>
              </div>
              <button class="btn-secondary btn-sm" onclick="openAddMedSheet()">+ Toma</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:7px; margin-bottom:10px;">
              ${state.meds.map(m => `
                <div class="check-item ${m.checked ? "done" : ""}" onclick="toggleMed('${m.id}')">
                  <div class="check-left">
                    <div class="check-box">${m.checked ? "✓" : ""}</div>
                    <div>
                      <div class="check-label">${m.name}</div>
                      <div style="font-size:11px; color:var(--text-soft);">${m.dose}</div>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
            <label>Nota clínica / glucemia / energía</label>
            <input type="text" value="${escapeAttr(state.glucoseNote || "")}" onchange="updateGlucoseNote(this.value)" placeholder="Ej. Ayunas 88 mg/dL, sin picos de hambre..." />
          </div>

          <!-- Deporte Diario -->
          <div class="card">
            <div class="row-between" style="margin-bottom:8px;">
              <div>
                <div class="card-title">Deporte &amp; Entrenamiento</div>
                <div class="card-sub">Registro rápido de fuerza, natación o cardio.</div>
              </div>
              <button class="btn-primary btn-sm" onclick="openAddWorkoutSheet()">+ Sesión</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              ${state.workouts.slice().reverse().slice(0, 5).map(wo => `
                <div class="row-between" style="padding:8px 10px; background:var(--bg-soft); border-radius:var(--radius-sm); font-size:12.5px;">
                  <div>
                    <strong>${wo.type}</strong>
                    <div style="font-size:11px; color:var(--text-muted);">${wo.date} · Intensidad ${wo.intensity}</div>
                  </div>
                  <span class="badge badge-mint">${wo.minutes} min</span>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function updateBodyProfile() {
      state.bodyProfile.heightCm = Number(document.getElementById("bpHeight").value) || 165;
      state.bodyProfile.age = Number(document.getElementById("bpAge").value) || 22;
      state.bodyProfile.activity = Number(document.getElementById("bpActivity").value) || 1.55;
      state.bodyProfile.deficit = Number(document.getElementById("bpDeficit").value) || 400;
      saveState();
      render();
    }

    function applyCalculatedTargets(kcal, prot) {
      state.targets.kcal = kcal;
      state.targets.protein = prot;
      saveState();
      updateHeader();
      showToast(`Metas aplicadas: ${kcal} kcal · ${prot}g proteína`);
    }

    function toggleMed(id) {
      const item = state.meds.find(m => m.id === id);
      if (item) {
        item.checked = !item.checked;
        saveState();
        render();
      }
    }

    function updateGlucoseNote(val) {
      state.glucoseNote = val;
      saveState();
    }

        { id: "sarten", label: "Sartén" },
        { id: "olla", label: "Olla" },

          </div>
        </div>

    function updateBudget(val) {
      state.budget = Math.max(10, Number(val) || 45);
      saveState();
      updateHeader();
    }

    function updateTargetKcal(val) {
      state.targets.kcal = Math.max(1000, Number(val) || 1650);
      saveState();
      updateHeader();
    }

    function toggleAppliance(id) {
      if (state.appliances.includes(id)) {
        state.appliances = state.appliances.filter(x => x !== id);
      } else {
        state.appliances.push(id);
      }
      saveState();
      render();
    }

    function togglePantry(key) {
      if (state.pantryKeys.includes(key)) {
        state.pantryKeys = state.pantryKeys.filter(x => x !== key);
      } else {
        state.pantryKeys.push(key);
      }
      saveState();
      render();
    }

    function resetDemoData() {
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      render();
      showToast("Datos restablecidos");
    }

      document.getElementById("sheetBackdrop").classList.remove("open");

    function saveTikTokRecipe() {
      const title = document.getElementById("ttTitle").value.trim();
      if (!title) {
        showToast("Escribe el nombre de la receta");
        return;
      }
      const key = document.getElementById("ttIngKey").value;
      const meta = state.prices[key] || { unit: "kg" };
      const qty = meta.unit === "kg" ? 0.18 : (meta.unit === "L" ? 0.01 : 1);

      const newRecipe = {
        id: "tt_" + Date.now(),
        title,
        category: document.getElementById("ttCat").value,
        timeMin: Number(document.getElementById("ttTime").value) || 15,
        quickToday: true,
        taperFriendly: true,
        taperTip: "Guarda en táper hermético y ajusta porciones según tu meta calórica.",
        appliances: ["sarten"],
        kcal: Number(document.getElementById("ttKcal").value) || 400,
        protein: Number(document.getElementById("ttProt").value) || 35,
        carbs: Number(document.getElementById("ttCarb").value) || 28,
        fat: 12,
        tiktokUrl: document.getElementById("ttUrl").value.trim(),
        ingredients: [{ key, qty, label: `${title} (${meta.name})` }],
        steps: [document.getElementById("ttNotes").value.trim() || "Preparar según receta del video de TikTok."]
      };

      state.recipes.unshift(newRecipe);
      saveState();
      closeSheet();
      render();
      showToast("Receta TikTok Fit guardada");
    }

      saveState();

      const last = state.weightLogs[state.weightLogs.length - 1] || { weight: 66, bodyFat: 27 };
      openSheet("Registrar peso y % grasa", `
        <div>
          <label>Fecha</label>
          <input type="date" id="wlDate" value="${today}" />
        </div>
        <div class="grid-2">
          <div>
            <label>Peso (kg)</label>
            <input type="number" step="0.1" id="wlWeight" value="${last.weight}" />
          </div>
          <div>
            <label>% Grasa corporal</label>
            <input type="number" step="0.1" id="wlFat" value="${last.bodyFat}" />
          </div>
        </div>
        <button class="btn-primary" onclick="saveWeightLog()">Guardar registro</button>
      `);
    }

    function saveWeightLog() {
      const date = document.getElementById("wlDate").value || new Date().toISOString().slice(0, 10);
      const weight = Number(document.getElementById("wlWeight").value);
      const bodyFat = Number(document.getElementById("wlFat").value);
      if (!weight || weight <= 20) return;
      state.weightLogs.push({ id: "w_" + Date.now(), date, weight, bodyFat: isNaN(bodyFat) ? 0 : bodyFat });
      saveState();
      closeSheet();
      render();
      showToast("Peso y % grasa guardados");
    }

    function openAddMedSheet() {
      openSheet("Añadir toma / tratamiento", `
        <div>
          <label>Nombre (fármaco o suplemento)</label>
          <input type="text" id="medName" placeholder="Ej. Vitamina D3 / Inositol" />
        </div>
        <div>
          <label>Dosis y momento del día</label>
          <input type="text" id="medDose" placeholder="Ej. 2000 UI · con el almuerzo" />
        </div>
        <button class="btn-primary" onclick="saveMed()">Agregar toma</button>
      `);
    }

    function saveMed() {
      const name = document.getElementById("medName").value.trim();
      if (!name) return;
      const dose = document.getElementById("medDose").value.trim() || "Diario";
      state.meds.push({ id: "m_" + Date.now(), name, dose, checked: false });
      saveState();
      closeSheet();
      render();
      showToast("Toma agregada");
    }

    function openAddWorkoutSheet() {
      const today = new Date().toISOString().slice(0, 10);
      openSheet("Registrar sesión deportiva", `
        <div>
          <label>Tipo de entrenamiento</label>
          <select id="woType">
            <option value="Fuerza (Gym)">Fuerza (Gym)</option>
            <option value="Natación">Natación</option>
            <option value="Caminata / Cardio">Caminata / Cardio</option>
          </select>
        </div>
        <div class="grid-2">
          <div>
            <label>Duración (min)</label>
            <input type="number" id="woMin" value="45" />
          </div>
          <div>
            <label>Intensidad</label>
            <select id="woInt">
              <option value="Moderada">Moderada</option>
              <option value="Alta">Alta</option>
              <option value="Suave">Suave</option>
            </select>
          </div>
        </div>
        <div>
          <label>Fecha</label>
          <input type="date" id="woDate" value="${today}" />
        </div>
        <button class="btn-primary" onclick="saveWorkout()">Guardar sesión</button>
      `);
    }

    function saveWorkout() {
      const type = document.getElementById("woType").value;
      const minutes = Number(document.getElementById("woMin").value) || 30;
      const intensity = document.getElementById("woInt").value;
      const date = document.getElementById("woDate").value || new Date().toISOString().slice(0, 10);
      state.workouts.push({ id: "wo_" + Date.now(), type, minutes, intensity, date });
      saveState();
      closeSheet();
      render();
      showToast("Sesión deportiva registrada");
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    render();
  </script>
</body>
</html>
