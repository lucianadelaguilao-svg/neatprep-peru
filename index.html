<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F9E8EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NeatPrep" />
  <title>NeatPrep &amp; NutriTrack</title>
  <style>
    :root {
      --bg-app: #FDF7F9;
      --bg-surface: #FFFFFF;
      --bg-soft: #FCEEF3;
      --bg-tint: #F8E2EA;
      --border: #F2D6E0;
      --border-strong: #E4B8C8;
      --text-main: #2A1920;
      --text-muted: #6E525D;
      --text-soft: #967783;
      --rose: #D45B84;
      --rose-dark: #B5436A;
      --rose-badge-bg: #FBE3EC;
      --rose-badge-text: #A8375E;
      --mint-bg: #E8F6F0;
      --mint-text: #1E6B4E;
      --amber-bg: #FFF4E2;
      --amber-text: #8F560A;
      --danger-bg: #FDECEC;
      --danger-text: #A62626;
      --shadow-sm: 0 2px 10px rgba(180, 67, 106, 0.06);
      --shadow-md: 0 8px 24px rgba(180, 67, 106, 0.12);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --radius-pill: 999px;
      --nav-height: 70px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F4E4EA;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .phone-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(74, 24, 43, 0.14);
    }

    @media (min-width: 520px) {
      body {
        padding: 16px;
        align-items: center;
      }
      .phone-shell {
        height: min(910px, calc(100dvh - 32px));
        border-radius: 36px;
        border: 6px solid #3B232C;
      }
    }

    .topbar {
      background: rgba(253, 247, 249, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      z-index: 20;
      flex-shrink: 0;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, #E3789C, var(--rose-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(181, 67, 106, 0.24);
    }

    .brand-title {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-status {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--rose-badge-text);
      font-size: 11.5px;
      font-weight: 750;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .macro-strip {
      margin-top: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }

    .macro-item-val {
      font-size: 12px;
      font-weight: 750;
      color: var(--text-main);
    }

    .macro-item-lbl {
      font-size: 10px;
      color: var(--text-soft);
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      scroll-behavior: smooth;
    }

    .section-gap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 750;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .card-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 0;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    .btn-primary {
      background: var(--rose);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(212, 91, 132, 0.25);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: var(--rose-dark);
    }

    .btn-secondary {
      background: var(--bg-soft);
      color: var(--rose-badge-text);
      border: 1px solid var(--border-strong);
      font-weight: 700;
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary:active {
      background: var(--bg-tint);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      font-weight: 650;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 11.5px;
      border-radius: var(--radius-sm);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding-bottom: 2px;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 650;
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    .chip.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--rose-badge-bg);
      color: var(--rose-badge-text);
    }

    .badge-mint {
      background: var(--mint-bg);
      color: var(--mint-text);
    }

    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .recipe-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recipe-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .recipe-title {
      font-size: 14.5px;
      font-weight: 750;
      margin: 0;
    }

    .recipe-price {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--rose-dark);
      white-space: nowrap;
    }

    .macros-line {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-soft);
      padding: 6px 9px;
      border-radius: var(--radius-sm);
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(212, 91, 132, 0.14);
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
    }

    .check-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
    }

    .check-item.done .check-box {
      background: var(--rose);
      border-color: var(--rose);
    }

    .check-item.done .check-label {
      text-decoration: line-through;
      color: var(--text-soft);
    }

    .check-label {
      font-size: 13px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-track {
      height: 8px;
      background: var(--bg-tint);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #E3789C, var(--rose-dark));
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .progress-fill-mint {
      height: 100%;
      background: linear-gradient(90deg, #43B88C, #1E6B4E);
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .goal-box {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px;
    }

    .pantry-group-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--rose-dark);
      margin: 8px 0 5px;
    }

    .bmi-bar {
      position: relative;
      height: 10px;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, #8EC5FC 0%, #7ED9A6 25%, #7ED9A6 55%, #F7C97E 78%, #F28B82 100%);
      margin: 10px 0 6px;
    }

    .bmi-marker {
      position: absolute;
      top: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--rose-dark);
      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.28);
      transform: translateX(-50%);
    }

    .satiety-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sat-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 750;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-muted);
    }

    .sat-btn.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }

    .bottom-nav {
      height: var(--nav-height);
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      flex-shrink: 0;
      z-index: 20;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 650;
      color: var(--text-soft);
      padding: 4px 2px;
    }

    .nav-btn.active {
      color: var(--rose-dark);
      font-weight: 800;
    }

    .nav-icon {
      font-size: 16px;
      line-height: 1.1;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 25, 32, 0.42);
      backdrop-filter: blur(2px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-width: 440px;
      max-height: 86dvh;
      background: var(--bg-app);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .sheet-header {
      padding: 10px 16px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-strong);
      margin: 0 auto 10px;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      position: fixed;
      bottom: calc(var(--nav-height) + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #2A1920;
      color: #fff;
      font-size: 12.5px;
      font-weight: 650;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 80;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-note {
      text-align: center;
      padding: 20px 12px;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--bg-soft);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-strong);
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <div class="brand-icon">N</div>
          <div>
            <div class="brand-title">NeatPrep &amp; NutriTrack</div>
            <div class="brand-sub" id="headerSub">REWE · Ticket real L–V</div>
          </div>
        </div>
        <div class="pill-status" id="headerBudgetPill">0,00 € / 45,00 €</div>
      </div>
      <div class="macro-strip" id="headerMacroStrip"></div>
    </header>

    <main class="scroll-area" id="mainContent"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-btn active" data-tab="hoy" onclick="switchTab('hoy')">
        <span class="nav-icon">⚡</span>
        <span>Hoy</span>
      </button>
      <button class="nav-btn" data-tab="recetas" onclick="switchTab('recetas')">
        <span class="nav-icon">🍲</span>
        <span>Recetas</span>
      </button>
      <button class="nav-btn" data-tab="tapers" onclick="switchTab('tapers')">
        <span class="nav-icon">🥡</span>
        <span>Tápers</span>
      </button>
      <button class="nav-btn" data-tab="super" onclick="switchTab('super')">
        <span class="nav-icon">🛒</span>
        <span>Súper</span>
      </button>
      <button class="nav-btn" data-tab="progreso" onclick="switchTab('progreso')">
        <span class="nav-icon">💗</span>
        <span>Progreso</span>
      </button>
      <button class="nav-btn" data-tab="cocina" onclick="switchTab('cocina')">
        <span class="nav-icon">⚙️</span>
        <span>Cocina</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" onclick="handleBackdropClick(event)">
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-header">
        <div class="sheet-handle"></div>
        <div class="row-between">
          <strong id="sheetTitle" style="font-size:15px;">Detalle</strong>
          <button class="btn-ghost" onclick="closeSheet()">✕ Cerrar</button>
        </div>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "neatprep_nutritrack_v6";

    // Precios base REWE por kg/L/ud + formato de envase real comercial
    const DEFAULT_PRICES = {
      pechuga_pollo: { name: "Pechuga de pollo", unit: "kg", aisle: "Carnes", price: 11.32, packSize: 0.6, packLabel: "bandeja 600 g" },
      carne_magra: { name: "Carne magra / molida res", unit: "kg", aisle: "Carnes", price: 17.98, packSize: 0.5, packLabel: "bandeja 500 g" },
      salmon: { name: "Filete de salmón", unit: "kg", aisle: "Pescados", price: 28.97, packSize: 0.3, packLabel: "pack 300 g" },
      atun_lata: { name: "Atún al natural", unit: "ud", aisle: "Despensa", price: 1.59, packSize: 1, packLabel: "lata 150 g" },
      lentejas: { name: "Lentejas secas", unit: "kg", aisle: "Despensa", price: 3.70, packSize: 0.5, packLabel: "paquete 500 g" },
      arroz: { name: "Arroz basmati / integral", unit: "kg", aisle: "Despensa", price: 2.49, packSize: 1.0, packLabel: "bolsa 1 kg" },
      pasta: { name: "Tallarines / pasta", unit: "kg", aisle: "Despensa", price: 2.39, packSize: 0.5, packLabel: "paquete 500 g" },
      tomate: { name: "Tomate fresco / triturado", unit: "kg", aisle: "Verduras", price: 3.29, packSize: 0.5, packLabel: "pack 500 g" },
      espinaca: { name: "Espinaca fresca", unit: "kg", aisle: "Verduras", price: 7.99, packSize: 0.15, packLabel: "bolsa 150 g" },
      albahaca: { name: "Albahaca fresca", unit: "ud", aisle: "Verduras", price: 1.49, packSize: 1, packLabel: "maceta / manojo" },
      zanahoria: { name: "Zanahoria", unit: "kg", aisle: "Verduras", price: 1.99, packSize: 1.0, packLabel: "bolsa 1 kg" },
      papa: { name: "Papa", unit: "kg", aisle: "Verduras", price: 2.19, packSize: 1.5, packLabel: "malla 1,5 kg" },
      pepino: { name: "Pepino", unit: "ud", aisle: "Verduras", price: 0.89, packSize: 1, packLabel: "unidad" },
      lechuga: { name: "Lechuga / hojas verdes", unit: "ud", aisle: "Verduras", price: 1.19, packSize: 1, packLabel: "bolsa / pieza" },
      cebolla_ajo: { name: "Cebolla y ajo", unit: "kg", aisle: "Verduras", price: 2.69, packSize: 0.5, packLabel: "malla 500 g" },
      palta: { name: "Palta / aguacate", unit: "ud", aisle: "Verduras", price: 1.69, packSize: 1, packLabel: "unidad" },
      limon: { name: "Limón", unit: "ud", aisle: "Verduras", price: 0.49, packSize: 1, packLabel: "unidad" },
      arvejas: { name: "Arvejas verdes", unit: "kg", aisle: "Verduras", price: 3.49, packSize: 0.3, packLabel: "bolsa/lata 300 g" },
      aceite_oliva: { name: "Aceite de oliva virgen extra", unit: "L", aisle: "Despensa", price: 17.98, packSize: 0.5, packLabel: "botella 500 ml" },
      queso_fresco: { name: "Queso fresco light / ricotta", unit: "kg", aisle: "Lácteos", price: 8.99, packSize: 0.25, packLabel: "tarrina 250 g" },
      especias_aji: { name: "Ají amarillo / comino / sal", unit: "ud", aisle: "Despensa", price: 1.89, packSize: 1, packLabel: "frasco / sobre" }
    };

    const PANTRY_OPTIONS = [
      { key: "aceite_oliva", label: "Aceite de oliva", group: "Básicos y condimentos" },
      { key: "especias_aji", label: "Sal / pimienta / comino / ají", group: "Básicos y condimentos" },
      { key: "cebolla_ajo", label: "Cebolla / ajo", group: "Básicos y condimentos" },
      { key: "limon", label: "Limón", group: "Básicos y condimentos" },
      { key: "arroz", label: "Arroz", group: "Granos, pasta y latas" },
