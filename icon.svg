<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E45C8B"/>
      <stop offset="100%" stop-color="#BA3261"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FDEBF1" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Subtle concentric wellness ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="22"/>
  <path d="M 256 80 A 176 176 0 1 1 114 360" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"/>
  <!-- Accent dot at ring start -->
  <circle cx="256" cy="80" r="11" fill="#FFFFFF"/>
  <!-- Crisp geometric 'Lu' monogram -->
  <text x="256" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="168" font-weight="800" letter-spacing="-6" fill="#FFFFFF">Lu</text>
</svg>
